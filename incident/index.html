<script>
/* ---- Page core: helpers, storage and routing (records stay in this browser) ---- */
const $=s=>document.querySelector(s);
function e(v){return String(v==null?'':v).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));}
function safeUrl(u){try{const x=new URL(String(u).trim());return x.protocol==='http:'||x.protocol==='https:'?x.href:'';}catch(_){return '';}}
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const TODAY=isoOf(new Date());
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return isoOf(d);}
const daysTo=s=>Math.round((parse(s)-parse(TODAY))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{if(!isDate(s))return '—';const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();};
function dueText(s,soon){if(!isDate(s))return '—';const n=daysTo(s);soon=soon||30;if(n<0)return `<span class="badt">${fd(s)}</span>`;if(n<=soon)return `<span style="color:var(--amber);font-weight:700">${fd(s)}</span>`;return fd(s);}

  setParties(Array.isArray(j.parties)&&j.parties.length?j.parties:null,j.parties_updated_by,j.parties_updated_at);AUTH.state='ready';AUTH.msg='';return true;}

/* Saving: changes are queued per incident and sent a moment after typing stops */
const DIRTY=new Set(),INFLIGHT=new Set(),CONFLICT={};let saveTimer=null,lastErr='';
function save(){if(V.view==='incident'&&V.a&&DB.incidents[V.a])queueSave(V.a);}
function queueSave(id){if(CONFLICT[id])return;DIRTY.add(id);saveState();clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
async function flush(){for(const id of [...DIRTY]){if(INFLIGHT.has(id)||CONFLICT[id])continue;const x=DB.incidents[id];DIRTY.delete(id);if(!x)continue;INFLIGHT.add(id);saveState();
  const {status,j}=await api('POST',{action:'save',incident:x,version:(META[id]||{}).version||0,stage:typeof incStageOf==='function'?incStageOf(x):''});INFLIGHT.delete(id);
  if(status===200){META[id]={version:j.version,updated_at:j.updated_at,updated_by:j.updated_by};lastErr='';}
  else if(status===409){CONFLICT[id]=j;lastErr='';if(V.a===id)render();}
  else if(status===401||status===403){DIRTY.add(id);lastErr=j.error||'Your sign-in has expired.';AUTH.state='signin';EDITOR=null;render();}
  else{DIRTY.add(id);lastErr=j.error||'Not saved.';clearTimeout(saveTimer);saveTimer=setTimeout(flush,8000);}
  saveState();}
 if([...DIRTY].some(id=>!INFLIGHT.has(id)&&!CONFLICT[id])&&!lastErr){clearTimeout(saveTimer);saveTimer=setTimeout(flush,300);}}

const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
/* Fill any missing fields from a blank record, keeping only keys that are safe to copy */
function fillBlank(b,x){if(!isObj(x))return b;Object.keys(x).forEach(k=>{if(k==='__proto__'||k==='constructor'||k==='prototype')return;const v=x[k];b[k]=isObj(b[k])&&isObj(v)?fillBlank(b[k],v):v;});return b;}

 f.text().then(txt=>{let d;try{d=JSON.parse(txt);}catch(_){return toast('That file is not valid JSON');}
  const src=isObj(d)&&isObj(d.incidents)?d.incidents:null;if(!src)return toast('No incidents found in that file');
  let added=0,replaced=0;Object.values(src).forEach(r=>{if(!isObj(r)||typeof r.id!=='string'||!/^INC-[A-Za-z0-9-]{1,40}$/.test(r.id))return;const ov=isObj(r.ov)?r.ov:{};const x=fillBlank(incBlank(r.id,String(ov.ref||r.id)),r);x.id=r.id;try{incNorm(x);}catch(_){return;}if(DB.incidents[r.id])replaced++;else added++;DB.incidents[r.id]=x;queueSave(r.id);});
  if(!added&&!replaced)return toast('No valid incidents found in that file');
  render();toast(`Imported ${added} new${replaced?`, replaced ${replaced}`:''} incident${added+replaced===1?'':'s'}`);});});
