<!DOCTYPE html>
<!-- Colaboree — Cyber Governance Toolkit — hub (Teal + Slate) -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Cyber Governance Toolkit — Colaboree</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --nav:#0F3D3E;
  --action:#118D8A;
  --accent:#4CC9C0;
  --bg:#F2F5F7;
  --surface:#FFFFFF;
  --text:#223037;
  --text2:#6B7C85;
  --line:#E1E7EA;
  --accent-tint:rgba(76,201,192,0.12);
  --action-tint:rgba(17,141,138,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Source Serif 4',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* NAV */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;height:64px;
  background:var(--nav);
}
.nav-logo{
  font-family:'Source Serif 4',serif;font-weight:600;font-size:1.15rem;
  color:#fff;letter-spacing:.01em;display:flex;align-items:baseline;gap:10px;
}
.nav-logo .mark{color:var(--accent);}
.nav-sub{
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:rgba(255,255,255,.55);
  letter-spacing:.06em;text-transform:uppercase;
  border-left:1px solid rgba(255,255,255,.25);padding-left:10px;margin-left:2px;
}
.nav-right{
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:rgba(255,255,255,.6);
  display:flex;align-items:center;gap:8px;
}
.nav-right .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}

/* HERO */
.hero{max-width:840px;margin:0 auto;padding:76px 32px 48px;text-align:center;}
.hero-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--action);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:18px;
}
.hero h1{
  font-family:'Source Serif 4',serif;font-weight:600;
  font-size:clamp(2rem,4.5vw,3rem);line-height:1.15;color:var(--text);
  margin-bottom:16px;letter-spacing:-.01em;
}
.hero p{
  font-size:.95rem;color:var(--text2);max-width:520px;margin:0 auto;line-height:1.7;
}

/* TILES */
.tiles{
  max-width:760px;margin:44px auto 0;padding:0 32px 96px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px;
}
.tile{
  aspect-ratio:1/1;
  background:var(--surface);
  border:1px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  text-decoration:none;color:inherit;padding:20px;text-align:center;
  transition:box-shadow .15s, transform .15s, border-color .15s;
}
.tile:not(.ghost):hover{
  box-shadow:0 10px 26px rgba(15,61,62,0.12);transform:translateY(-3px);
  border-color:var(--accent);
}
.tile.ghost{border-style:dashed;opacity:.5;cursor:default;}
.tile-icon{
  width:46px;height:46px;color:var(--action);
  display:flex;align-items:center;justify-content:center;
}
.tile-icon svg{width:100%;height:100%;}
.tile.ghost .tile-icon{color:var(--text2);}
.tile-title{
  font-family:'Source Serif 4',serif;font-weight:600;font-size:1.05rem;
  color:var(--text);line-height:1.3;
}
.tile.ghost .tile-title{color:var(--text2);font-weight:500;font-size:.9rem;}
.tile-status{
  display:flex;align-items:center;gap:5px;
  font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text2);
}
.tile-status .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
.tile.ghost .tile-status .dot{background:var(--text2);}

footer{
  border-top:1px solid var(--line);
  padding:26px 32px;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--text2);
}

@media(max-width:680px){
  .tiles{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:420px){
  .tiles{grid-template-columns:1fr 1fr;gap:14px;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <span><span class="mark">C</span>olaboree</span>
    <span class="nav-sub">Cyber Governance Toolkit</span>
  </div>
  <div class="nav-right">
    <span class="dot"></span> 2 tools live
  </div>
</nav>

<section class="hero">
  <div class="hero-eyebrow">cyber.colaboree.com</div>
  <h1>Cyber Governance Toolkit</h1>
  <p>Open governance tooling. Growing over time.</p>
</section>

<div class="tiles">

  <a class="tile" href="/thirdparty">
    <div class="tile-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7 3v5c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div class="tile-title">Third-Party Vendor Assessment</div>
    <div class="tile-status"><span class="dot"></span>Live</div>
  </a>

  <a class="tile" href="/tra">
    <div class="tile-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21a9 9 0 1 1 9-9"/>
        <path d="M12 12l5-5"/>
        <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <path d="M6 12h1.5M12 6v1.5"/>
      </svg>
    </div>
    <div class="tile-title">Cyber Threat Risk Assessment</div>
    <div class="tile-status"><span class="dot"></span>Live</div>
  </a>

  <div class="tile ghost">
    <div class="tile-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" stroke-dasharray="3 4"/>
        <path d="M12 8v8M8 12h8"/>
      </svg>
    </div>
    <div class="tile-title">More soon</div>
    <div class="tile-status"><span class="dot"></span>Planned</div>
  </div>

</div>

<footer>Colaboree · Cyber Governance Toolkit · open-source, self-hosted tooling</footer>

</body>
</html>
