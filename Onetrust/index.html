<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTM Asset Governance</title>
<style>
/* Layout: OneTrust-style concept — navy top bar, pale canvas, white panels with fact cards; follows the supplied reference mockup (single light theme by design) */
:root{--ink:#203047;--muted:#65748a;--line:#e2e8f0;--pale:#f5f7fa;--blue:#1867a9;--blue-dk:#145486;--nav:#16324f;--red:#b63c43;--amber:#a66717;--green:#267648;--white:#fff;--tint:#f9fbfd;--hover:#f7fbff;--note-bg:#eef5fb;--note-line:#d4e6f5;--note-ink:#34516d;--field:#ccd6e2;--f:Arial,Helvetica,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--pale);color:var(--ink);font:14px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:var(--ink)}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #86b9e3;outline-offset:2px}
a{color:var(--blue)}
.top{min-height:62px;background:var(--nav);display:flex;align-items:center;gap:28px;padding:0 30px;color:var(--white)}
.brand{font-size:19px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}.brand small{opacity:.7;font-size:12px;font-weight:700}
.topnav{display:flex;gap:20px;margin-left:30px}
.topnav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--white);padding:19px 0 17px;opacity:.9}
.topnav button.active{border-bottom-color:#6ab8e8;font-weight:700;opacity:1}
.account{margin-left:auto;border:1px solid #6a8298;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;font-weight:700;flex:none}
main{max-width:1480px;margin:0 auto;padding:25px 30px 50px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:12px}
.crumb button{border:0;background:none;color:var(--blue);padding:0;font-size:12px}
.titlebar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}
h1{font-size:27px;margin:0 0 4px;letter-spacing:-.4px;text-wrap:balance}
h2{font-size:17px;margin:0 0 12px;text-wrap:balance}
h3{font-size:15px;margin:0 0 6px}
p{margin:0}
.sub{color:var(--muted)}
.sample{background:#e8f2fb;color:#245c83;border:1px solid #cde3f4;border-radius:4px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;text-transform:uppercase}
.panel{background:var(--white);border:1px solid var(--line);border-radius:7px;box-shadow:0 1px 3px #1b314910}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{border:1px solid var(--field);border-radius:5px;background:var(--white);padding:9px 11px}
.toolbar input{min-width:240px;flex:1}.toolbar select{min-width:160px}
.count{margin-left:auto;align-self:center;color:var(--muted)}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--tint);font-weight:700}
th,td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
.num,td.nowrap{font-variant-numeric:tabular-nums}
.open{border:0;background:none;color:var(--blue);font-weight:700;text-align:left;padding:0}
.open:hover{text-decoration:underline}
.pill{display:inline-block;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.red{background:#fce9e8;color:var(--red)}.pill.amber{background:#fff1dd;color:var(--amber)}.pill.green{background:#e8f6ec;color:var(--green)}.pill.gray{background:#eef2f6;color:#5b6a7b}.pill.blue{background:#e8f2fb;color:#245c83}.pill.solidred{background:var(--red);color:var(--white)}
.empty{padding:34px;color:var(--muted);text-align:center}
.back{border:0;background:none;color:var(--blue);font-weight:700;padding:0;margin-bottom:17px}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:8px 0 0}
.facts.three{grid-template-columns:repeat(5,minmax(0,1fr))}
.fact{border:1px solid var(--line);border-radius:5px;background:var(--white);padding:11px 13px;min-width:0}
.fact label,.fact .lab{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.fact strong{font-size:13px;overflow-wrap:anywhere}
.fact .small{display:block}
.fact.pending strong{color:var(--muted)}
.alert{background:#fff4f0;border:1px solid #f2d5cd;border-left:4px solid var(--red);border-radius:5px;padding:13px 16px;margin:0 0 18px;display:flex;gap:12px;align-items:flex-start}
.alert strong{white-space:nowrap;color:#9d343a}
.alert.amber{background:#fff8ec;border-color:#f1dfc0;border-left-color:var(--amber)}
.alert.amber strong{color:var(--amber)}
.alert .items{color:#773f41}
.alert.amber .items{color:#6f4e1d}
.alert .items button{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-decoration-color:#d7a9a5;text-underline-offset:2px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 2px;color:var(--muted);font-weight:700;white-space:nowrap}
.tabs button.selected{border-bottom-color:var(--blue);color:var(--blue)}
.grid{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(330px,1fr);gap:18px}
.section{padding:17px 18px;margin-bottom:18px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}
.mini td,.mini th{padding:9px 7px}
.mini td:first-child,.mini th:first-child{padding-left:0}
.mini td:last-child,.mini th:last-child{padding-right:0}
.number{font-size:23px;font-weight:700;color:var(--nav)}
.legend{font-size:12px;color:var(--muted);margin-top:12px}
.notice{background:var(--note-bg);border:1px solid var(--note-line);padding:12px 14px;border-radius:5px;margin:0 0 18px;color:var(--note-ink)}
.notice.warn{background:#fff8ec;border-color:#f1dfc0;color:#6f4e1d}
.details{margin-top:16px}.details summary{color:var(--blue);cursor:pointer;font-weight:700}.details p{margin-top:8px;color:var(--muted)}
.footer{font-size:11px;color:var(--muted);margin-top:22px}
.nowrap{white-space:nowrap}
.coverage-group{font-size:11px;color:var(--blue);font-weight:700;letter-spacing:.035em;margin:16px 0 7px;text-transform:uppercase}
.coverage-group:first-child{margin-top:4px}
.coverage-row{width:100%;border:0;border-bottom:1px solid var(--line);background:var(--white);display:grid;grid-template-columns:minmax(0,1fr) 24px;align-items:center;gap:8px;padding:10px 1px;text-align:left}
.coverage-row.wide{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr) 24px}
.coverage-row:hover{background:var(--hover)}
.coverage-row.sel{background:var(--note-bg)}
.coverage-row .meta{font-size:12px;color:var(--muted)}
.coverage-dot{width:16px;height:16px;border-radius:50%;display:inline-block;justify-self:center;border:2px solid var(--white);box-shadow:0 0 0 1px #c5d1db;flex:none}
.coverage-dot.green{background:var(--green)}.coverage-dot.amber{background:var(--amber)}.coverage-dot.red{background:var(--red)}
.coverage-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px}
.coverage-legend span{display:inline-flex;align-items:center;gap:6px}
.coverage-legend .coverage-dot{width:11px;height:11px}
.primary{border:0;border-radius:5px;background:var(--blue);color:var(--white);padding:9px 13px;font-weight:700}
.primary:hover{background:var(--blue-dk)}
.secondary{border:1px solid var(--blue);border-radius:5px;background:var(--white);color:var(--blue);padding:8px 12px;font-weight:700}
.secondary:hover{background:var(--hover)}
.danger{border:1px solid var(--red);border-radius:5px;background:var(--white);color:var(--red);padding:8px 12px;font-weight:700}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lab{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--field);border-radius:4px;padding:9px 10px;background:var(--white)}
.field textarea{min-height:75px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:#f3f6f9;color:#5b6a7b}
.err{color:var(--red);margin:12px 0 0;font-weight:700}
.err:empty{display:none}
.checks label{display:block;font-size:13px;margin:7px 0}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.checkgrid fieldset{border:1px solid var(--line);border-radius:5px;padding:12px;margin:0;min-width:0}
.checkgrid legend{font-size:13px;font-weight:700}
.checkgrid label{display:block;font-size:13px;margin:7px 0}
.preview{margin-top:14px;font-weight:700}
.question{display:grid;grid-template-columns:45px minmax(180px,1fr) minmax(290px,1.2fr);gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.question select{width:100%;padding:8px;border:2px solid #93bad8;border-radius:4px;background:#f8fcff;color:#173d5d}
.question select:disabled{border-color:var(--field);background:#f3f6f9}
.question .qid{font-weight:700;color:var(--muted)}
.question .chosen{grid-column:2/-1;font-size:12px;color:var(--muted)}
.dimhead{margin:18px 0 4px;font-size:16px}
.bilsummary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.bilsummary .fact{background:var(--tint)}
.bilsummary .number{font-size:21px;display:block}
.bilsummary.proposed .fact{border:1px dashed var(--amber);background:repeating-linear-gradient(135deg,#fff8ec 0 8px,#fffdf8 8px 16px)}
.proposed-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--amber);text-transform:uppercase;margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin-top:10px}
.kv div strong{display:block}
.kv div span{color:var(--muted)}
.vendor-q{padding:17px 0;border-bottom:1px solid var(--line)}
.vendor-q:last-child{border-bottom:0}
.vendor-q p{margin:5px 0}
.vendor-q .response-row{display:grid;grid-template-columns:180px 1fr;gap:12px;margin-top:10px}
.vendor-q .evidence{font-size:12px;color:var(--muted);background:#f8fafc;padding:9px 10px;border-left:3px solid #c9dceb;margin-top:10px}
.health-section>summary{cursor:pointer;font-size:16px;font-weight:700;display:flex;justify-content:space-between;gap:12px}
.health-question{padding:18px 0;border-top:1px solid var(--line)}
.health-question>strong{display:block;margin-bottom:10px}
.health-question>select{width:min(100%,380px);padding:9px;border:1px solid #9dc2dc;border-radius:5px;background:var(--white)}
.health-control{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.health-control:last-child{border-bottom:0}
.health-control select{width:100%;padding:8px;border:1px solid #9dc2dc;border-radius:5px;background:var(--white)}
.health-matrix{border:1px solid var(--line);border-radius:5px;padding:4px 12px}
.gapmark{color:var(--red);font-weight:700}
.stdpanel{margin:18px 0 0;background:var(--tint)}
.comp{border:1px solid var(--line);border-radius:5px;background:var(--white);padding:12px 14px;margin-top:12px}
.comp .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tp-sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.okt{color:var(--green);font-weight:700}.badt{color:var(--red);font-weight:700}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--nav);color:var(--white);padding:10px 14px;border-radius:5px;max-width:calc(100vw - 32px);z-index:9}
@media(max-width:1050px){.facts,.facts.three{grid-template-columns:repeat(3,minmax(0,1fr))}.bilsummary{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)}.topnav{gap:14px;margin-left:8px}.coverage-row.wide{grid-template-columns:minmax(0,1fr) 24px}.coverage-row.wide .meta{grid-column:1}}
@media(max-width:760px){.top{flex-wrap:wrap;gap:0 16px}.topnav{order:3;width:100%;margin:0;overflow-x:auto;gap:18px}.topnav button{padding:8px 0 10px;white-space:nowrap}.brand{padding:14px 0 6px}.account{margin-top:8px}}
@media(max-width:650px){main{padding:18px 16px}.top{padding:0 16px}.facts,.facts.three{grid-template-columns:repeat(2,minmax(0,1fr))}.bilsummary{grid-template-columns:repeat(2,minmax(0,1fr))}.question{grid-template-columns:40px minmax(0,1fr)}.question select,.question .chosen{grid-column:2}.vendor-q .response-row,.formgrid,.checkgrid,.kv{grid-template-columns:minmax(0,1fr)}.health-control{grid-template-columns:minmax(0,1fr)}.table-scroll table{min-width:680px}.titlebar{align-items:flex-start;flex-direction:column}.alert{display:block}.alert strong{display:block;margin-bottom:5px}.toolbar input{min-width:0}.count{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">OneTrust <small>concept</small></div>
  <nav class="topnav" aria-label="Modules">
    <button data-nav="register">Home</button>
    <button data-nav="register" data-main="1">Asset governance</button>
    <button data-nav="assessments">Assessments</button>
    <button data-nav="allrisks">Risks</button>
    <button data-nav="reports">Reports</button>
  </nav>
  <div class="account" aria-label="Example user">G</div>
</header>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ================= MTM content taken from the supplied reference mockup ================= */
const HEALTH={"sections": [{"number": 1, "title": "General", "page": 3, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A9210", "questions": [{"id": "7", "label": "Are all employees, contractors, vendors and other authorised users who access, use, support or manage the system aware of and following their cybersecurity responsibilities and the MTM Acceptable Use Standard (A9210)?", "type": "choice"}, {"id": "8", "label": "For Q1 - General, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 2, "title": "Malware Protection", "page": 4, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A9658", "questions": [{"id": "9", "label": "Is the system protected from malicious software through up-to-date protection, automatic scanning, monitoring and incident response?", "type": "choice"}, {"id": "10", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "AM.1.10-4-0", "code": "AM.1.10", "label": "Malware protection is installed, supported and regularly updated on all applicable systems."}, {"id": "AM.1.06-4-1", "code": "AM.1.06", "label": "Files, emails and storage media are automatically scanned for malware."}, {"id": "AM.1.16-4-2", "code": "AM.1.16", "label": "Malware alerts and incidents are centrally monitored, investigated and remediated."}]}, {"id": "11", "label": "For Q2 - Malware Protection, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 3, "title": "Application Security", "page": 5, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10979", "questions": [{"id": "12", "label": "Are applications, databases and system connections securely designed, developed, tested, released, protected and maintained throughout their lifecycle?", "type": "choice"}, {"id": "13", "label": "Is there a documented process to make sure the application is developed securely, properly checked and approved before changes are made?", "type": "choice"}, {"id": "14", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "AS.1.01-5-0", "code": "AS.1.01", "label": "A documented secure development process is followed."}, {"id": "AS.1.06-5-1", "code": "AS.1.06", "label": "Changes are security reviewed, tested and approved before deployment."}, {"id": "AS.1.07-5-2", "code": "AS.1.07", "label": "Security issues and product documentation are addressed before release."}]}, {"id": "15", "label": "Are the live system and development system kept separate and protected so that unauthorised users cannot access live systems or data?", "type": "choice"}, {"id": "16", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "AS.2.01-6-0", "code": "AS.2.01", "label": "Development and production environments must be kept separate."}, {"id": "AS.2.02-6-1", "code": "AS.2.02", "label": "Security-related changes must be tested before production."}, {"id": "AS.2.03-6-2", "code": "AS.2.03", "label": "Production data is not used in development or testing unless equally protected and kept separate from production data sources."}]}, {"id": "17", "label": "Is the application securely set up to ensure that only authorised users can access it, information entered is properly checked, sensitive data is protected and the application can recover from a failure?", "type": "choice"}, {"id": "18", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "AS.3.01-7-0", "code": "AS.3.01", "label": "Applications are deployed only on authorised and securely configured systems."}, {"id": "AS.3.03-7-1", "code": "AS.3.03", "label": "User input, access, sessions, application libraries and sensitive data are securely managed and protected."}, {"id": "AS.3.11-7-2", "code": "AS.3.11", "label": "Application and database components are separated, with capacity, backup and recovery controls in place."}, {"id": "AS.3.15-7-3", "code": "AS.3.15", "label": "Internet-facing applications are protected by secure headers and a Web Application Firewall."}]}, {"id": "19", "label": "Are new applications and major changes security tested against MTM requirements and checked for vulnerabilities before release?", "type": "choice"}, {"id": "20", "label": "Does the application database have a clear owner, restricted access and encryption for confidential or restricted data?", "type": "choice"}, {"id": "21", "label": "Does each system connection (e.g. Application Programming Interfaces (APIs)) have an assigned owner and controls to ensure only authorised users and systems can access it securely?", "type": "choice"}, {"id": "22", "label": "For Q3 - Application Security, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 4, "title": "Threat and Risk Assessment", "page": 9, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A13023", "questions": [{"id": "23", "label": "Has an approved cybersecurity risk assessment been completed and kept current, with identified risks assigned to owners and managed through agreed actions in accordance with MTM risk management requirements?", "type": "choice"}, {"id": "24", "label": "Are cybersecurity risks identified, assessed, assigned to owners and managed under the MTM Integrated Risk Management Procedure (A2023)?", "type": "choice"}, {"id": "25", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "RC.1.01-10-0", "code": "RC.1.01", "label": "Cybersecurity risks must be managed in accordance with MTM\u2019s Integrated Risk Management Procedure (A2023)."}, {"id": "RC.1.02-10-1", "code": "RC.1.02", "label": "A Cyber Threat Risk Assessment must be completed for new systems and significant changes."}, {"id": "RC.1.03-10-2", "code": "RC.1.03", "label": "Each identified cybersecurity risk must have an assigned risk owner."}]}, {"id": "26", "label": "Are cybersecurity risk assessments completed using approved methods, including system scope, threats, vulnerabilities, business impact, risk rating and treatment actions?", "type": "choice"}, {"id": "27", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "RC.2.02-11-0", "code": "RC.2.02", "label": "The system scope, boundaries, assets and relevant experts are clearly identified."}, {"id": "RC.2.05-11-1", "code": "RC.2.05", "label": "Cyber threats, weaknesses and business impacts are assessed, rated and prioritised."}, {"id": "RC.2.11-11-2", "code": "RC.2.11", "label": "Risk actions, owners, exceptions and acceptance decisions are documented and managed."}]}, {"id": "28", "label": "Does the system align with VPDSS and Franchise Agreement cybersecurity obligations, including security measures, maturity assessments and breach reporting?", "type": "choice"}, {"id": "29", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "R3.01-12-0", "code": "R3.01", "label": "The system complies with Victorian Protective Data Security Standards (VPDSS) requirements a nd Franchise Agreement cybersecurity requirements."}, {"id": "RC.3.03-12-1", "code": "RC.3.03", "label": "Personal information, important records and systems are protected from internal and external threats."}, {"id": "RC.3.09-12-2", "code": "RC.3.09", "label": "Security incidents and non- compliance are promptly reported, managed and resolved."}]}, {"id": "30", "label": "For Q4 - Threat & Risk Assessment, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 5, "title": "Data Encryption & Key Management", "page": 13, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10492", "questions": [{"id": "31", "label": "Is confidential or restricted MTM information protected using approved encryption when it is stored or transferred, with encryption keys and certificates securely managed?", "type": "choice"}, {"id": "32", "label": "Is confidential or restricted data protected with approved encryption during transmission, including concealing communication patterns where required?", "type": "choice"}, {"id": "33", "label": "Is confidential or restricted data encrypted using approved methods when stored within MTM infrastructure or in external and cloud services?", "type": "choice"}, {"id": "34", "label": "Are approved encryption algorithms, protocols and key strengths used?", "type": "choice"}, {"id": "35", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "ES3.01-15-0", "code": "ES3.01", "label": "Only approved encryption and hashing methods are used, such as AES- 128/192/256, SHA-2, RSA, DH, ECDH and ECDSA."}, {"id": "ES3.03-15-1", "code": "ES3.03", "label": "Cryptographic algorithms must provide at least 112 bits of effective security strength."}, {"id": "ES3.04-15-2", "code": "ES3.04", "label": "Encryption keys meet the required minimum strength, such as RSA and DH keys of at least 2048 bits and approved elliptic curves such as NIST P- 256, P-384 or P- 521."}, {"id": "ES3.08-15-3", "code": "ES3.08", "label": "Only approved secure communication protocols are used, such as TLS 1.2 or above, SSH 2.0, IPsec, S/MIME, OpenPGP, WPA2 or WPA3."}, {"id": "ES3.09-15-4", "code": "ES3.09", "label": "TLS connections must use TLS 1.2 or above with approved encryption, secure key exchange, SHA- 2 certificates, disabled compression and Perfect Forward Secrecy."}, {"id": "ES3.10-15-5", "code": "ES3.10", "label": "SSH is securely configured using SSH 2.0, public-key authentication, protected private keys and insecure access or forwarding features disabled."}, {"id": "ES3.12-16-0", "code": "ES3.12", "label": "IPsec is securely configured using ESP, IKE, AES encryption, approved SHA- 2 authentication, strong DH or ECDH key exchange and Perfect Forward Secrecy."}]}, {"id": "36", "label": "Are cryptographic keys and certificates securely managed throughout their lifecycle?", "type": "choice"}, {"id": "37", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "ES4.01-17-0", "code": "ES4.01", "label": "Cryptographic keys are securely managed throughout their lifecycle, including generation, storage, recovery and destruction."}, {"id": "ES4.02-17-1", "code": "ES4.02", "label": "Private keys are securely stored and accessible only to authorised personnel."}, {"id": "ES4.03-17-2", "code": "ES4.03", "label": "Public and internal certificates are issued by approved certificate authorities and meet required validity periods."}, {"id": "ES4.05-17-3", "code": "ES4.05", "label": "Certificates and keys can be promptly revoked when compromised, outdated or no longer required."}]}, {"id": "38", "label": "For Q5 - Data Encryption & Key Management, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 6, "title": "User Identity and Access Management", "page": 18, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10102", "questions": [{"id": "39", "label": "Are user identities, accounts and access rights securely approved, authenticated, protected, reviewed, logged and removed when no longer required?", "type": "choice"}, {"id": "40", "label": "Are authorised users given appropriate access, with access logged, regularly reviewed and removed when no longer required?", "type": "choice"}, {"id": "41", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "IA1.01-18-0", "code": "IA1.01", "label": "User access is approved before it is granted and limited to what is needed."}, {"id": "IA1.05-18-1", "code": "IA1.05", "label": "User sessions and login activity are securely managed and logged."}, {"id": "IA1.08-18-2", "code": "IA1.08", "label": "Accounts are disabled or deleted when no longer required, and default accounts are secured."}]}, {"id": "42", "label": "Is privileged access approved, limited to authorised personnel, logged, regularly reviewed and removed when no longer required?", "type": "choice"}, {"id": "43", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "IA2.01-19-0", "code": "IA2.01", "label": "Privileged access is approved, limited to authorised personnel and used only for administrative tasks."}, {"id": "IA2.04-19-1", "code": "IA2.04", "label": "Privileged accounts are securely restricted and removed when no longer required."}, {"id": "IA2.10-19-2", "code": "IA2.10", "label": "Privileged access and activities are logged and regularly reviewed."}]}, {"id": "44", "label": "Are service accounts approved, limited to the access they need and removed when no longer required?", "type": "choice"}, {"id": "45", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "IA3.01-20-0", "code": "IA3.01", "label": "Service accounts are approved before creation and limited to the minimum access required."}, {"id": "IA3.03-20-1", "code": "IA3.03", "label": "Each system or application uses a unique service account that is not used for normal user activities."}, {"id": "IA3.04-20-2", "code": "IA3.04", "label": "Service accounts are removed when no longer required."}]}, {"id": "46", "label": "Are shared accounts prohibited unless formally approved, assigned an owner and monitored so their use can be traced to individual users?", "type": "choice"}, {"id": "47", "label": "Are temporary and contractor access limited to what is needed, set with an appropriate expiry date (30 days), and disabled when it expires unless formally extended?", "type": "choice"}, {"id": "48", "label": "Are emergency accounts used only when normal or privileged access is unavailable, with credentials changed after each use?", "type": "choice"}, {"id": "49", "label": "Are strong password controls in place to ensure passwords are secure, unique, protected and changed if compromised?", "type": "choice"}, {"id": "50", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "IA7.02-22-0", "code": "IA7.02", "label": "Passwords are strong, unique and not based on common words or publicly available information."}, {"id": "IA7.04-22-1", "code": "IA7.04", "label": "User account passwords must be at least 12 characters, meet complexity requirements, prevent reuse, expire within 365 days and lock after three failed attempts. Privileged account passwords must be at least 20 characters and changed every 30 days."}, {"id": "IA7.05-22-2", "code": "IA7.05", "label": "Privileged, service, emergency and key- management accounts use stronger passwords of at least 20 characters."}, {"id": "IA7.07-22-3", "code": "IA7.07", "label": "Passwords are securely stored, transmitted through encrypted channels and hidden when displayed or printed."}, {"id": "IA7.09-22-4", "code": "IA7.09", "label": "Passwords are changed after first use, reset or suspected compromise, including when exposed, weak or found in a data breach."}]}, {"id": "51", "label": "Is multi-factor authentication used for internet-facing systems handling MTM data, and are all successful and failed attempts logged?", "type": "choice"}, {"id": "52", "label": "For Q6 - User Identity and Access Management, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 7, "title": "Device Security", "page": 24, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10487", "questions": [{"id": "53", "label": "Are MTM-managed mobile devices and approved personal devices securely configured, updated, monitored and restricted to prevent unauthorised access and protect MTM systems and information?", "type": "choice"}, {"id": "54", "label": "Are MTM-managed mobile devices securely configured and protected to prevent unauthorised software installation or changes to security settings?", "type": "choice"}, {"id": "55", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "MB1.01-25-0", "code": "MB1.01", "label": "MTM- managed mobile devices are centrally managed, securely configured, patched and protected with strong authentication."}, {"id": "MB1.02-25-1", "code": "MB1.02", "label": "Users cannot install unapproved applications or disable security controls, and MTM information on devices is encrypted. MTM information is securely removed when a device is no longer managed or in use."}]}, {"id": "56", "label": "Is approved personal devices access limited to approved MTM services, separated from internal networks, and securely maintained by the device owner?", "type": "choice"}, {"id": "57", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "MB2.01-26-0", "code": "MB2.01", "label": "Personal devices operati ng systems and applications are kept up to date by the device owner."}, {"id": "MB2.02-26-1", "code": "MB2.02", "label": "Personal devices access is limited to approved MTM services, protected with multi-factor authentication and separated from MTM internal networks."}, {"id": "MB2.06-26-2", "code": "MB2.06", "label": "Personal devices access is logged, and device owners remain responsible for the operation and support of their devices."}]}, {"id": "58", "label": "For Q7 - Device Security, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 8, "title": "Network Security", "page": 27, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10487", "questions": [{"id": "59", "label": "Is the network securely designed, segmented, configured and monitored, with approved controls for external, remote and wireless access and arrangements to maintain critical services during failures?", "type": "choice"}, {"id": "60", "label": "Is the network securely designed, configured and managed to prevent unauthorised changes?", "type": "choice"}, {"id": "61", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "NS1.01-28-0", "code": "NS1.01", "label": "Network designs, data flows, ownership and service requirements are documented."}, {"id": "NS1.05-28-1", "code": "NS1.05", "label": "Network devices are securely configured, with changes limited to authorised administrators and unused ports or services disabled."}, {"id": "NS1.07-28-2", "code": "NS1.07", "label": "Network management traffic is encrypted, and network security events are logged and monitored."}]}, {"id": "62", "label": "Are network boundaries protected by approved gateways, firewalls and threat controls to block unauthorised access and control data moving between MTM and untrusted networks?", "type": "choice"}, {"id": "63", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "NS2.01-29-0", "code": "NS2.01", "label": "Only authorised devices and required business traffic are allowed on the network."}, {"id": "NS2.02-29-1", "code": "NS2.02", "label": "Firewalls, gateways, DMZs and threat protection controls separate MTM from untrusted networks and allow only approved, encrypted data flows."}, {"id": "NS2.10-29-2", "code": "NS2.10", "label": "Web traffic is securely filtered and logged, and unsafe network methods such as unauthorised IPv6 tunnelling are blocked."}]}, {"id": "64", "label": "Are MTM networks segmented based on system criticality and data sensitivity, to limit unauthorised access and prevent threats from spreading?", "type": "choice"}, {"id": "65", "label": "Is the network and telecommunications infrastructure designed with backup connections, services and power to support availability and recovery requirements?", "type": "choice"}, {"id": "66", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "NS4.01-30-0", "code": "NS4.01", "label": "Backup telecommunications services are available and tested at least annually to meet business recovery requirements."}, {"id": "NS4.04-30-1", "code": "NS4.04", "label": "Network boundary controls fail securely by blocking communications when protection mechanisms fail."}, {"id": "NS4.07-30-2", "code": "NS4.07", "label": "Critical network equipment has redundant links, backup power supplies and at least two hours of UPS support."}]}, {"id": "67", "label": "Is remote access to MTM networks and systems securely authenticated, encrypted, monitored and provided through approved secure connections?", "type": "choice"}, {"id": "68", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "NS5.01-31-0", "code": "NS5.01", "label": "Remote access connects through an approved DMZ and does not connect directly to internal MTM systems."}, {"id": "NS5.03-31-1", "code": "NS5.03", "label": "Remote access uses strong authentication, authorisation and multi-factor authentication."}, {"id": "NS5.02-31-2", "code": "NS5.02", "label": "Remote sessions are encrypted, automatically disconnected when finished and time out after 30 minutes of inactivity."}]}, {"id": "69", "label": "Is wireless access securely configured, encrypted and separated from MTM\u2019s internal networks?", "type": "choice"}, {"id": "70", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "NS6.01-32-0", "code": "NS6.01", "label": "Wireless data is encrypted, and public wireless networks are separated from MTM networks."}, {"id": "NS6.03-32-1", "code": "NS6.03", "label": "Default wireless accounts, passwords and network names are changed, and access points are securely configured."}, {"id": "NS6.06-32-2", "code": "NS6.06", "label": "Only authorised users and devices can connect, and wireless access to administrative interfaces is disabled."}]}, {"id": "71", "label": "For Q8 - Network Security, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 9, "title": "Removable Media Security", "page": 33, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10382", "questions": [{"id": "72", "label": "Is removable media formally approved, registered and securely managed throughout its lifecycle, including ownership, tracking, malware checking, encryption, incident reporting, secure erasure and disposal?", "type": "choice"}, {"id": "73", "label": "For Q9 - Removable Media Security, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 10, "title": "Security Event Logging and Monitoring", "page": 34, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10465", "questions": [{"id": "74", "label": "Does the system create detailed security records that are centrally stored, protected and monitored to help detect and investigate suspicious activity or security incidents?", "type": "choice"}, {"id": "75", "label": "Are key security events logged with enough detail to show what happened, when and where it happened, and which user, system or source was involved?", "type": "choice"}, {"id": "76", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "AU1.01-35-0", "code": "AU1.01", "label": "Key security events are logged, including account changes, login activity, access failures, security changes, privileged actions and system errors."}, {"id": "AU1.02-35-1", "code": "AU1.02", "label": "Logs record what happened, when and where it happened, the source, and the user or system involved."}, {"id": "AU1.03-35-2", "code": "AU1.03", "label": "Systems use an accurate time source, sensitive information in logs is limited, and logging failures are detected and addressed."}]}, {"id": "77", "label": "Are security logs centrally stored, retained and protected from unauthorised access, changes or deletion, with access limited to authorised MTM personnel?", "type": "choice"}, {"id": "78", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "AU2.01-36-0", "code": "AU2.01", "label": "Security event logs are sent promptly to a central logging facility."}, {"id": "AU2.02-36-1", "code": "AU2.02", "label": "Logs use accurate time synchronisation and are retained for 18 months with sufficient storage."}, {"id": "AU2.04-36-2", "code": "AU2.04", "label": "Logs are protected from unauthorised access, changes or deletion, with management access limited to authorised MTM personnel."}]}, {"id": "79", "label": "Are security event logs available in the SIEM for analysis, correlation, searching and alerting, and reviewed promptly by trained Security Operations personnel?", "type": "choice"}, {"id": "80", "label": "For Q10 - Security Event and Monitoring, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 11, "title": "Platform Hardening", "page": 37, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A12003", "questions": [{"id": "81", "label": "Are systems, software and cloud services securely configured, approved, maintained, protected and recoverable in accordance with MTM security requirements?", "type": "choice"}, {"id": "82", "label": "Are systems and platforms securely hardened to approved MTM standards, with security- related changes managed through MTM Change Management?", "type": "choice"}, {"id": "83", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "SO1.01-38-0", "code": "SO1.01", "label": "Systems and platforms are selected from vendors that support secure- by-design, secure-by- default and ongoing security maintenance."}, {"id": "SO1.03-38-1", "code": "SO1.03", "label": "Systems are hardened using an approved SOE or CIS Level 1 baseline, with unnecessary accounts, services, ports and features disabled."}, {"id": "SO1.11-38-2", "code": "SO1.11", "label": "Systems and software remain supported and up to date, and MTM data is securely erased when assets are decommissione d."}]}, {"id": "84", "label": "Are operating systems and software security validated, approved and supported before being installed in MTM\u2019s environment?", "type": "choice"}, {"id": "85", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "SO2.01-39-0", "code": "SO2.01", "label": "Only supported, security- validated and MTM-approved operating systems, software and add-ons are used."}, {"id": "SO2.03-39-1", "code": "SO2.03", "label": "Users cannot install unapproved software or remove or disable approved software."}, {"id": "SO2.05-39-2", "code": "SO2.05", "label": "Temporary installation files and logs are removed after installation."}]}, {"id": "86", "label": "Are virtualisation, cloud, container and serverless services securely configured, reviewed and approved before implementation?", "type": "choice"}, {"id": "87", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "SO3.01-40-0", "code": "SO3.01", "label": "Virtualisation or Cloud service providers comply with MTM cybersecurity requirements and provide independent security assurance."}, {"id": "SO3.03-40-1", "code": "SO3.03", "label": "Virtualisation or cloud services are securely configured, reviewed and approved by Cybersecurity before use."}, {"id": "SO3.07-40-2", "code": "SO3.07", "label": "MTM data is hosted in Australia, protected during transfer, and public access is disabled unless formally approved."}]}, {"id": "88", "label": "Are email services securely configured through approved gateways, and filtered to prevent spoofing and harmful content?", "type": "choice"}, {"id": "89", "label": "Are critical systems supported by tested recovery, redundancy and backup arrangements that meet business-defined RTO and RPO requirements?", "type": "choice"}, {"id": "90", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "SO5.01-41-0", "code": "SO5.01", "label": "A recovery plan is in place and regularly tested to restore critical systems within business- defined RTO and RPO requirements."}, {"id": "SO5.03-41-1", "code": "SO5.03", "label": "Where required, a separate secondary system is available, tested and capable of meeting recovery requirements."}, {"id": "SO5.04-41-2", "code": "SO5.04", "label": "Backups are securely stored offsite, protected from unauthorised access or changes, and regularly tested for successful recovery."}]}, {"id": "91", "label": "For Q11 - Platform Hardening, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 12, "title": "Third Party Accountability", "page": 42, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A12811", "questions": [{"id": "92", "label": "Are third-party suppliers security-assessed before access or service commencement and appropriately managed throughout the engagement, with security requirements, access controls, incident reporting, risk management and end-of-contract obligations documented?", "type": "choice"}, {"id": "93", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "TS1.02-42-0", "code": "TS1.02", "label": "Third parties are identified, prioritised and security- assessed before contracts, system access or integration are approved."}, {"id": "TS1.07-42-1", "code": "TS1.07", "label": "Third- party contracts clearly define security responsibilities, authorised access, legal and MTM requirements, audit rights, change notification and breach reporting obligations."}, {"id": "TS2.04-42-2", "code": "TS2.04", "label": "Third parties securely protect and manage MTM systems, data and information throughout the engagement, including monitoring and incident response."}]}, {"id": "94", "label": "For Q12 - Third Party Accountability, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 13, "title": "Vulnerability Management", "page": 44, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10026", "questions": [{"id": "95", "label": "Are security weaknesses in systems, applications and infrastructure regularly identified, risk-assessed, prioritised, fixed and reported through an approved vulnerability management process?", "type": "choice"}, {"id": "96", "label": "Is a complete and up-to-date asset inventory maintained and regularly reviewed?", "type": "choice"}, {"id": "97", "label": "Are systems and applications regularly scanned or monitored using authorised vulnerability tools, with identified vulnerabilities analysed, monitored and remediated promptly?", "type": "choice"}, {"id": "98", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "VM2.01-45-0", "code": "VM2.01", "label": "Vulnerability monitoring and scanning tools are kept up to date and given the access needed to identif  bilSubmit(b){const r=DB.bil[b.dataset.id];readBil(r);save();const miss=ALL_BIL_Q.filter(([id])=>r.answers[id]==null).map(([id])=>id);const g=[];if(miss.length)g.push(`${miss.length} impact question${miss.length>1?'s':''} (${miss.slice(0,6).join(', ')}${miss.length>6?'…':''})`);if(!r.infoName)g.push('information asset name');if(!r.rationale)g.push('rationale');if(!r.assessor)g.push('assessor');if(g.length)return showErr('bilErr','Draft saved. Before submitting, complete: '+g.join('; ')+'.');r.status='awaiting';r.submittedOn=TODAY;save();toast('Submitted; the proposed BIL awaits approval');go('bil',r.assetId,'view');},
 bilApprove(b){const r=DB.bil[b.dataset.id],ap=val('bApprover');if(!ap)return showErr('bilErr','Choose the approver.');if(ap===r.assessor)return showErr('bilErr','The approver must be a different person from the assessor.');r.status='approved';r.approver=ap;r.reviewDate=TODAY;r.nextDue=addMonths(TODAY,24);ensureCmap(r.assetId);save();toast('BIL approved. System priority, tier and CMAP updated.');go('bil',r.assetId,'view');},
 bilReturn(b){const r=DB.bil[b.dataset.id];r.status='draft';save();toast('Returned to draft');go('bil',r.assetId,'form');},
 cmapCreate(b){const t=val('cTitle');if(!t)return showErr('cErr','Enter an attestation title.');const id=nid('CM');DB.cmapDefs[id]={id,assetId:b.dataset.a,title:t,months:Number(val('cMonths')),ownerId:val('cOwner'),auto:null};save();toast('Attestation added');go('cmapItem',b.dataset.a,id);},
 cmapSubmit(b){const d=DB.cmapDefs[b.dataset.id],date=val('cDate');if(!isDate(date))return showErr('cErr','Enter the review or test date.');if(date>TODAY)return showErr('cErr','The date cannot be in the future.');if(!val('cBy'))return showErr('cErr','Choose who is attesting.');if(!val('cOutcome'))return showErr('cErr','Select the outcome.');if(!chk('cAffirm'))return showErr('cErr','Confirm the attestation statement.');
  const id=nid('SUB');DB.cmapSubs[id]={id,defId:d.id,date,by:val('cBy'),outcome:val('cOutcome'),notes:val('cNotes'),evidence:val('cEvidence'),recorded:TODAY};save();toast(`Attestation recorded; next due ${fd(addMonths(date,d.months))}`);go('cmapItem',d.assetId,d.id);},
 riskSave(b){const st=val('rStatement');if(!st)return showErr('rErr','Enter the risk statement.');for(const [k,l] of [['rII','inherent impact'],['rIL','inherent likelihood'],['rRI','residual impact'],['rRL','residual likelihood']])if(!val(k))return showErr('rErr','Select the '+l+'.');if(!val('rAssessor'))return showErr('rErr','Select the security assessor.');
  const id=b.dataset.id||nid(b.dataset.a+'-R');DB.risks[id]={id,assetId:b.dataset.a,statement:st,mtm:[...document.querySelectorAll('[data-risk-mtm]:checked')].map(x=>x.dataset.riskMtm),vpdss:[...document.querySelectorAll('[data-risk-vpdss]:checked')].map(x=>Number(x.dataset.riskVpdss)),iI:Number(val('rII')),iL:Number(val('rIL')),mitigation:val('rMit'),rI:Number(val('rRI')),rL:Number(val('rRL')),actionPlan:val('rPlan'),ownerId:val('rOwner'),due:val('rDue'),actionStatus:val('rStatus'),acceptanceExpiry:val('rExpiry'),assessor:val('rAssessor'),updated:TODAY};save();toast('Risk saved; scores recalculated');go('risks',b.dataset.a);},
 actionSave(b){const aid=b.dataset.a,key=b.dataset.key,status=val('aStatus'),owner=val('aOwner'),due=val('aDue');
  if(!key){const t=val('aTitle');if(!t)return showErr('aErr','Describe the action.');const id=nid('MA');DB.actions[id]={id,assetId:aid,title:t,ownerId:owner,due,status,completedOn:status==='Completed'?TODAY:null};}
  else if(key.startsWith('MAN:')){const x=DB.actions[key.slice(4)];const t=val('aTitle');if(!t)return showErr('aErr','Describe the action.');Object.assign(x,{title:t,ownerId:owner,due,status,completedOn:status==='Completed'?TODAY:null});}
  else if(key.startsWith('RISK:')){const r=DB.risks[key.slice(5)];Object.assign(r,{ownerId:owner,due,actionStatus:status,updated:TODAY});}
  else DB.actionState[key]={ownerId:owner,due,status,completedOn:status==='Completed'?TODAY:null};
  save();toast('Action saved');go('actions',aid);},
 hcSave(b){if(readHealth(b.dataset.a,false))go('asset',b.dataset.a,'Asset assurance');},
 hcSubmit(b){if(readHealth(b.dataset.a,true))go('asset',b.dataset.a,'Asset assurance');},
 hcReopen(b){const h=DB.hc[b.dataset.a];h.history=(h.history||[]).concat([{status:h.status,submittedOn:h.submittedOn,responses:Object.assign({},h.responses)}]);h.status='draft';h.submittedOn=null;h.signoff=false;save();toast('Reopened as a new draft; the submitted version is kept in history');render();},
 malwareSave(b){const tools=[...document.querySelectorAll('[data-malware-tool]:checked')].map(x=>x.dataset.malwareTool),inf=val('mInf'),c=val('mCrit'),h=val('mHigh');if(!tools.length)return showErr('mErr','Select at least one coverage option, or “Coverage not confirmed”.');if(tools.includes('other')&&!val('mOther'))return showErr('mErr','Name the other tool.');if(!inf)return showErr('mErr','Answer whether malware was found in the last 90 days.');if(c===''||h==='')return showErr('mErr','Enter the number of critical and high-risk vulnerabilities (0 if none).');if(!/^\d+$/.test(c)||!/^\d+$/.test(h))return showErr('mErr','Vulnerability counts must be whole numbers of 0 or more.');
  DB.malware[b.dataset.a]={tools,other:val('mOther'),infected90:inf,critical:Number(c),high:Number(h),updated:TODAY};save();toast('Asset status saved');go('asset',b.dataset.a,'Asset assurance');},
 monSave(b){const s=val('moSoc'),i=val('moInc');if(!s||!i)return showErr('moErr','Answer both questions.');if(i==='Yes'&&(!isDate(val('moDate'))||!val('moOwner')))return showErr('moErr','For an active investigation, enter the date opened and the owner.');
  DB.monitoring[b.dataset.a]={socScope:s,activeIncident:i,incRef:i==='Yes'?val('moRef'):'',incDetail:i==='Yes'?val('moDetail'):'',incDate:i==='Yes'?val('moDate'):'',ownerId:i==='Yes'?val('moOwner'):'',updated:TODAY};save();toast('Answers saved');go('asset',b.dataset.a,'Asset assurance');},
 vaSave(b){readVendor(DB.vendorAssessments[b.dataset.id]);save();toast('Draft saved');render();},
 vaSubmit(b){const va=DB.vendorAssessments[b.dataset.id];readVendor(va);save();const st=updateVendorScope(),m=[];if(!va.company)m.push('company name');if(!va.representative)m.push('representative name');if(!va.representativeContact)m.push('representative contact');if(!va.cyberName||!va.cyberEmail||!va.cyberPhone)m.push('cybersecurity incident contact details');if(st==='incomplete')m.push('all three scoping answers');if(st==='required'){if(!va.ack)m.push('acknowledgement');VENDOR_Q.forEach(q=>{if(!(va.answers[q.id]||{}).response)m.push(q.id+' response');});if(!VENDOR_Q.some(q=>(va.answers[q.id]||{}).evidence))m.push('at least one supporting evidence reference');}
  if(m.length)return showErr('vErr','Draft saved. Complete '+m.join(', ')+' before submitting.');if(st==='notRequired')va.answers={};va.status='submitted';va.submittedOn=TODAY;save();toast('Submitted; awaiting MTM review');render();},
 vaDecide(b){const va=DB.vendorAssessments[b.dataset.id],d=val('vDecision');if(!d)return showErr('vDecErr','Select Acceptable, Conditional or Rejected before recording the decision.');if(!val('vReviewer'))return showErr('vDecErr','Select the reviewer.');if(!isDate(val('vDate')))return showErr('vDecErr','Enter the decision date.');if(!val('vRationale'))return showErr('vDecErr','Record the decision rationale.');if(d!=='Acceptable'&&!val('vConditions'))return showErr('vDecErr','Conditional and Rejected decisions need conditions or remediation.');
  va.review={decision:d,reviewer:val('vReviewer'),date:val('vDate'),rationale:val('vRationale'),conditions:val('vConditions')};va.status='reviewed';save();toast(`Decision recorded; linked assets now show ${DEC_LABEL[d]}`);render();},
 vaReassess(b){const prev=vaFor(b.dataset.v)[0],id=nid('VA');DB.vendorAssessments[id]=Object.assign(JSON.parse(JSON.stringify(prev)),{id,version:prev.version+1,status:'draft',submittedOn:null,review:null});save();go('va',id,b.dataset.b);},
 saveVpdss(b){const aid=b.dataset.a,n=Number(b.dataset.n),st=val('vpStatus'),rat=val('vpRationale');if(!st)return showErr('vpErr','Select an implementation status.');if(st==='Not Applicable'&&!rat)return showErr('vpErr','Not Applicable needs a rationale.');if(!val('vpAssessor'))return showErr('vpErr','Select the assessor.');
  DB.vpdssAsset[aid]=DB.vpdssAsset[aid]||{};const old=DB.vpdssAsset[aid][n];DB.vpdssAsset[aid][n]={id:old?old.id:'VIA-'+aid+'-'+n,status:st,maturity:val('vpMaturity'),rationale:rat,naApproved:chk('vpNa'),assessor:val('vpAssessor'),date:TODAY,history:old?(old.history||[]).concat([{status:old.status,maturity:old.maturity,date:old.date,assessor:old.assessor,rationale:old.rationale}]):[]};save();toast('Asset status saved');render();},
 programSave(){const p=DB.program;if(!isDate(val('pDate')))return showErr('pErr','Enter the program attestation date.');p.history=(p.history||[]).concat([{date:p.date,results:JSON.parse(JSON.stringify(p.results))}]);p.date=val('pDate');p.assessor=val('pAssessor');
  [1,2,5,6,8,9,10].forEach(n=>{p.results[n]={status:val('ps'+n),maturity:val('pm'+n),rationale:val('pr'+n),naApproved:chk('pn'+n)};});
  Object.values(DB.sites).forEach(s=>{const st=val('ss'+s.id);if(!st)return;const old=DB.siteAssessments[s.id];DB.siteAssessments[s.id]={id:old?old.id:nid('SA'),siteId:s.id,date:val('sd'+s.id)||TODAY,status:st,maturity:val('sm'+s.id),rationale:val('sr'+s.id),assessor:old?old.assessor:'P-008',naApproved:false,history:old?(old.history||[]).concat([{date:old.date,status:old.status,maturity:old.maturity}]):[]};});save();toast('Program and site results saved; asset coverage refreshed');render();},
 resetAsk(){V.confirmReset=true;render();},resetNo(){V.confirmReset=false;render();},
 resetYes(){DB=seed();Object.keys(DB.assets).forEach(ensureCmap);save();V.confirmReset=false;toast('Sample data restored');go('register');}
};
function readBil(r){r.answers=collectBilAnswers();Object.assign(r,{newInfo:val('bNew'),recent:val('bRecent'),infoName:val('bName'),group:val('bGroup'),system:val('bSystem'),division:val('bDivision'),ownerTitle:val('bOwner'),custodianTitle:val('bCust'),personal:val('bPI'),cabinet:val('bCab'),marking:val('bMark')||'Not recorded',description:val('bDesc'),assessor:val('bAssessor'),evidence:val('bEvidence'),rationale:val('bRationale')});}
function readHealth(aid,complete){const fields=Object.fromEntries(['systemName','description','vendor','vendorContact','owner','primaryContact'].map(k=>[k,val('h-'+k)]));const responses=Object.fromEntries([...document.querySelectorAll('[data-health-id]')].filter(el=>el.value).map(el=>[el.dataset.healthId,el.value]));const comments=Object.fromEntries([...document.querySelectorAll('[data-health-comment]')].map(el=>[el.dataset.healthComment,el.value.trim()]));
 const prev=DB.hc[aid]||{history:[]},h={status:'draft',fields,responses,comments,signoff:chk('hcSignoff'),submittedOn:null,updated:TODAY,history:prev.history||[]};
 if(complete){const g=[];if(!fields.systemName||!fields.description||!fields.vendor||!fields.owner||!fields.primaryContact)g.push('system details');const miss=HC_TOTAL-Object.keys(responses).length;if(miss)g.push(`${miss} unanswered item${miss>1?'s':''}`);if(!h.signoff)g.push('sign-off');if(g.length){DB.hc[aid]=h;save();showErr('hcErr','Draft saved. Complete '+g.join(', ')+' before submitting.');return false;}h.status='submitted';h.submittedOn=TODAY;}
 DB.hc[aid]=h;save();toast(complete?'Submitted for Cybersecurity review; gaps added to the Action Plan':'Draft saved');return true;}
function readVendor(va){['company','representative','representativeContact','cyberName','cyberEmail','cyberPhone'].forEach(k=>va[k]=val('v-'+k));VENDOR_SCOPE.forEach(q=>va.scope[q.id]={response:val('v-'+q.id),note:val('v-'+q.id+'-note')});va.ack=chk('v-ack');va.answers=Object.fromEntries(VENDOR_Q.map(q=>[q.id,{response:val('v-'+q.id),comments:val('v-'+q.id+'-comments'),evidence:val('v-'+q.id+'-evidence')}]));}

/* ================= Render and events ================= */
const VIEWS={register,asset:detail,person:personPage,bil:bilPage,cmap:cmapPage,cmapAdd:cmapAddPage,cmapItem:cmapItemPage,risks:risksPage,risk:riskForm,actions:actionsPage,action:actionForm,hc:healthPage,malware:malwarePage,monitoring:monitoringPage,va:vendorPage,assessments:assessmentsPage,allrisks:allRisksPage,reports:reportsPage};
function render(){let html;try{html=(VIEWS[V.view]||register)();}catch(err){console.error(err);html=`<div class="panel section"><h2>This record could not be shown</h2><p class="sub">${e(err.message)}</p><div class="btnrow"><button class="primary" data-go="register">Back to asset register</button></div></div>`;}
 $('#app').innerHTML=html;const grp={assessments:'assessments',allrisks:'allrisks',reports:'reports'}[V.view]||'register';document.querySelectorAll('.topnav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===grp&&(grp!=='register'||b.dataset.main==='1')));
 if(V.view==='register')regRows();if($('#bilPreview'))updateBilPreview();if($('#inhPrev'))updateRiskPreview();if($('#hcProgress'))updateHealthProgress();if($('#vScope'))updateVendorScope();}
document.addEventListener('click',ev=>{const t=ev.target;
 const act=t.closest('[data-act]');if(act){ev.preventDefault();const f=ACT[act.dataset.act];if(f)f(act);return;}
 const nav=t.closest('[data-nav]');if(nav){go(nav.dataset.nav);return;}
 const per=t.closest('[data-person]');if(per){go('person',per.dataset.person,per.dataset.a);return;}
 const tab=t.closest('[data-tab]');if(tab){V.tab=tab.dataset.tab;render();return;}
 const std=t.closest('[data-std]');if(std){V.tab='VPDSS maturity';V.std=Number(std.dataset.std);render();const el=document.querySelector('.stdpanel');if(el)el.scrollIntoView({block:'start'});return;}
 const g=t.closest('[data-go]');if(g){go(g.dataset.go,g.dataset.a,g.dataset.b);}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='regQ'){V.q=t.value;regRows();}});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.id==='regLevel'){V.level=t.value;regRows();return;}if(t.id==='regType'){V.type=t.value;regRows();return;}
 if(t.matches('[data-score]')){updateBilPreview();return;}if(t.matches('[data-risk-score]')){updateRiskPreview();return;}
 if(t.matches('[data-health-id]')){updateHealthProgress();return;}if(t.matches('[data-scope]')){updateVendorScope();return;}
 if(t.id==='moInc'){const d=$('#incDetail');if(d)d.hidden=t.value!=='Yes';return;}
 if(t.matches('[data-malware-tool]')&&t.checked){const k=t.dataset.malwareTool;document.querySelectorAll('[data-malware-tool]').forEach(x=>{if(x===t)return;if(k==='none'||k==='unknown'||x.dataset.malwareTool==='none'||x.dataset.malwareTool==='unknown')x.checked=false;});}});
DB=load();Object.keys(DB.assets).forEach(ensureCmap);save();
render();
</script>
