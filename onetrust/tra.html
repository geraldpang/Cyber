<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRA Workflow Prototype</title>
<style>
/* Layout: OneTrust-style concept — navy top bar, pale canvas, white panels with fact cards; follows the supplied reference mockup (single light theme by design) */
:root{--ink:#203047;--muted:#65748a;--line:#e2e8f0;--pale:#f5f7fa;--blue:#1867a9;--blue-dk:#145486;--nav:#16324f;--red:#b63c43;--amber:#a66717;--green:#267648;--white:#fff;--tint:#f9fbfd;--hover:#f7fbff;--note-bg:#eef5fb;--note-line:#d4e6f5;--note-ink:#34516d;--field:#ccd6e2;--f:Arial,Helvetica,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--pale);color:var(--ink);font:14px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:var(--ink)}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #86b9e3;outline-offset:2px}
a{color:var(--blue)}
.top{min-height:62px;background:var(--nav);display:flex;align-items:center;gap:28px;padding:0 30px;color:var(--white)}
.brand{font-size:19px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}.brand small{opacity:.7;font-size:12px;font-weight:700}
.topnav{display:flex;gap:20px;margin-left:30px}
.topnav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--white);padding:19px 0 17px;opacity:.9}
.topnav button.active{border-bottom-color:#6ab8e8;font-weight:700;opacity:1}
.account{margin-left:auto;border:1px solid #6a8298;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;font-weight:700;flex:none}
main{max-width:1480px;margin:0 auto;padding:25px 30px 50px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:12px}
.crumb button{border:0;background:none;color:var(--blue);padding:0;font-size:12px}
.titlebar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}
h1{font-size:27px;margin:0 0 4px;letter-spacing:-.4px;text-wrap:balance}
h2{font-size:17px;margin:0 0 12px;text-wrap:balance}
h3{font-size:15px;margin:0 0 6px}
p{margin:0}
.sub{color:var(--muted)}
.sample{background:#e8f2fb;color:#245c83;border:1px solid #cde3f4;border-radius:4px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;text-transform:uppercase}
.panel{background:var(--white);border:1px solid var(--line);border-radius:7px;box-shadow:0 1px 3px #1b314910}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{border:1px solid var(--field);border-radius:5px;background:var(--white);padding:9px 11px}
.toolbar input{min-width:240px;flex:1}.toolbar select{min-width:160px}
.count{margin-left:auto;align-self:center;color:var(--muted)}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--tint);font-weight:700}
th,td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
.num,td.nowrap{font-variant-numeric:tabular-nums}
.open{border:0;background:none;color:var(--blue);font-weight:700;text-align:left;padding:0}
.open:hover{text-decoration:underline}
.pill{display:inline-block;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.red{background:#fce9e8;color:var(--red)}.pill.amber{background:#fff1dd;color:var(--amber)}.pill.green{background:#e8f6ec;color:var(--green)}.pill.gray{background:#eef2f6;color:#5b6a7b}.pill.blue{background:#e8f2fb;color:#245c83}.pill.solidred{background:var(--red);color:var(--white)}
.empty{padding:34px;color:var(--muted);text-align:center}
.back{border:0;background:none;color:var(--blue);font-weight:700;padding:0;margin-bottom:17px}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:8px 0 0}
.facts.three{grid-template-columns:repeat(5,minmax(0,1fr))}
.fact{border:1px solid var(--line);border-radius:5px;background:var(--white);padding:11px 13px;min-width:0}
.fact label,.fact .lab{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.fact strong{font-size:13px;overflow-wrap:anywhere}
.fact .small{display:block}
.fact.pending strong{color:var(--muted)}
.alert{background:#fff4f0;border:1px solid #f2d5cd;border-left:4px solid var(--red);border-radius:5px;padding:13px 16px;margin:0 0 18px;display:flex;gap:12px;align-items:flex-start}
.alert strong{white-space:nowrap;color:#9d343a}
.alert.amber{background:#fff8ec;border-color:#f1dfc0;border-left-color:var(--amber)}
.alert.amber strong{color:var(--amber)}
.alert .items{color:#773f41}
.alert.amber .items{color:#6f4e1d}
.alert .items button{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-decoration-color:#d7a9a5;text-underline-offset:2px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 2px;color:var(--muted);font-weight:700;white-space:nowrap}
.tabs button.selected{border-bottom-color:var(--blue);color:var(--blue)}
.grid{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(330px,1fr);gap:18px}
.section{padding:17px 18px;margin-bottom:18px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}
.mini td,.mini th{padding:9px 7px}
.mini td:first-child,.mini th:first-child{padding-left:0}
.mini td:last-child,.mini th:last-child{padding-right:0}
.number{font-size:23px;font-weight:700;color:var(--nav)}
.legend{font-size:12px;color:var(--muted);margin-top:12px}
.notice{background:var(--note-bg);border:1px solid var(--note-line);padding:12px 14px;border-radius:5px;margin:0 0 18px;color:var(--note-ink)}
.notice.warn{background:#fff8ec;border-color:#f1dfc0;color:#6f4e1d}
.details{margin-top:16px}.details summary{color:var(--blue);cursor:pointer;font-weight:700}.details p{margin-top:8px;color:var(--muted)}
.footer{font-size:11px;color:var(--muted);margin-top:22px}
.nowrap{white-space:nowrap}
.coverage-group{font-size:11px;color:var(--blue);font-weight:700;letter-spacing:.035em;margin:16px 0 7px;text-transform:uppercase}
.coverage-group:first-child{margin-top:4px}
.coverage-row{width:100%;border:0;border-bottom:1px solid var(--line);background:var(--white);display:grid;grid-template-columns:minmax(0,1fr) 24px;align-items:center;gap:8px;padding:10px 1px;text-align:left}
.coverage-row.wide{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr) 24px}
.coverage-row:hover{background:var(--hover)}
.coverage-row.sel{background:var(--note-bg)}
.coverage-row .meta{font-size:12px;color:var(--muted)}
.coverage-dot{width:16px;height:16px;border-radius:50%;display:inline-block;justify-self:center;border:2px solid var(--white);box-shadow:0 0 0 1px #c5d1db;flex:none}
.coverage-dot.green{background:var(--green)}.coverage-dot.amber{background:var(--amber)}.coverage-dot.red{background:var(--red)}
.coverage-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px}
.coverage-legend span{display:inline-flex;align-items:center;gap:6px}
.coverage-legend .coverage-dot{width:11px;height:11px}
.primary{border:0;border-radius:5px;background:var(--blue);color:var(--white);padding:9px 13px;font-weight:700}
.primary:hover{background:var(--blue-dk)}
.secondary{border:1px solid var(--blue);border-radius:5px;background:var(--white);color:var(--blue);padding:8px 12px;font-weight:700}
.secondary:hover{background:var(--hover)}
.danger{border:1px solid var(--red);border-radius:5px;background:var(--white);color:var(--red);padding:8px 12px;font-weight:700}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lab{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--field);border-radius:4px;padding:9px 10px;background:var(--white)}
.field textarea{min-height:75px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:#f3f6f9;color:#5b6a7b}
.err{color:var(--red);margin:12px 0 0;font-weight:700}
.err:empty{display:none}
.checks label{display:block;font-size:13px;margin:7px 0}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.checkgrid fieldset{border:1px solid var(--line);border-radius:5px;padding:12px;margin:0;min-width:0}
.checkgrid legend{font-size:13px;font-weight:700}
.checkgrid label{display:block;font-size:13px;margin:7px 0}
.preview{margin-top:14px;font-weight:700}
.question{display:grid;grid-template-columns:45px minmax(180px,1fr) minmax(290px,1.2fr);gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.question select{width:100%;padding:8px;border:2px solid #93bad8;border-radius:4px;background:#f8fcff;color:#173d5d}
.question select:disabled{border-color:var(--field);background:#f3f6f9}
.question .qid{font-weight:700;color:var(--muted)}
.question .chosen{grid-column:2/-1;font-size:12px;color:var(--muted)}
.dimhead{margin:18px 0 4px;font-size:16px}
.bilsummary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.bilsummary .fact{background:var(--tint)}
.bilsummary .number{font-size:21px;display:block}
.bilsummary.proposed .fact{border:1px dashed var(--amber);background:repeating-linear-gradient(135deg,#fff8ec 0 8px,#fffdf8 8px 16px)}
.proposed-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--amber);text-transform:uppercase;margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin-top:10px}
.kv div strong{display:block}
.kv div span{color:var(--muted)}
.vendor-q{padding:17px 0;border-bottom:1px solid var(--line)}
.vendor-q:last-child{border-bottom:0}
.vendor-q p{margin:5px 0}
.vendor-q .response-row{display:grid;grid-template-columns:180px 1fr;gap:12px;margin-top:10px}
.vendor-q .evidence{font-size:12px;color:var(--muted);background:#f8fafc;padding:9px 10px;border-left:3px solid #c9dceb;margin-top:10px}
.health-section>summary{cursor:pointer;font-size:16px;font-weight:700;display:flex;justify-content:space-between;gap:12px}
.health-question{padding:18px 0;border-top:1px solid var(--line)}
.health-question>strong{display:block;margin-bottom:10px}
.health-question>select{width:min(100%,380px);padding:9px;border:1px solid #9dc2dc;border-radius:5px;background:var(--white)}
.health-control{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.health-control:last-child{border-bottom:0}
.health-control select{width:100%;padding:8px;border:1px solid #9dc2dc;border-radius:5px;background:var(--white)}
.health-matrix{border:1px solid var(--line);border-radius:5px;padding:4px 12px}
.gapmark{color:var(--red);font-weight:700}
.stdpanel{margin:18px 0 0;background:var(--tint)}
.comp{border:1px solid var(--line);border-radius:5px;background:var(--white);padding:12px 14px;margin-top:12px}
.comp .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tp-sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.okt{color:var(--green);font-weight:700}.badt{color:var(--red);font-weight:700}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--nav);color:var(--white);padding:10px 14px;border-radius:5px;max-width:calc(100vw - 32px);z-index:9}
@media(max-width:1050px){.facts,.facts.three{grid-template-columns:repeat(3,minmax(0,1fr))}.bilsummary{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)}.topnav{gap:14px;margin-left:8px}.coverage-row.wide{grid-template-columns:minmax(0,1fr) 24px}.coverage-row.wide .meta{grid-column:1}}
@media(max-width:760px){.top{flex-wrap:wrap;gap:0 16px}.topnav{order:3;width:100%;margin:0;overflow-x:auto;gap:18px}.topnav button{padding:8px 0 10px;white-space:nowrap}.brand{padding:14px 0 6px}.account{margin-top:8px}}
@media(max-width:650px){main{padding:18px 16px}.top{padding:0 16px}.facts,.facts.three{grid-template-columns:repeat(2,minmax(0,1fr))}.bilsummary{grid-template-columns:repeat(2,minmax(0,1fr))}.question{grid-template-columns:40px minmax(0,1fr)}.question select,.question .chosen{grid-column:2}.vendor-q .response-row,.formgrid,.checkgrid,.kv{grid-template-columns:minmax(0,1fr)}.health-control{grid-template-columns:minmax(0,1fr)}.table-scroll table{min-width:680px}.titlebar{align-items:flex-start;flex-direction:column}.alert{display:block}.alert strong{display:block;margin-bottom:5px}.toolbar input{min-width:0}.count{margin-left:0}}
.stepper{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.stepper button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--white);border-radius:6px;padding:10px 14px;text-align:left;min-width:0;flex:1 1 190px;color:var(--ink)}
.stepper button:disabled{cursor:default;opacity:.6}
.stepper .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#eef2f6;color:#5b6a7b;flex:none}
.stepper button.cur{border-color:var(--blue);box-shadow:inset 0 -3px 0 var(--blue)}
.stepper button.done .n{background:var(--green);color:var(--white)}
.stepper button.cur .n{background:var(--blue);color:var(--white)}
.stepper small{display:block;color:var(--muted);font-size:12px}
.dimcell{display:flex;gap:12px;align-items:center}
.dimbadge{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:var(--blue);background:#e8f2fb;border:1px solid #cde3f4;flex:none}
.bilcard{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.3fr);background:#f3f8fd;border:1px solid #cde3f4;border-radius:7px;padding:16px 0;margin-top:16px}
.bilcard>div{padding:0 18px;border-left:1px solid #cde3f4;min-width:0}
.bilcard>div:first-child{border-left:0}
.bilcard.proposed{border-style:dashed;border-color:var(--amber);background:repeating-linear-gradient(135deg,#fff8ec 0 8px,#fffdf8 8px 16px)}
.bilcard .big{font-size:26px;font-weight:700;color:var(--nav);margin:2px 0 6px}
.ciachips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.ciachip{border:1px solid #cde3f4;background:var(--white);border-radius:6px;padding:6px 10px;text-align:center;min-width:72px}
.tq{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-top:12px;background:var(--white)}
.tq .head{display:flex;gap:10px;align-items:baseline}
.xfbar{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:12px;background:var(--tint)}.xfbar .fgroup{margin:0 0 8px}.xfsum{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px}
.xfer{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:12px;margin-top:12px;align-items:stretch}
.xcol{display:flex;flex-direction:column;gap:6px;min-width:0}.xcol label{font-weight:700;font-size:13px}
.xcol select{width:100%;min-height:380px;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:12.5px;background:var(--white)}
.xcol select optgroup{font-weight:700;color:var(--ink);font-style:normal}.xcol select option{padding:3px 6px;font-weight:400;color:var(--ink)}
.xbtns{display:flex;flex-direction:column;justify-content:center;gap:8px}.xbtns button{padding:8px 0;font-size:16px;font-weight:700}
@media(max-width:760px){.xfer{grid-template-columns:1fr}.xbtns{flex-direction:row;justify-content:center}.xbtns button{flex:1}.xbtns button span{display:inline-block;transform:rotate(90deg)}.xcol select{min-height:240px}}
.ciatags{display:flex;gap:3px;margin-top:5px}.ciat{font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:#9aa6b5}.ciat.on{background:var(--blue);border-color:var(--blue);color:#fff}
.lqgrid{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;font-size:12.5px;table-layout:fixed}
.lqgrid th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.lqgrid th.lqq{width:25%}.lqgrid th.lqcm{width:15%}
.lqgrid td{vertical-align:top;border-bottom:1px solid var(--line);padding:8px 4px}
.lqgrid td.lqq{padding-right:10px;font-size:13px;line-height:1.4}
.lqgrid th.l1{color:var(--green)}.lqgrid th.l3{color:var(--amber)}.lqgrid th.l4,.lqgrid th.l5{color:var(--red)}
.lqc label{position:relative;display:block;min-height:64px;border:1px solid var(--line);border-radius:5px;padding:6px 7px;cursor:pointer;background:var(--white)}
.lqc input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.lqc label:hover{border-color:var(--blue)}.lqc label:focus-within{outline:2px solid var(--blue);outline-offset:1px}
.lqc.on label{border-color:var(--blue);background:var(--note-bg);box-shadow:inset 0 0 0 1px var(--blue)}
.lqc .lqn{display:none;font-weight:700;font-size:12.5px}
.lqc .lkd{display:block;color:var(--ink);font-size:12px;line-height:1.35}.lqc:not(.on) .lkd{color:var(--muted)}
.lqcm textarea{width:100%;min-height:64px;font-family:inherit;font-size:12.5px;line-height:1.35;border:1px solid var(--line);border-radius:5px;padding:6px 7px;resize:vertical}
.lqclr{font-size:11.5px;margin-left:4px}
@media(max-width:760px){.lqgrid,.lqgrid tbody,.lqgrid tr,.lqgrid td{display:block;width:100%}.lqgrid thead{display:none}.lqgrid tr{border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:10px}.lqgrid td{border:0;padding:3px 0}.lqc .lqn{display:block}.lqc label{min-height:0;height:auto}.lqgrid td.lqc{padding:3px 0}}
.response-grid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;margin-top:10px}
.cbrow{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
.tchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tchip{font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;background:#eef2f6;color:#5b6a7b}
.tchip.on{background:#e8f2fb;color:#245c83;box-shadow:inset 0 0 0 1px #9dc2dc}
tr.dim td{color:#8a97a8}
.ctlbrowse{max-height:560px;overflow-y:auto;border:1px solid var(--line);border-radius:5px;padding:0 10px}
.ctlbrowse tr.grp td{background:var(--tint);font-weight:700;font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
.cdet{margin-top:6px}
.cdesc{margin-top:3px;max-width:80ch;color:var(--ink);font-size:13px}
.cspec{margin-top:8px;max-width:80ch}.cspec-h{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.cspec ol{margin:4px 0 6px;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.cspec-id{font-weight:700;color:var(--muted);font-size:12px;margin-right:4px;white-space:nowrap}
.cevid{margin:4px 0 0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.cspec-tag{font-size:11px;font-weight:700;color:#245c83;background:#e8f2fb;border-radius:4px;padding:0 5px;white-space:nowrap}
.ctable tr.off .cspec{opacity:.6}
.ctable tr.off td{background:#fafbfc;color:#8a97a8}.ctable tr.off .cdesc{color:#8a97a8}
.ctable input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue)}
.filtergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sltok{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:var(--green);background:#e8f6ec;border-radius:4px;padding:0 5px}
.sltabove{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:var(--amber);background:#fff1dd;border-radius:4px;padding:0 5px}

 applications, databases and system connections securely designed, developed, tested, released, protected and maintained throughout their lifecycle?", "type": "choice"}, {"id": "13", "label": "Is there a documented process to make sure the application is developed securely, properly checked and approved before changes are made?", "type": "choice"}, {"id": "14", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "AS.1.01-5-0", "code": "AS.1.01", "label": "A documented secure development process is followed."}, {"id": "AS.1.06-5-1", "code": "AS.1.06", "label": "Changes are security reviewed, tested and approved before deployment."}, {"id": "AS.1.07-5-2", "code": "AS.1.07", "label": "Security issues and product documentation are addressed before release."}]}, {"id": "15", "label": "Are the live system and development system kept separate and protected so that unauthorised users cannot access live systems or data?", "type": "choice"}, {"id": "16", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "AS.2.01-6-0", "code": "AS.2.01", "label": "Development and production environments must be kept separate."}, {"id": "AS.2.02-6-1", "code": "AS.2.02", "label": "Security-related changes must be tested before production."}, {"id": "AS.2.03-6-2", "code": "AS.2.03", "label": "Production data is not used in development or testing unless equally protected and kept separate from production data sources."}]}, {"id": "17", "label": "Is the application securely set up to ensure that only authorised users can access it, information entered is properly checked, sensitive data is protected and the application can recover from a failure?", "type": "choice"}, {"id": "18", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "AS.3.01-7-0", "code": "AS.3.01", "label": "Applications are deployed only on authorised and securely configured systems."}, {"id": "AS.3.03-7-1", "code": "AS.3.03", "label": "User input, access, sessions, application libraries and sensitive data are securely managed and protected."}, {"id": "AS.3.11-7-2", "code": "AS.3.11", "label": "Application and database components are separated, with capacity, backup and recovery controls in place."}, {"id": "AS.3.15-7-3", "code": "AS.3.15", "label": "Internet-facing applications are protected by secure headers and a Web Application Firewall."}]}, {"id": "19", "label": "Are new applications and major changes security tested against MTM requirements and checked for vulnerabilities before release?", "type": "choice"}, {"id": "20", "label": "Does the application database have a clear owner, restricted access and encryption for confidential or restricted data?", "type": "choice"}, {"id": "21", "label": "Does each system connection (e.g. Application Programming Interfaces (APIs)) have an assigned owner and controls to ensure only authorised users and systems can access it securely?", "type": "choice"}, {"id": "22", "label": "For Q3 - Application Security, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 4, "title": "Threat and Risk Assessment", "page": 9, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A13023", "questions": [{"id": "23", "label": "Has an approved cybersecurity risk assessment been completed and kept current, with identified risks assigned to owners and managed through agreed actions in accordance with MTM risk management requirements?", "type": "choice"}, {"id": "24", "label": "Are cybersecurity risks identified, assessed, assigned to owners and managed under the MTM Integrated Risk Management Procedure (A2023)?", "type": "choice"}, {"id": "25", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "RC.1.01-10-0", "code": "RC.1.01", "label": "Cybersecurity risks must be managed in accordance with MTM\u2019s Integrated Risk Management Procedure (A2023)."}, {"id": "RC.1.02-10-1", "code": "RC.1.02", "label": "A Cyber Threat Risk Assessment must be completed for new systems and significant changes."}, {"id": "RC.1.03-10-2", "code": "RC.1.03", "label": "Each identified cybersecurity risk must have an assigned risk owner."}]}, {"id": "26", "label": "Are cybersecurity risk assessments completed using approved methods, including system scope, threats, vulnerabilities, business impact, risk rating and treatment actions?", "type": "choice"}, {"id": "27", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "RC.2.02-11-0", "code": "RC.2.02", "label": "The system scope, boundaries, assets and relevant experts are clearly identified."}, {"id": "RC.2.05-11-1", "code": "RC.2.05", "label": "Cyber threats, weaknesses and business impacts are assessed, rated and prioritised."}, {"id": "RC.2.11-11-2", "code": "RC.2.11", "label": "Risk actions, owners, exceptions and acceptance decisions are documented and managed."}]}, {"id": "28", "label": "Does the system align with VPDSS and Franchise Agreement cybersecurity obligations, including security measures, maturity assessments and breach reporting?", "type": "choice"}, {"id": "29", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "R3.01-12-0", "code": "R3.01", "label": "The system complies with Victorian Protective Data Security Standards (VPDSS) requirements a nd Franchise Agreement cybersecurity requirements."}, {"id": "RC.3.03-12-1", "code": "RC.3.03", "label": "Personal information, important records and systems are protected from internal and external threats."}, {"id": "RC.3.09-12-2", "code": "RC.3.09", "label": "Security incidents and non- compliance are promptly reported, managed and resolved."}]}, {"id": "30", "label": "For Q4 - Threat & Risk Assessment, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 5, "title": "Data Encryption & Key Management", "page": 13, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10492", "questions": [{"id": "31", "label": "Is confidential or restricted MTM information protected using approved encryption when it is stored or transferred, with encryption keys and certificates securely managed?", "type": "choice"}, {"id": "32", "label": "Is confidential or restricted data protected with approved encryption during transmission, including concealing communication patterns where required?", "type": "choice"}, {"id": "33", "label": "Is confidential or restricted data encrypted using approved methods when stored within MTM infrastructure or in external and cloud services?", "type": "choice"}, {"id": "34", "label": "Are approved encryption algorithms, protocols and key strengths used?", "type": "choice"}, {"id": "35", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "ES3.01-15-0", "code": "ES3.01", "label": "Only approved encryption and hashing methods are used, such as AES- 128/192/256, SHA-2, RSA, DH, ECDH and ECDSA."}, {"id": "ES3.03-15-1", "code": "ES3.03", "label": "Cryptographic algorithms must provide at least 112 bits of effective security strength."}, {"id": "ES3.04-15-2", "code": "ES3.04", "label": "Encryption keys meet the required minimum strength, such as RSA and DH keys of at least 2048 bits and approved elliptic curves such as NIST P- 256, P-384 or P- 521."}, {"id": "ES3.08-15-3", "code": "ES3.08", "label": "Only approved secure communication protocols are used, such as TLS 1.2 or above, SSH 2.0, IPsec, S/MIME, OpenPGP, WPA2 or WPA3."}, {"id": "ES3.09-15-4", "code": "ES3.09", "label": "TLS connections must use TLS 1.2 or above with approved encryption, secure key exchange, SHA- 2 certificates, disabled compression and Perfect Forward Secrecy."}, {"id": "ES3.10-15-5", "code": "ES3.10", "label": "SSH is securely configured using SSH 2.0, public-key authentication, protected private keys and insecure access or forwarding features disabled."}, {"id": "ES3.12-16-0", "code": "ES3.12", "label": "IPsec is securely configured using ESP, IKE, AES encryption, approved SHA- 2 authentication, strong DH or ECDH key exchange and Perfect Forward Secrecy."}]}, {"id": "36", "label": "Are cryptographic keys and certificates securely managed throughout their lifecycle?", "type": "choice"}, {"id": "37", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "ES4.01-17-0", "code": "ES4.01", "label": "Cryptographic keys are securely managed throughout their lifecycle, including generation, storage, recovery and destruction."}, {"id": "ES4.02-17-1", "code": "ES4.02", "label": "Private keys are securely stored and accessible only to authorised personnel."}, {"id": "ES4.03-17-2", "code": "ES4.03", "label": "Public and internal certificates are issued by approved certificate authorities and meet required validity periods."}, {"id": "ES4.05-17-3", "code": "ES4.05", "label": "Certificates and keys can be promptly revoked when compromised, outdated or no longer required."}]}, {"id": "38", "label": "For Q5 - Data Encryption & Key Management, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 6, "title": "User Identity and Access Management", "page": 18, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10102", "questions": [{"id": "39", "label": "Are user identities, accounts and access rights securely approved, authenticated, protected, reviewed, logged and removed when no longer required?", "type": "choice"}, {"id": "40", "label": "Are authorised users given appropriate access, with access logged, regularly reviewed and removed when no longer required?", "type": "choice"}, {"id": "41", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "IA1.01-18-0", "code": "IA1.01", "label": "User access is approved before it is granted and limited to what is needed."}, {"id": "IA1.05-18-1", "code": "IA1.05", "label": "User sessions and login activity are securely managed and logged."}, {"id": "IA1.08-18-2", "code": "IA1.08", "label": "Accounts are disabled or deleted when no longer required, and default accounts are secured."}]}, {"id": "42", "label": "Is privileged access approved, limited to authorised personnel, logged, regularly reviewed and removed when no longer required?", "type": "choice"}, {"id": "43", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "IA2.01-19-0", "code": "IA2.01", "label": "Privileged access is approved, limited to authorised personnel and used only for administrative tasks."}, {"id": "IA2.04-19-1", "code": "IA2.04", "label": "Privileged accounts are securely restricted and removed when no longer required."}, {"id": "IA2.10-19-2", "code": "IA2.10", "label": "Privileged access and activities are logged and regularly reviewed."}]}, {"id": "44", "label": "Are service accounts approved, limited to the access they need and removed when no longer required?", "type": "choice"}, {"id": "45", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "IA3.01-20-0", "code": "IA3.01", "label": "Service accounts are approved before creation and limited to the minimum access required."}, {"id": "IA3.03-20-1", "code": "IA3.03", "label": "Each system or application uses a unique service account that is not used for normal user activities."}, {"id": "IA3.04-20-2", "code": "IA3.04", "label": "Service accounts are removed when no longer required."}]}, {"id": "46", "label": "Are shared accounts prohibited unless formally approved, assigned an owner and monitored so their use can be traced to individual users?", "type": "choice"}, {"id": "47", "label": "Are temporary and contractor access limited to what is needed, set with an appropriate expiry date (30 days), and disabled when it expires unless formally extended?", "type": "choice"}, {"id": "48", "label": "Are emergency accounts used only when normal or privileged access is unavailable, with credentials changed after each use?", "type": "choice"}, {"id": "49", "label": "Are strong password controls in place to ensure passwords are secure, unique, protected and changed if compromised?", "type": "choice"}, {"id": "50", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "IA7.02-22-0", "code": "IA7.02", "label": "Passwords are strong, unique and not based on common words or publicly available information."}, {"id": "IA7.04-22-1", "code": "IA7.04", "label": "User account passwords must be at least 12 characters, meet complexity requirements, prevent reuse, expire within 365 days and lock after three failed attempts. Privileged account passwords must be at least 20 characters and changed every 30 days."}, {"id": "IA7.05-22-2", "code": "IA7.05", "label": "Privileged, service, emergency and key- management accounts use stronger passwords of at least 20 characters."}, {"id": "IA7.07-22-3", "code": "IA7.07", "label": "Passwords are securely stored, transmitted through encrypted channels and hidden when displayed or printed."}, {"id": "IA7.09-22-4", "code": "IA7.09", "label": "Passwords are changed after first use, reset or suspected compromise, including when exposed, weak or found in a data breach."}]}, {"id": "51", "label": "Is multi-factor authentication used for internet-facing systems handling MTM data, and are all successful and failed attempts logged?", "type": "choice"}, {"id": "52", "label": "For Q6 - User Identity and Access Management, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 7, "title": "Device Security", "page": 24, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10487", "questions": [{"id": "53", "label": "Are MTM-managed mobile devices and approved personal devices securely configured, updated, monitored and restricted to prevent unauthorised access and protect MTM systems and information?", "type": "choice"}, {"id": "54", "label": "Are MTM-managed mobile devices securely configured and protected to prevent unauthorised software installation or changes to security settings?", "type": "choice"}, {"id": "55", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "MB1.01-25-0", "code": "MB1.01", "label": "MTM- managed mobile devices are centrally managed, securely configured, patched and protected with strong authentication."}, {"id": "MB1.02-25-1", "code": "MB1.02", "label": "Users cannot install unapproved applications or disable security controls, and MTM information on devices is encrypted. MTM information is securely removed when a device is no longer managed or in use."}]}, {"id": "56", "label": "Is approved personal devices access limited to approved MTM services, separated from internal networks, and securely maintained by the device owner?", "type": "choice"}, {"id": "57", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "MB2.01-26-0", "code": "MB2.01", "label": "Personal devices operati ng systems and applications are kept up to date by the device owner."}, {"id": "MB2.02-26-1", "code": "MB2.02", "label": "Personal devices access is limited to approved MTM services, protected with multi-factor authentication and separated from MTM internal networks."}, {"id": "MB2.06-26-2", "code": "MB2.06", "label": "Personal devices access is logged, and device owners remain responsible for the operation and support of their devices."}]}, {"id": "58", "label": "For Q7 - Device Security, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 8, "title": "Network Security", "page": 27, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10487", "questions": [{"id": "59", "label": "Is the network securely designed, segmented, configured and monitored, with approved controls for external, remote and wireless access and arrangements to maintain critical services during failures?", "type": "choice"}, {"id": "60", "label": "Is the network securely designed, configured and managed to prevent unauthorised changes?", "type": "choice"}, {"id": "61", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "NS1.01-28-0", "code": "NS1.01", "label": "Network designs, data flows, ownership and service requirements are documented."}, {"id": "NS1.05-28-1", "code": "NS1.05", "label": "Network devices are securely configured, with changes limited to authorised administrators and unused ports or services disabled."}, {"id": "NS1.07-28-2", "code": "NS1.07", "label": "Network management traffic is encrypted, and network security events are logged and monitored."}]}, {"id": "62", "label": "Are network boundaries protected by approved gateways, firewalls and threat controls to block unauthorised access and control data moving between MTM and untrusted networks?", "type": "choice"}, {"id": "63", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "NS2.01-29-0", "code": "NS2.01", "label": "Only authorised devices and required business traffic are allowed on the network."}, {"id": "NS2.02-29-1", "code": "NS2.02", "label": "Firewalls, gateways, DMZs and threat protection controls separate MTM from untrusted networks and allow only approved, encrypted data flows."}, {"id": "NS2.10-29-2", "code": "NS2.10", "label": "Web traffic is securely filtered and logged, and unsafe network methods such as unauthorised IPv6 tunnelling are blocked."}]}, {"id": "64", "label": "Are MTM networks segmented based on system criticality and data sensitivity, to limit unauthorised access and prevent threats from spreading?", "type": "choice"}, {"id": "65", "label": "Is the network and telecommunications infrastructure designed with backup connections, services and power to support availability and recovery requirements?", "type": "choice"}, {"id": "66", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "NS4.01-30-0", "code": "NS4.01", "label": "Backup telecommunications services are available and tested at least annually to meet business recovery requirements."}, {"id": "NS4.04-30-1", "code": "NS4.04", "label": "Network boundary controls fail securely by blocking communications when protection mechanisms fail."}, {"id": "NS4.07-30-2", "code": "NS4.07", "label": "Critical network equipment has redundant links, backup power supplies and at least two hours of UPS support."}]}, {"id": "67", "label": "Is remote access to MTM networks and systems securely authenticated, encrypted, monitored and provided through approved secure connections?", "type": "choice"}, {"id": "68", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "NS5.01-31-0", "code": "NS5.01", "label": "Remote access connects through an approved DMZ and does not connect directly to internal MTM systems."}, {"id": "NS5.03-31-1", "code": "NS5.03", "label": "Remote access uses strong authentication, authorisation and multi-factor authentication."}, {"id": "NS5.02-31-2", "code": "NS5.02", "label": "Remote sessions are encrypted, automatically disconnected when finished and time out after 30 minutes of inactivity."}]}, {"id": "69", "label": "Is wireless access securely configured, encrypted and separated from MTM\u2019s internal networks?", "type": "choice"}, {"id": "70", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "NS6.01-32-0", "code": "NS6.01", "label": "Wireless data is encrypted, and public wireless networks are separated from MTM networks."}, {"id": "NS6.03-32-1", "code": "NS6.03", "label": "Default wireless accounts, passwords and network names are changed, and access points are securely configured."}, {"id": "NS6.06-32-2", "code": "NS6.06", "label": "Only authorised users and devices can connect, and wireless access to administrative interfaces is disabled."}]}, {"id": "71", "label": "For Q8 - Network Security, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 9, "title": "Removable Media Security", "page": 33, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10382", "questions": [{"id": "72", "label": "Is removable media formally approved, registered and securely managed throughout its lifecycle, including ownership, tracking, malware checking, encryption, incident reporting, secure erasure and disposal?", "type": "choice"}, {"id": "73", "label": "For Q9 - Removable Media Security, please provide any relevant comments, evidence, identified gaps, or reasons for the selected implementation status. (Where applicable, you may provide details for more than one system.)", "type": "comment"}]}, {"number": 10, "title": "Security Event Logging and Monitoring", "page": 34, "standardUrl": "https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10465", "questions": [{"id": "74", "label": "Does the system create detailed security records that are centrally stored, protected and monitored to help detect and investigate suspicious activity or security incidents?", "type": "choice"}, {"id": "75", "label": "Are key security events logged with enough detail to show what happened, when and where it happened, and which user, system or source was involved?", "type": "choice"}, {"id": "76", "label": "For each statement below, select its implementation status for the system or application being assessed.", "type": "matrix", "items": [{"id": "AU1.01-35-0", "code": "AU1.01", "label": "Key security events are logged, including account changes, login activity, access failures, security changes, privileged actions and system errors."}, {"id": "AU1.02-35-1", "code": "AU1.02", "label": "Logs record what happened, when and where it happened, the source, and the user or system involved."}, {"id": "AU1.03-35-2", "code": "AU1.03", "label": "Systems use an accurate time source, sensitive information in logs is limited, and logging fa   "question": "Is the information a document that has been prepared for consideration by Victorian Cabinet (including in draft form): A document is described as ‘Cabinet-In-Confidence’ if it is: \n - an official record of any deliberation or decision of Cabinet \n - a document that has been prepared by a Minister or on their behalf or by an agency for the purpose of submission for consideration by Cabinet \n - a document prepared for the purpose of briefing a Minister in relation to issues to be considered by Cabinet \n - a document that is a draft of, or contains extracts from a document referred to above \n - a document which refers to any deliberation or decision of Cabinet, other than a document by which a decision of Cabinet was officially published. \nTo be applied to Victorian Cabinet information, based on exemptions under the Freedom of Information Act 1982.",
  "options": [
   "Yes",
   "No"
  ],
  "default": "No",
  "scoreIfYes": 3,
  "src": "'Working Sheet'!G57 / H57"

/* ---- BilStore: data access for BIL assessment records (persistence goes through the app's DB and save()) ----

const BIL_ALL_IDS=BIL_CFG.questions.map(q=>q.id);

const nowStamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;};

 create(aid){const a=DB.assets[aid],prev=BilStore.approved(aid),ver=((BilStore.forAsset(aid)[0]||{}).version||0)+1,id=nid('BIL');

  const r=Object.assign(base,{id,name:`BIL assessment · ${a.name} · v${ver}`,assetId:aid,assetName:a.name,version:ver,status:'draft',assessor:'',approver:'',ownerApproval:'',rationale:'',created:TODAY,updated:TODAY,assessmentDate:null,submittedOn:null,reviewDate:null,nextDue:null,result:null,audit:[]});
  BilStore.syncAnswers(r);BilStore.log(r,prev?`Created from approved ${prev.id} v${prev.version}`:'Created');DB.bil[id]=r;save();return r;},
 /* Everything the audit record needs, worked out from the saved responses */

  return {at:nowStamp(),config:BIL_CFG.source.version,fingerprint:BilCalc.fingerprint(x),C:x.C,I:x.I,A:x.A,osv:x.osv,marking:x.marking,
   vpdsf:x.vpdsf.primary&&x.vpdsf.primary.name,vpdsfSub:x.vpdsf.sub&&x.vpdsf.sub.name,riskContext:x.riskContext.overall&&x.riskContext.overall.name,
   rpo:x.rpo,rto:x.rto,tier:x.tier,targetTier:x.targetTier,soci:x.soci,imm:(r.imm||[]).slice(),
   responses:Object.fromEntries(q.map(qq=>{const i=(r.choices||{})[qq.id],o=i==null||i===''?null:qq.options[Number(i)];return [qq.id,o?{rating:o.score,text:o.text}:null];})),cabinet:r.cabinet};},

  BIL_ALL_IDS.forEach(id=>{const s=(r.answers||{})[id];if(s==null||s==='')return;const q=BIL_CFG.questions.find(x=>x.id===id),i=q.options.findIndex(o=>o.score===Number(s));if(i<0)unmapped.push(id);else choices[id]=i;});

  r.prelim={A1:yn(r.newInfo),A2:yn(r.recent),B1:r.infoName||'',B2:r.description||'',B3:BIL_CFG.groups.includes(r.group)?r.group:'',B4:r.system||'',B5:'',B6:r.division||'',B7:r.ownerTitle||'',B8:r.custodianTitle||'',B9:'',B10:yn(r.personal)};
  r.choices=choices;r.cabinet=yn(r.cabinet);r.imm=r.imm||[];r.name=r.name||`BIL assessment · ${(assets[r.assetId]||{}).name||r.assetId} · v${r.version}`;r.assetName=(assets[r.assetId]||{}).name||'';

};

/* ---- Likert grid: one row per question, one column per rating 0-5 ----
   Each cell selects the first consequence in the form with that rating; ratings a question does not offer are shown as unavailable. */
const lkOpt=(q,s)=>q.options.findIndex(o=>o.score===s);

 const sc={I:'Integrity (Availability 0)',A:'Availability (Integrity 0)',B:'Integrity and Availability',D:'Integrity'}[st.s];return t(st.r)+(sc?` <span class="small">· applies to ${sc}</span>`:' <span class="small">· choose where it applies</span>');}
function IntegrityAvailabilityGrid(r,em,lock){const order=BIL_CFG.riskContext.order;

  <div class="ia2nd" id="ia2_${k}" ${st.s==='D'?'':'hidden'}><span class="small"><strong>Availability rating</strong> (the rating above is for Integrity)</span>${iaCells(k,'ia2','data-iar2',st.r2,qa,lock,'dsIA2'+k)}<div class="lkdesc" id="dsIA2${k}">${st.r2==null?'<span class="small">Choose the Availability rating</span>':`<strong>${st.r2}</strong> · ${e(qa.options[lkOpt(qa,st.r2)].text)}`}</div></div>

/* Yes / No question used for preliminary questions, C13 and AP1 */
function YesNoCard(id,label,value,err,lock,extra){const name='yn_'+id;

 <p class="ferr" id="er_${e(id)}" ${err?'':'hidden'}>${e(err||'')}</p></fieldset>`;}

function TextCard(id,label,value,err,opt){opt=opt||{};const ctl=opt.area?`<textarea id="bp_${e(id)}" data-bilp="${e(id)}" aria-describedby="er_${e(id)}" ${err?'aria-invalid="true"':''} ${opt.lock?'disabled':''}>${e(value||'')}</textarea>`

 return `<div class="qcard txt ${err?'invalid':''}" id="f_${e(id)}"><label for="bp_${e(id)}">${/^[A-C]\d/.test(id)?`<span class="qid">${e(id)}</span> `:''}${e(label)}</label>${ctl}<p class="ferr" id="er_${e(id)}" ${err?'':'hidden'}>${e(err||'')}</p></div>`;}

/* Steps through the form; each shows how many required items are complete */
function ProgressStepper(steps){const done=steps.reduce((n,s)=>n+s.done,0),tot=steps.reduce((n,s)=>n+s.total,0),pct=tot?Math.round(done/tot*100):0;
 return `<nav class="stepper" aria-label="Assessment progress"><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Required items complete"><span style="width:${pct}%"></span></div>
 <p class="small" style="margin:4px 0 8px">${done} of ${tot} required items complete</p>
 <ol>${steps.map((s,i)=>{const st=s.total&&s.done===s.total?'done':s.done?'part':'todo';return `<li class="${st}"><a href="#bil-s${i+1}"><span class="snum" aria-hidden="true">${st==='done'?'✓':i+1}</span><span><strong>${e(s.label)}</strong><span class="small">${s.done} of ${s.total}${s.errors?` · ${s.errors} to fix`:''}</span></span></a></li>`;}).join('')}</ol></nav>`;}

function ProtectiveMarkingBanner(marking,imm){const m=marking||'';const cls=!m?'none':/TOP SECRET|SECRET/.test(m)?'sec':/PROTECTED/.test(m)?'prot':/Sensitive/.test(m)?'sens':/UNOFFICIAL/.test(m)?'unoff':'off';

/* Accessible confirmation dialog: focus moves into it, Tab stays inside, Escape cancels */
function ConfirmDialog(opt){closeDialog();const d=document.createElement('div');d.className='dlg-back';d.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT" aria-describedby="dlgM"><h2 id="dlgT">${e(opt.title)}</h2><p id="dlgM">${e(opt.message)}</p><div class="btnrow">${opt.buttons.map((b,i)=>`<button type="button" class="${b.kind||'secondary'}" data-dlg="${i}">${e(b.label)}</button>`).join('')}</div></div>`;
 document.body.appendChild(d);const prev=document.activeElement;const btns=[...d.querySelectorAll('button')];
 const done=i=>{closeDialog();if(prev&&prev.focus&&document.body.contains(prev))prev.focus();const b=opt.buttons[i];if(b&&b.fn)b.fn();};
 d.addEventListener('click',ev=>{const b=ev.target.closest('[data-dlg]');if(b)done(Number(b.dataset.dlg));else if(ev.target===d)done(opt.cancel);});
 d.addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.preventDefault();done(opt.cancel);}if(ev.key==='Tab'){const f=btns[0],l=btns[btns.length-1];if(ev.shiftKey&&document.activeElement===f){ev.preventDefault();l.focus();}else if(!ev.shiftKey&&document.activeElement===l){ev.preventDefault();f.focus();}}});
 (btns[opt.focus||0]||btns[0]).focus();}

 BIL_CFG.riskContext.order.forEach((cat,i)=>{const k=i+1,st=iaState(r,k),f='IA'+k;

 if(!String(r.name||'').trim())errs.push({field:'name',message:'Assessment name is required.'});

 const secC=`<section class="panel section" id="bil-s2" aria-labelledby="bil-h2"><h2 id="bil-h2">Section 2 · Confidentiality</h2><p class="sub">Consider the impact of unauthorised <strong>disclosure</strong> of the information. The consequences are based on the ${Term('VPDSF')} business impact levels. Pick a rating from 0 to 5 for each question: hover over or focus a rating to read its consequence, and choose the lowest that applies. The highest rating sets the ${Term('BIL','BIL')} for Confidentiality.</p>

 const body=`<div id="bilValBox">${ValidationSummary(errs)}</div>
 <div class="notice">Answer every question. Each consequence carries a rating from 0 to 5. The ${Term('BIL','BIL')} for each of ${Term('CIA','Confidentiality, Integrity and Availability')} is the highest rating in that section; 0 means no business impact. Confidentiality consequences come from the ${Term('VPDSF')}; Integrity and Availability consequences come from the ${Term('MIRP','MTM Integrated Risk Procedure')}. Results are calculated from your answers exactly as in the MTM BIL Assessment Form (${e(BIL_CFG.source.version)}) and cannot be overridden. Save a draft at any point.</div>

</section>
 ${secC}${secIA}

 BIL_PI.forEach(id=>{r.prelim[id]=[...document.querySelectorAll(`[data-bilpi="${id}"]:checked`)].map(x=>x.value);});

/* ================= Threat Risk Assessment (steps 1–3) ================= */
const BIL_LABELS=['N/A','Minor','Limited','Major','Serious','Exceptional'];
const TRA_THREATS=[['T01','Data corruption','I'],['T02','Unauthorised access to data','C'],['T03','Unauthorised modification of data','I'],['T04','Unauthorised disclosure of data','C'],['T05','Denial of service','A'],['T06','Social engineering','MAX'],['T07','Ransomware','A'],['T08','Bespoke software','MAX'],['T09','Supply chain compromise','MAX'],['T10','Repudiation','I'],['T11','External access','MAX'],['T12','Insecure credentials','MAX'],['T13','Removable media exploits','MAX'],['T14','Unauthorised service enumeration and discovery','MAX']];
const TRA_BASIS={C:'BIL C',I:'BIL I',A:'BIL A',MAX:'Highest BIL'};
/* Question bank: loaded from /api/tra-questions (Cloudflare D1); this built-in copy is the fallback */
/* Likelihood questions, each rated 1 (Rare) to 5 (Almost certain). Loaded from /api/tra-questions (Cloudflare D1); this built-in copy is the fallback */
let LQ=[
 {id:"Q1",text:"How likely is it that an attacker reaches the system from outside, maps its services or knocks it offline?",guidance:'',threats:["T05", "T11", "T14"],levels:["Isolated · only needed services on · tested failover", "Segmented, outbound through a gateway only · unused services off", "Reachable from the corporate network or neighbouring zones · single point of failure", "Reachable by third parties through remote access · many open services", "Directly internet facing · services discoverable · no protection"]},
 {id:"Q2",text:"How likely is it that someone gets in with weak, shared or stolen credentials without being traced?",guidance:'',threats:["T02", "T10", "T12"],levels:["Named accounts · MFA · actions logged and protected", "No MFA on some administrator accounts · logs not reviewed", "Some shared or service accounts, managed and rotated · partial logging", "Shared or default accounts not rotated · little logging", "Default, hard-coded or no login · no logging"]},
 {id:"Q3",text:"How likely is it that data or configuration is corrupted or changed without permission?",guidance:'',threats:["T01", "T03"],levels:["Read-only to users · changes approved and logged · backups tested", "A few administrators under change control · backups kept", "Staff can change it · logged, not reviewed · backups untested", "Many users or integrations can change it · little logging", "Anyone or any connected system can change it · no backups"]},
 {id:"Q4",text:"How likely is it that ransomware or other malware disrupts the system?",guidance:'',threats:["T07"],levels:["Only approved software runs · patched · offline backups tested", "Patched on time · offline backups", "Some patches overdue · backups online only or untested", "Critical patches overdue · users can install software", "End of life · anyone can run anything · no usable backups"]},
 {id:"Q5",text:"How likely is it that sensitive data leaks out?",guidance:'',threats:["T04"],levels:["No sensitive data, or encrypted with no way to export it", "Encrypted · export limited to a few people", "Staff can see it · some export routes (email, USB)", "Many users or third parties can see it · few export controls", "Exposed to the internet or public · unencrypted"]},
 {id:"Q6",text:"How likely is it that people are tricked, or malware arrives by USB, email, files or links?",guidance:'',threats:["T06", "T13"],levels:["No human users · ports disabled", "A few trained administrators · scanned transfer station only", "Staff use it · trained · email, web and USB scanned", "Many users · email, links or phone requests · partial scanning", "Public users or help desk with no identity checks · unrestricted USB and files"]},
 {id:"Q7",text:"How likely is it that the system is compromised through its supplier or custom software?",guidance:'',threats:["T08", "T09"],levels:["Off-the-shelf · no supplier access · MTM controls updates", "Configured product · supplier on-site and escorted", "Customised and tested by MTM · supplier uses jump host with MFA", "Bespoke, little testing · supplier hosts it or has always-on access", "Bespoke and untested · supplier connects and updates unmanaged"]}];
let QB_SOURCE='built-in',CTL_SOURCE='built-in';
const EXPOSURE_NONE_L=2; /* all exposure answers No: Limited Local Connectivity */
const OLD_Q_MAP={Q3:'E1',Q4:'E2',Q2:'V1',Q6:'V1',Q5:'V2',Q8:'V3',Q9:'V4',Q10:'V5',Q7:'V6'};
function migrateAnswers(t){const a=t&&t.answers;if(!a)return;const ks=Object.keys(a);if(!ks.some(k=>/^Q\d+$/.test(k))||ks.some(k=>/^[EV]\d+$/.test(k)))return;const n={};Object.entries(OLD_Q_MAP).forEach(([o,v])=>{if(a[o]&&!n[v])n[v]={a:a[o].a,notes:a[o].notes||''};});t.answers=n;}
const LQ_IDENT=3; /* a rating of 3 (Possible) or more identifies the question's threats */
const lqScore=(t,id)=>{const n=Number(((t.lq||{})[id]||{}).s);return n>=1&&n<=5?n:0;};
/* Likelihood of each threat: the highest rating among the questions that cover it. A threat ticked in the vulnerability register counts as at least Possible. */
function traThreatL(t){const m={};LQ.forEach(q=>{const sc=lqScore(t,q.id);if(!sc)return;q.threats.forEach(id=>{const c=m[id]||(m[id]={L:0,by:[]});if(sc>c.L){c.L=sc;c.by=[q.id];}else if(sc===c.L)c.by.push(q.id);});});
 (t.vulns||[]).forEach(v=>(v.threats||[]).forEach(id=>{const c=m[id]||(m[id]={L:0,by:[]});if(c.L<LQ_IDENT){c.L=LQ_IDENT;c.by=['vulnerability register'];}}));return m;}
/* A statement's default likelihood: the highest likelihood among its considered threats; Rare when none is identified */
function stmtDefaultL(t,causes){const tl=traThreatL(t);let L=0,by=[];causes.forEach(r=>{const x=(tl[r.id]||{}).L||0;if(x>L){L=x;by=[r.id];}else if(x&&x===L)by.push(r.id);});return L?{L,by}:{L:1,by:[]};}
const lqLevelHtml=txt=>String(txt||'').split(/ · |; /).map(e).join('<br>');
async function loadQuestionBank(){try{const r=await fetch('/api/tra-questions',{headers:{accept:'application/json'}});if(!r.ok)return;const j=await r.json();const valid=new Set(TRA_THREATS.map(x=>x[0]));
 const lq=(Array.isArray(j.likelihood_questions)?j.likelihood_questions:[]).map(q=>({id:String(q.id),text:String(q.question||''),guidance:String(q.guidance||''),levels:(Array.isArray(q.levels)?q.levels:[]).slice(0,5).map(x=>String(x||'')),threats:(q.threats||[]).map(String).filter(x=>valid.has(x))})).filter(q=>/^Q\d+$/.test(q.id)&&q.text&&q.levels.length===5);
 if(lq.length){LQ=lq;QB_SOURCE='question bank';}
 /* Control sets: the database decides which MTM and IEC controls exist and their title, description, domain, threats, CIA and (IEC) SL-T */
 const dbC=(Array.isArray(j.controls)?j.controls:[]).filter(d=>d&&/^(MTM|IEC):/.test(String(d.id))&&d.title&&d.code);

any other employees. c. Interfere with any business activities. d. Compromise the security of technology assets. e. Breach any MTM policies and standards. f. Violate laws, regulations, or orders. g. Consume MTM Helpdesk and/or IT resources. MTM accepts no liability for any personal loss or damages suffered by users because of personal use.","Baseline",["General","Desktop/End User"],["T07"]],["AP.2.02","Personal reasonable use of MTM technology assets for non-work-related activities must comply with MTM's policies and standards.","Baseline",["General","Desktop/End User"],["T07"]],["AP.2.03","MTM technology assets must not be used for personal activities that degrade system performance or consume excessive network bandwidth, such as cryptocurrency mining or outsourcing processing power to third parties","Baseline",["General","Desktop/End User","Network"],["T09"]],["AP.2.04","Users must protect MTM technology assets from damage, theft, or unauthorized access at all times.","Baseline",["General","Desktop/End User"],["T02"]]],"desc":"All MTM Employees and contractors must be aware of and fulfil their information security responsibilities","evidence":["Personal use guidance published to users","Acceptable use acknowledgement records"]},{"id":"AP.3","title":"Internet, e-Mail & Social media Usage","std":"Acceptable Use Standard","section":"Internet, e-Mail & Social media Usage","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A9210","refLabel":"Section 6. The Standard - Internet, e-Mail & Social media Usage","specs":[["AP.3.01","Users must exercise caution with emails from unknown senders, and report suspicious messages using the phishing button in Microsoft Outlook.","Baseline",["General","Desktop/End User"],["T06"]],["AP.3.02","Users must adhere to Metro social media Policy (A7630) which outlines the use of social media in the workplace and provides guidelines for acceptable use for all Metro employees.","Baseline",["General","Desktop/End User"],["T06"]],["AP.3.03","Users must not attempt to access areas of the internet, through MTM network, containing content relating to Dark/Deep Web, hacking, viruses, malware, scams, or Peer-to-Peer file sharing, unless authorised.","Baseline",["General","Desktop/End User"],["T02","T07"]],["AP.3.04","Users must not engage in cyberbullying, harassment, or any form of intimidation through MTM technology assets.","Baseline",["General","Desktop/End User"],["T06"]],["AP.3.05","Users must not send or forward unsolicited or junk email including advertising, jokes, chain letters and pyramid schemes.","Baseline",["General","Desktop/End User","E-mail"],["T06"]],["AP.3.06","User must not automatically forward MTM emails, files, or other information to external destinations, including but not limited to personal mailboxes, is strictly prohibited.","Baseline",["General","Desktop/End User","E-mail"],["T04"]],["AP.3.07","User must not comment or post work-related activities, images and videos on social media websites unless otherwise authorised as per social media policy[A7630].","Baseline",["General","Desktop/End User"],["T02"]],["AP.3.08","MTM data must not be transferred outside of MTM-owned systems, such as via unapproved USB drives or external cloud storage, unless explicitly authorized.","Baseline",["General","Desktop/End User"],["T02","T13"]]],"desc":"All MTM Employees and contractors must be aware of and fulfil their information security responsibilities","evidence":["Web and email filtering configuration or policy export","Social media and internet usage guidance issued to users","Acceptable use acknowledgement records"]},{"id":"AP.4","title":"Rights of the Company","std":"Acceptable Use Standard","section":"Rights of the Company","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A9210","refLabel":"Section 6. The Standard - Rights of the Company","specs":[["AP.4.01","MTM reserves the right to limit or revoke user access to networks and resources if a security breach or policy violation is suspected.","Baseline",["General","Desktop/End User","Network"],["T02","T03"]],["AP.4.02","Authorized MTM personnel may monitor and log user activities on MTM networks for security, audit, or maintenance purposes.","Baseline",["General","Desktop/End User"],["T02","T10"]],["AP.4.03","Line managers in conjunction with cyber security and people services could limit an employee’s personal use of MTM technology assets; if deemed necessary.","Baseline",["General","Desktop/End User"],["T02"]]],"desc":"All MTM Employees and contractors must be aware of and fulfil their information security responsibilities","evidence":["Monitoring and privacy notice shown to users (log-on banner or policy)","Records of any monitoring or inspection approvals"]},{"id":"AM.1","title":"System shall implement anti-malware protection mechanisms to prevent, detect, and remediate malicious code, including automated scanning, behavioural or signature-based detection, regular updates, centralized logging and monitoring of alerts, and integration with incident response processes.","std":"Anti-Malware","section":"Anti-Malware","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A9658","refLabel":"Section 6. The Standard - Anti-Malware Management","specs":[["AM.1.01","Implement controls that prevent or detect malicious code in software & website. (ISO/IEC)","Baseline",["General","Host","Server","Virtualisation","Desktop/End User"],["T07","T08"]],["AM.1.02","Implement controls to detect, eradicate and repair system with malicious code (ISO)","Baseline",["General","Host","Server","Virtualisation","Desktop/End User"],["T07","T08"]],["AM.1.03","Anti-Malware protection is implemented on network gateway to detect and eradicate malicious code from untrusted network.","Recommended",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.04","Anti-Malware must be able to analyse the characteristics and behaviour of malicious code. (NIST)","Baseline",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.05","The anti-malware software has a signature-based or heuristic-based detection enabled. (ISM)","Baseline",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.06","Anti-Malware software must automatically scan for malware of any files received over networks, via email or via any form of storage medium (fixed disk, DVDs, CDs, USB, memory cards etc). (ISO/NIST)","Baseline",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.07","The anti-malware software must have reputation rating and ransomware protection functionality enabled. (ISM)","Recommended",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.08","Malware detection mechanism to be able to detect integrity violations of application binaries and data files; (IEC) Techniques may include, but are not limited to, binary integrity and attributes monitoring, hashing and signature techniques. Mitigation techniques may include, but are not limited to, file cleaning, quarantining, file deletion, host communication restriction and IPSs. (IEC)","Recommended",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.09","There is a central management and reporting for malicious code protection. The control system must provide the capability to manage malicious code protection mechanisms. (IEC)","Recommended",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.10","Virus definition files must be kept up to date at least on a daily basis; (ISO/ISM) Note: Exception to the clause is permissible if device is not connected to any network (air-gapped). Virus definition can be updated during maintenance scheduled for the devices.","Baseline",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.11","Anti-Malware software must be active, be scheduled to perform malicious code system scan at least on a weekly basis; (ISO)","Recommended",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.12","Update malicious code protection mechanisms/software when current version is no longer supported.","Baseline",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.13","Update malicious code protection mechanisms/software as new releases are available. (NIST)","Recommended",["Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.14","Activities for the activation and de-activation of anti-malware must be logged & monitored. (ISO)","Baseline",["Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.15","Anti-malware alerts must be logged and monitored through a central Security information and event management (SIEM) solution.","Baseline",["General","Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]],["AM.1.16","Incorporate the results from malicious code detection and analysis into organisational incident response and remediation processes. (ISO/NIST)","Baseline",["Host","Server","Virtualisation","Desktop/End User"],["T03","T07","T08"]]],"evidence":["Anti-malware / EDR console report showing coverage for all system hosts","Signature or engine update status report","Scan schedule and recent scan results","Sample malware alert showing it reaches the SOC / SIEM"]},{"id":"AS.1","title":"Application development shall follow a documented secure development process, with security validation and change governance applied throughout the lifecycle.","std":"Application and Development Security Standard","section":"Development Governance & Plan","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10979","refLabel":"Section 6. The Standard - Development Governance & Plan","specs":[["AS.1.01","There must be a documented software development process to ensure the implementation of security in application. Roles and responsibility for the implementation of security on application must be identified. The document must be consistent with applicable laws, privacy requirement and aligned with organisational objective. (ISO, NIST, IEC, MTM)","Baseline",["Application"],["T04","T08"]],["AS.1.02","Application development must follow the principle of secure by design. “Secure-by-Design” means that technology products are built in a way that reasonably protects against malicious cyber actors successfully gaining access to devices, data, and connected infrastructure. (ISO, ISM, NIST, IEC, MTM)","Baseline",["Application"],["T08"]],["AS.1.03","Cyber Security must be consulted throughout the development life cycle of an application. This will ensure consistency with the organisation-wide secure design principles and risk management. (ISO, NIST, IEC, MTM)","Baseline",["Application"],["T02","T08"]],["AS.1.04","All development activities must be carried out only by authorised personnel (MTM employee and MTM contracted vendors). (MTM)","Baseline",["Application"],["T02","T09"]],["AS.1.05","All developers must keep up to date to relevant security policies, standards, and training. (MTM)","Baseline",["Application"],["T06"]],["AS.1.06","MTM’s Change Management process must be followed for any new or iterative deployments. All security controls and functionality must be validated and documented prior to the deployment or changes made to the application. (NIST/MTM)","Baseline",["Application"],["T03"]],["AS.1.07","All application security-related issues must be treated prior to the deployment or changes made to the application. (ISO, NIST, ISM, IEC, MTM)","Baseline",["Application"],["T08"]],["AS.1.08","For any new or iterative deployment of product, product documentation must be updated with following content (IEC): a) Updated product descriptions & security features, b) Updated maintenance & Support instructions, and c) Updated Configuration baseline settings.","Baseline",["Application"],["T08","T10"]]],"evidence":["Documented secure development lifecycle or procedure","Change records showing security review and approval","Secure coding standard or developer training records"]},{"id":"AS.2","title":"Production environments shall be segregated from development environments and protected to prevent unauthorised access to production systems and data.","std":"Application and Development Security Standard","section":"Development Environment","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10979","refLabel":"Section 6. The Standard - Development Environment","specs":[["AS.2.01","Development Environment must be segregated from production environment. Development and modification of software only takes place in development environments. (ISO, ISM, IEC, MTM)","Baseline",["Application"],["T03"]],["AS.2.02","All changes impacting security must be tested and verified before implementation in a production environment. (ISO, NIST, IEC, MTM)","Baseline",["Application"],["T03","T08"]],["AS.2.03","Confidential (official-sensitive) or restricted (protected) Data from production environments must not be used in a development or testing environment unless the environment is secured to the same level as the production environment (MTM).","Baseline",["Application"],["T04"]],["AS.2.04","Development and testing environments must not use the same data source/repositories as the production environments. (ISM, IEC, MTM)","Baseline",["Application"],["T04"]],["AS.2.05","All other non-production environment (such as Test, UAT and Pre-production) should be segregated from production environment.?","Recommended",["Application"],["T04"]]],"evidence":["Environment architecture showing separation of development, test and production","Access list for production showing developers are restricted","Change or release records for promotion to production"]},{"id":"AS.3","title":"Applications shall be securely configured and protected through input validation, authentication and authorisation controls, secure session management, data protection, and recovery capabilities.","std":"Application and Development Security Standard","section":"Application security controls and configurations","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10979","refLabel":"Section 6. The Standard - Application security controls and configurations","specs":[["AS.3.01","Application must be deployed on an authorized system. (NIST/MTM)","Baseline",["Application"],["T02"]],["AS.3.02","Secure header configuration must be implemented for web applications. Controls for security header configuration are as follows (ISM, IEC, MTM): a) Security headers are properly set on the application. b) Implement Content-Security-Policy and X-Frame-Options in response headers. c) Header output is URL encoded.","Baseline",["Application"],["T04","T08"]],["AS.3.03","User Input Validation or sanitisation must be performed on all input handled by applications or assurance to be provided in case of COTS application. Controls for input validation are as follows (ISO, ISM, NIST, IEC, MTM): a) User input is validated for type, length, format, and range. b) Validation on user input must be performed on server side. c) Uploaded files must be validated for content type, size, file type and filename. d) Uploaded files must be scanned for malicious content. e) Special characters are sanitized before being used in systems. f) All page output is properly encoded.","Baseline",["Application"],["T01","T03","T04"]],["AS.3.04","Security controls to avoid bypassing authentication and authorization must be implemented. Authentication and Authorization checks must be performed on each access request. (MTM)","Baseline",["Application"],["T02"]],["AS.3.05","Verification must be done to ensure that all incorporated libraries do not possess high-risk vulnerabilities. (MTM)","Baseline",["Application"],["T08"]],["AS.3.06","All libraries must be up to date with latest security patches. (MTM)","Baseline",["Application"],["T08"]],["AS.3.07","The application must identify and address error conditions to facilitate effective remediation. Error messages must not disclose information that could be exploited by adversaries, unless revealing such information is necessary for timely troubleshooting. (ISO, NIST, IEC, MTM)","Baseline",["Application"],["T04"]],["AS.3.08","Secure configuration for application session management must be implemented for web application as follows (ISO, NIST, ISM, MTM): a) Session tokens must not be passed in URLs. b) Session timeout must be configured to 4 hours (idle) or less. c) Encrypt session data. d) Logout must result in the invalidation of the session.","Baseline",["Application"],["T04"]],["AS.3.09","Application configuration must be securely implemented as follows (excludes COTS application) (MTM): a) It must be ensured that sensitive information, such as username/password, is not hardcoded in source code or application. b) The application must undergo a peer review to ensure that it is free from backdoors. c) There is a fail-safe method within the application, ensuring that in the event of unexpected failures or errors, the system can gracefully handle and prevent data loss or service disruption.","Baseline",["Application"],["T01","T12"]],["AS.3.10","Sensitive and confidential data including PII data requires the following controls to be implemented (ISM, IEC, MTM): a) All sensitive data must be removed/obfuscated/masked by default. b) Sensitive information is only revealed to authorised users. c) Sensitive information is not logged.","Baseline",["Application"],["T02","T04"]],["AS.3.11","The database server and application server must be functionally and logically separated. (ISM, IEC, MTM)","Baseline",["Application"],["T02","T04"]],["AS.3.12","All queries made from applications to databases must be verified to ensure legitimate content and correctness of syntax (ISM, IEC).","Baseline",["Application"],["T03","T08"]],["AS.3.13","Capacity planning must be performed to guarantee adequate resources for application processing, communication, and storage. Configure system/application thresholds to restrict resource consumption and optimize the efficient management of resources/memory. (NIST/MTM)","Baseline",["Application"],["T05"]],["AS.3.14","Backup and recovery process must be available for the application. The process must be able to recover and reconstitute to a known secure state after a disruption or failure. (NIST/IEC)","Baseline",["Application"],["T01","T07"]],["AS.3.15","All internet-facing applications must be protected by a Web Application Firewall (WAF). The WAF must be configured with customized security policies to address the unique requirements and vulnerabilities of each application, ensuring comprehensive protection against potential threats and vulnerabilities.","Baseline",["Application"],["T11"]],["AS.3.16","Application security logging must be implemented as per MTM Security Event Logging and Monitoring standard. (ISO, NIST, IEC)","Recommended",["Application"],["T08","T10"]],["AS.3.17","Mechanism should be implemented to verify the integrity of both data and application components throughout their lifecycle. This can include the implementation of checksum for the application binaries. (NIST, ISM)","Recommended",["Application"],["T03"]],["AS.3.18","Automated tools should be leveraged for static and dynamic code review. (MTM)","Recommended",["Application"],["T08"]]],"evidence":["Application security configuration (authentication, session and input validation settings)","Role and permission matrix for the application","Recent application security test or code scan results"]},{"id":"AS.4","title":"New applications or applications undergoing major changes shall be security tested for vulnerabilities and verified as secure prior to deployment.","std":"Application and Development Security Standard","section":"Security Verification and testing"
