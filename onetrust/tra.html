Physical","Server","Virtualisation","Database"],["T10"]],["AU.1.04","Sensitive information and personally identifiable information contained in security event logs must be limited as much as possible.","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.1.05","Health monitoring must include the detection and response of security event logging process failure. (IE62443","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10","T14"]],["AU.1.06","Addition to the above (ref: AU.1.1 & AU.1.2), the following security events must be logged for all firewall & gateway: (ISM/MTM) a) all deny traffic on the devices, b) all permitted traffic through the devices, c) all traffic attempting to leave the devices, d) all system and admin events, e) attempted intrusions, and f) traffic anomalies.","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T05","T11"]],["AU.1.07","Addition to the above (ref: AU.1.1 & AU.1.2), the following security events must be logged for DNS: (MTM) a) IP or hostname submitting the request, b) name of request, c) type of request, and d) DNS response to request. Note: Verbose DNS logging must be enabled wherever possible to assist in threat hunting and security investigations","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.1.08","Addition to the above (ref: AU.1.1 & AU.1.2), the following security events should be logged for operating systems: (ISM) a) access to sensitive data and processes, b) DNS and HTTP requests, c) failures, restarts and changes to important processes and services, d) transfer of data to external media, e) requests to access internet resources, f) security product-related events, and g) system start-ups and shutdowns.","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T04"]],["AU.1.09","Addition to the above (ref: AU.1.1 & AU.1.2), the following security events should be logged for databases: (ISM) a) access or modification of particularly important content, b) queries containing comments, c) queries containing multiple embedded queries, d) database and query alerts or failures, e) database structure changes, f) use of executable commands, and g) database logons and logoffs.","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T03"]],["AU.1.10","Addition to the above (ref: AU.1.1 & AU.1.2), the following security events should be logged on all web applications: (MTM) a) attempted access that is denied, b) search queries initiated by users, c) user access to a web application, and d) X-Forwarded-For (XFF) request.","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T14"]],["AU.1.11","Addition to the above (ref: AU.1.1 & AU.1.2), the following security events should be logged for Web Proxy: (MTM) a) address (uniform resource locator), b) time/date, c) username or identification, d) amount of data uploaded and downloaded, e) internal ip address, and f) external ip address.","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T14"]],["AU.1.12","Addition to the above (ref: AU.1.1 & AU.1.2), following user security events should be logged (ISO): a) internet activity, b) email activity c) mobile phone activity, d) security breaches, and f) Activity on personal desktop (with approval).","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T04"]],["AU.1.13","Location information of MTM managed devices should be collected and logged to provide information for investigation when required","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02"]],["AU.1.14","Error messages should be generated to provide information necessary for corrective actions without revealing information that could be exploited (NIST)","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T04"]],["AU.1.15","A full text analysis of logged privileged commands of a system must be performed in a physically distinct component or subsystem, or any other system that is dedicated to that analysis. (NIST)","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T12"]],["AU.1.16","Verbose logging should be used wherever system, storage and network constraints allow. (MTM)","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.1.17","MTM has the capability to review, analyse and investigate security event logs for indications of inappropriate or unusual activity and the potential impact. (NIST)","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]]],"evidence":["List of logged security events for the system","Sample log entries showing user, time, source and outcome"]},{"id":"AU.2","title":"Security event logs shall be centrally stored, retained, protected from unauthorised access, modification, or deletion, and access to log management shall be restricted to authorised MTM personnel.","std":"Security Event Logging and Monitoring","section":"Logs Storage & Access","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10465","refLabel":"Section 6: The Standard - Logs Storage & Access","specs":[["AU.2.01","A centralised security event logging facility must be implemented, and systems must be configured to save security event logs to the facility as soon as possible after each event occurs. (ISM/MTM)","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.2.02","The time synchronization mechanism must be configured to provide the capability to detect unauthorized alteration and cause an event upon alteration. (IE62443)","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T10"]],["AU.2.03","All security event logs must be retained for 18 months.","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.2.04","Security event log storage capacity must be able to accommodate to the retention requirement.","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T05","T10"]],["AU.2.05","Security event logs must be protected from unauthorized access, modification, and deletion.","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T03","T10"]],["AU.2.06","Access to management of security event logging must be limited to an authorised MTM personnel","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T10"]],["AU.2.07","Security event logs should be stored in a repository that is part of a physically different system or system component than the system or component being audited. (NIST","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.2.08","An alternate security event logging capability should be provided in the event of a failure in the centralised security event logging. (NIST/IE62443","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.2.09","Security event logs are recommended to be retained for a minimum of 7 years in accordance with the National Archives of Australia’s Administrative Functions Disposal Authority Express Version 2 publication. (ISM)","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.2.10","Cryptographic mechanisms should be implemented to protect the integrity of security event logs.","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T03","T10"]],["AU.2.11","Dual authorization for movement and or deletion of MTM security event logs should be enforced.","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T10"]],["AU.2.12","System administrators should not have permission to modify, erase or de-activate security event logs. Only read-only access should be granted to logs.","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T10"]]],"evidence":["Log forwarding configuration to central log store","Log retention settings","Access list for log management"]},{"id":"AU.3","title":"Security event logs required for monitoring and incident response shall be available for SIEM analysis, correlation, searching, alerting, and timely review by trained Security Operations personnel.","std":"Security Event Logging and Monitoring","section":"Security Monitoring","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10465","refLabel":"Section 6: The Standard - Security Monitoring","specs":[["AU.3.01","All security event logs required for security monitoring and digital forensic incident response must be available for Security information and event management (SIEM) analysis.","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.3.02","SIEM capability must be able to correlate events logs from multiple sources, providing the capability to centrally review and analyse security events or alerts","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.3.03","SIEM capability must have the capability to processes, sort, and search security event records.","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.3.04","Security Operations must be trained to detect and response to security threat in MTM.","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T06","T07"]],["AU.3.05","SIEM capability should support near real-time analysis of events. This is to ensure that security events and alerts are analysed in a timely manner to detect cyber security incidents.","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T10"]],["AU.3.06","SIEM capability should support security record reduction and report generation capability that support on-demand review of logs, without altering the integrity of original content or timestamp.","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T03","T10"]],["AU.3.07","Security Operations must be alerted when: a) inappropriate or unusual activities with security or privacy implications occur, b) allocated log storage volume reaches near capacity, c) unauthorized access, modification, or deletion of security event information, and d) an event logging process has failed.","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T03","T04","T05","T10"]],["AU.3.08","Security Monitoring should include (NIST): a) Detection of attacks and indicators of potential attacks, b) Security event and alerts from intrusion, and c) Unauthorized local, network, and remote connections","Recommended",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T05","T10","T11"]]],"evidence":["SIEM onboarding confirmation for the system","Alert use cases / rules relevant to the system","Sample alert triage record"]},{"id":"SO.1","title":"Systems and platforms shall be securely hardened and configured in accordance with approved MTM standards, and any changes impacting system security shall be governed through MTM’s Change Management process.","std":"System and Cloud Security Standard","section":"System and Platform Security","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A12003","refLabel":"Section 6: The Standard - System and Platform Security","specs":[["SO.1.01","Systems and platforms must only be chosen from vendors with a commitment to secure-by-design and secure-by-default principles. Vendor must ensure the maintenance of the security of their products. (ISM)","Baseline",["Host","Server"],["T09"]],["SO.1.02","Unneeded accounts, components, services, ports, and functionality (e.g., RDP, Autorun, LanMan, SMB/NetBIOS, LLMNR and WPAD) must either be disabled or removed. (ISM/NIST)","Baseline",["Host","Server"],["T07","T11","T13","T14"]],["SO.1.03","System hardening (including for network devices and cloud resources) must be performed and based on an approved Standard Operating Environment (SOE). SOE must comply with the following: (ISM/ISO/NIST/ACSC) a) must have an owner, b) be consistent with applicable laws, regulations, and standards, c) must be reviewed every 3 years, d) must be validated secure and free from malicious code, and e) must be reviewed by Cyber Security. f) be based on CIS recommendations. In the absence of an SOE, hardening of a system must be based on CIS Level 1 compliance. (Ref: https://downloads.cisecurity.org/)","Baseline",["Host","Server","Cloud","Network"],["T02","T07","T08","T14"]],["SO.1.04","System must have a logon banner that requires users to acknowledge and accept their security responsibilities before access is granted. Legal advice is sought on the exact wording of logon banners. (ISM)","Baseline",["Host","Server"],["T02"]],["SO.1.05","Unprivileged users are prevented from bypassing, disabling, or modifying security functionality of operating systems or software installed. (ISM)","Baseline",["Host","Server"],["T12"]],["SO.1.06","Unprivileged users are prevented from running elevated script execution engines, such as Windows Script host, PowerShell, and command line. (ISM)","Baseline",["Host","Server"],["T12"]],["SO.1.07","MTM workstations and servers must be protected with: (MTM) a) End Point Protection and Anti-malware solution align with MTM Anti-Malware Standard (A9658). b) Host-Based intrusion detection/prevention systems to identify anomalous behaviour during program execution (e.g., process injection, keystroke logging, driver loading and persistence). (ACSC) c) Mechanisms to restrict incoming network traffic (software-based firewall, NSG, etc.) that is malicious/unauthorised, blocking outgoing network traffic that is not generated by approved/trusted programs, and denying network traffic by default. (ACSC)","Baseline",["Host","Server","Cloud","Network","Desktop/End User"],["T02","T05","T07","T10","T11","T14"]],["SO.1.08","All MTM system clocks must be synchronized to MTM authorised time sources. (NIST)","Baseline",["Host","Server"],["T02"]],["SO.1.09","All system implementation and changes impacting security must be approved through MTM’s Change Management process. (MTM)","Baseline",["Host","Server"],["T03"]],["SO.1.10","MTM data must be erased from system when assets are to be released from active service and/or decommissioned. The sanitisation methods must align with MTM Information Asset Secure Handling Guideline (A9443). (NIST/IEC)","Baseline",["Host","Server"],["T01","T04"]],["SO.1.11","The system and software must always be kept up to date with supported versions. (ISO/IEC/NIST)","Baseline",["Host","Server"],["T08"]],["SO.1.12","MTM should only use 64-bit versions of operating systems. (ISM)","Recommended",["Host","Server"],["T02","T14"]],["SO.1.13","The system should have the capability to generate a report listing the currently deployed security settings. (IEC)","Recommended",["Host","Server"],["T10"]],["SO.1.14","The control system shall support supervisor manual override of the current human user authorizations for a configurable time or event sequence. (IEC)","Recommended",["Host","Server"],["T02"]],["SO.1.15","The control system shall support dual approval where an action can result in serious impact on the industrial process. (IEC)","Recommended",["Host","Server"],["T03"]]],"evidence":["Hardening baseline applied (for example CIS benchmark)","Configuration compliance scan results","Change records for security-relevant changes"]},{"id":"SO.2","title":"Operating systems and software shall only be installed where they have been security validated, approved, and are supported for use within MTM’s environment.","std":"System and Cloud Security Standard","section":"Operating System & Software Installation Security","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A12003","refLabel":"Section 6: The Standard - Operating System & Software Installation Security","specs":[["SO.2.01","Only supported versions of OS and software are used. (ISO)","Baseline",["Host","Server"],["T08"]],["SO.2.02","All OS and software can only be implemented after it has been validated for its security. (ISO)","Baseline",["Host","Server"],["T07","T08"]],["SO.2.03","Unprivileged user must not have the ability to install unapproved software, and they are unable to uninstall or disable software from the system. (ISM/ISO)","Baseline",["Host","Server"],["T02"]],["SO.2.04","OS, software, and add-ons must be restricted to an organisation-approved set. (ACSC / ISM)","Baseline",["Host","Server"],["T07"]],["SO.2.05","All temporary installation files and logs created during an installation process must be removed. (ISM)","Baseline",["Host","Server"],["T04"]],["SO.2.06","Macros must be configured to: (ISM) a) be disabled for users without business requirement, b) block macros in files originating from the internet, c) only allow vetted macros in trusted locations, d) block macros from making Win32 API calls, e) macro antivirus scanning is enabled and f) disable macros signed by untrusted publishers.","Baseline",["Host","Server"],["T07"]],["SO.2.07","Controls should ensure that the software is from a trusted source, verify code integrity, and check path rules before allowing its execution. (ISM / IEC)","Recommended",["Host","Server"],["T03"]]],"evidence":["Approved software list for the system","Evidence of vendor support status for OS and software","Software installation approval records"]},{"id":"SO.3","title":"Virtualisation, cloud, container, and serverless services shall be securely configured, reviewed, and approved prior to implementation.","std":"System and Cloud Security Standard","section":"Additional Virtualisation, Cloud, Container and Serverless Security","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A12003","refLabel":"Section 6: The Standard - Virtualisation, Cloud, Container and Serverless Security","specs":[["SO.3.01","MTM Cloud service providers (CSPs) must adhere to MTM cyber security policies and standards. (MTM)","Baseline",["Virtualisation","Cloud"],["T09"]],["SO.3.02","MTM CSPs must demonstrate regular independent audits and attestations against industry best practices (e.g., ISO 27001, ISO 27017, CSA (Cloud Security Alliance) STAR (Security Trust Assurance and risk Registry) Level 2 Certification).","Baseline",["Virtualisation","Cloud"],["T10"]],["SO.3.03","All production cloud services (IaaS, PaaS, SaaS and FaaS) must be reviewed by cyber security. (MTM).","Baseline",["Virtualisation","Cloud"],["T08","T09"]],["SO.3.04","Security Assurance validation must be performed for all internet facing cloud services by cyber security. The validation may involve activities such as penetration testing validation, vulnerability assessment validation, or security reviews.","Baseline",["Virtualisation","Cloud"],["T08","T11"]],["SO.3.05","The underlying operating system of all virtualisation server is hardened according to MTM standards for MTM-managed systems, and industry-recommended configurations for CSP-managed systems (ISM)","Baseline",["Virtualisation","Cloud"],["T02","T14"]],["SO.3.06","MTM-managed virtualized servers and computing environments, when sharing a physical server's hardware, must share the same classification and belong to the same security domain. (ISM)","Baseline",["Virtualisation","Cloud"],["T04"]],["SO.3.07","All cloud services which store, process, and collect information for MTM must be located within Australia. (MTM)","Baseline",["Virtualisation","Cloud"],["T04"]],["SO.3.08","Use secure and encrypted communication channels when migrating servers, services, applications, or data to and from all cloud environments. Such channels must include only up-to-date and approved protocols. (CSA)","Baseline",["Virtualisation","Cloud"],["T04"]],["SO.3.09","Disable publicly accessible network interface, access, or IP address on MTM-managed cloud resources unless such requirement has been reviewed and approved by Architecture and Cyber Security. (MTM)","Baseline",["Virtualisation","Cloud"],["T02","T11"]],["SO.3.10","All cloud services should be able to integrate with the MTM preferred technology solutions to ensure consistent security practice. (MTM)","Recommended",["Virtualisation","Cloud"],["T09"]],["SO.3.11","Penetration testing should be performed for all internet facing cloud services. (MTM)","Recommended",["Virtualisation","Cloud"],["T08","T11"]],["SO.3.12","Use container host OS instead of general-purpose ones to reduce attack surfaces. (e.g., Fedora CoreOS, Flatcar Container Linux)","Recommended",["Virtualisation","Cloud"],["T05","T14"]],["SO.3.13","Only group containers with the same classification and security domain on a single host OS kernel. (NIST 800-190)","Recommended",["Virtualisation","Cloud"],["T04"]],["SO.3.14","Adopt container vulnerability management tools and processes for images to prevent compromises. These tools and processes should take both image software vulnerabilities and configuration settings into account. (NIST 800-190)","Recommended",["Virtualisation","Cloud"],["T08"]],["SO.3.15","Utilise a container security solution that can monitor the container environment and provide precise detection of anomalous and malicious activity within it. (NIST 800-190)","Recommended",["Virtualisation","Cloud"],["T07","T14"]]],"evidence":["Cloud / virtualisation security configuration review","Cloud security posture report","Approval records for new cloud or container services"]},{"id":"SO.4","title":"Email services shall be securely configured and filtered to protect against spoofing and harmful content.","std":"System and Cloud Security Standard","section":"Email Security","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A12003","refLabel":"Section 6: The Standard - Email Security","specs":[["SO.4.01","Emails are routed via centralised email gateways. When users send or receive emails, an authenticated and encrypted channel is used to route emails via their organisation’s centralised email gateways. (ISM)","Baseline",["E-mail"],["T04"]],["SO.4.02","Where backup or alternative email gateways are in place, they are maintained at the same standard as the primary email gateway. (ISM)","Baseline",["E-mail"],["T01","T07"]],["SO.4.03","Sender Policy Framework (SPF) is used to specify authorised email servers (or lack thereof) for an organisation’s domains (including subdomains). SPF is used to verify the authenticity of incoming emails. (ISM)","Baseline",["E-mail"],["T02"]],["SO.4.04","Incoming emails must be monitored for spoofed emails using SPF or Sender ID. Hard fail SPF TXT and DMARC DNS records must be used to mitigate emails that spoof the organisation’s domain. (ACSC)","Baseline",["E-mail"],["T06"]],["SO.4.05","DKIM signing is enabled on emails originating from an organisation’s domains (including subdomains). DKIM signatures on incoming emails are verified. Email distribution list software used by external senders is configured such that it does not break the validity of the sender’s DKIM signature. (ISM)","Baseline",["E-mail"],["T06"]],["SO.4.06","DMARC records are configured for an organisation’s domains (including subdomains) such that emails are rejected if they do not pass DMARC checks. Incoming emails are rejected if they do not pass DMARC checks. (ISM)","Baseline",["E-mail"],["T06"]],["SO.4.07","Email content filtering is implemented to filter potentially harmful content in email bodies and attachments. (ISM)","Baseline",["E-mail"],["T06","T07"]],["SO.4.08","Emails arriving via an external connection where the email source address uses an internal domain, or internal subdomain, are blocked at the email gateway. (ISM)","Baseline",["E-mail"],["T02"]],["SO.4.09","Notifications of undeliverable emails are only sent to senders that can be verified via SPF or other trusted means. (ISM)","Baseline",["E-mail"],["T06"]],["SO.4.10","Email servers only relay emails destined for or originating from their domains (including subdomains). (ISM)","Baseline",["E-mail"],["T02"]],["SO.4.11","Protective markings are applied to emails and reflect the highest sensitivity or classification of the subject, body, and attachments. Additionally, (ISM) a) Protective marking tools do not automatically insert protective markings into emails. b) Protective marking tools do not allow users to select protective markings that a system has not been authorised to process, store or communicate. c) Protective marking tools do not allow users replying to or forwarding emails to select protective markings lower than previously used.","Recommended",["E-mail"],["T02","T04"]],["SO.4.12","Email servers are configured to block, log and report emails with inappropriate protective markings. The intended recipients of blocked inbound emails, and the senders of blocked outbound emails, are notified. (ISM)","Recommended",["E-mail"],["T10"]],["SO.4.13","Ensure TLS encryption is enabled on email servers that make incoming or outgoing email connections over public network infrastructure. (ISM)","Recommended",["E-mail"],["T04"]]],"evidence":["Email security configuration (SPF, DKIM, DMARC, filtering)","Email filtering reports"]},{"id":"SO.5","title":"Systems supporting critical services shall have recovery, redundancy, and backup arrangements that are tested, and aligned to business-defined RTO (Return Time Objective) and RPO (Return Point Objective) requirements.","std":"System and Cloud Security Standard","section":"System Availability, Recovery and Backup","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A12003","refLabel":"Section 6: The Standard - System Availability, Recovery and Backup","specs":[["SO.5.01","A recovery plan must be established to ensure the recovery and resumption of system operations for crucial services. The recovery time must be within the Recovery Point Objectives (RPO) and Recovery Time Objective (RTO) specified by the business. (MTM/NIST/IEC)","Baseline",["Host","Server"],["T01"]],["SO.5.02","If a redundant secondary system is required, it must be able to meet the required RTO and RPO. (MTM)","Baseline",["Host","Server"],["T05"]],["SO.5.03","If redundant secondary system is required, it must not collocate with the primary system. (MTM)","Baseline",["Host","Server"],["T05"]],["SO.5.04","Backups must be performed in accordance with business recovery requirements and plan. Backup data must be stored offline at an offsite location. (ISM)","Baseline",["Host","Server"],["T01","T07"]],["SO.5.05","Backup must be prevented from unauthorised access, modification, or deletion. (ISM)","Baseline",["Host","Server"],["T01","T02","T03","T07"]],["SO.5.06","Backups and recovery processes must be tested and verified regularly to ensure the reliability of the backup mechanism. (IEC)","Baseline",["Host","Server"],["T01","T07"]]],"evidence":["Backup schedule and job success reports","Most recent restore / DR test results","Documented RTO and RPO with test results against them"]},{"id":"TS.1","title":"Third-Party Security Governance","std":"Third-Party Security Standard","section":"Third-Party Security Governance","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A12811","refLabel":"Section 6: The Standard - Third-Party Security Governance","specs":[["TS.1.01","There is an organisation wide strategy for managing the cyber security risk associated with a Third-Party. (NIST)","Baseline",["Cloud","Third Party","Application"],["T09"]],["TS.1.02","Third-Party must be identified, prioritized, and assessed. A Third-Party must be assessed based on the following criteria: a)The Third-Party processes or stores MTM’s sensitive data on their systems. MTM’s sensitive data includes, but is not limited to: -Personally Identifiable Information (PII) -Financial data -MTM software source code -Train scheduling information -Signalling information -Train control data -Station design/layout information -Train network data analytics -Security/surveillance data -Train network expansions/upgrades information b)Third-Party provides ICT and engineering services that requires connectivity to MTM Systems. Examples: A tender which requires a supplier to establish connectivity channels, such as wired, wireless networks or through the internet, between MTM site and their own IT systems, for the purposes of either transferring data, data analysis, remote monitoring/diagnostics, predictive maintenance/troubleshooting or remote control/optimization.","Baseline",["Cloud","Third Party","Application"],["T04","T09","T10"]],["TS.1.03","Third-Party must be assessed prior to entering into a contractual agreement. Potential security risk to be assessed and addressed prior to finalising any engagements. (VPDSS, ISM, NIST)","Baseline",["Cloud","Third Party","Application"],["T09"]],["TS.1.04","Integration of Third-Party systems with MTM must undergo a Cybersecurity Technical Risk Assessment. The security claims of Third-Party must be validated prior to implementation. (VPDSS)","Baseline",["Cloud","Third Party","Application"],["T09"]],["TS.1.05","Third-Party integrations must be approved by OCMS. (MTM)","Baseline",["Cloud","Third Party","Application"],["T09"]],["TS.1.06","Information stored by Third-Party must comply with MTM's Information Classification Standards (A9447) and Information Asset Secure Handling Guideline (A9443). (MTM, ISM)","Baseline",["Cloud","Third Party","Application"],["T09"]],["TS.1.07","MTM systems and data must not be accessed or administered by Third-Party unless a contractual agreement exists between MTM and the Third-Party. (ISM)","Baseline",["Cloud","Third Party","Application"],["T09"]],["TS.1.08","Third-Party should undergo regular monitoring, reviews, and validation to ensure continued compliance with MTM's security requirements. Non-compliance must be raised as a risk or an exception. Non-compliance should be addressed with corrective actions and potential contract renegotiation. (VPDSS, ISM, NIST)","Recommended",["Cloud","Third Party","Application"],["T09","T10"]]],"desc":"All third-party suppliers must undergo a risk assessment before being introduced to MTM","evidence":["Third-party risk assessment for suppliers of the system","Supplier decision record (Acceptable / Conditional / Rejected)","Supplier access list and review"]},{"id":"TS.2","title":"Third-Party Contractual Agreement","std":"Third-Party Security Standard","section":"Third-Party Contractual Agreement","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A12811","refLabel":"Section 6: The Standard - Third-Party Contractual Agreement","specs":[["TS.2.01","Security responsibility must be outlined and documented in Third-Party Agreement. (VPDSS, ISM, NIST)","Baseline",["Cloud","Third Party","Application"],["T09"]],["TS.2.02","Third-Party Agreements must outline the requirement that they must restrict access to authorised personnel only. (ISM, NIST)","Baseline",["Cloud","Third Party","Application"],["T02","T09"]],["TS.2.03","Rights to audit and access information on Third-Party must be incorporated in the Third- Party Agreements. (VPDSS, ISM, NIST)","Baseline",["Cloud","Third Party","Application"],["T09","T10"]],["TS.2.04","Third-Party Agreements must include adherence to security regulations and directives by relevant authorities, including the Victoria Protective Data Security Standard (VPDSS). Additionally, they must ensure compliance with the Privacy and Data Protection Act 2014 (Vic) and its 10 Information Privacy Principles (IPPs) for handling personal information. (MTM)","Baseline",["Cloud","Third Party","Application"],["T04","T09"]],["TS.2.05","Third-Party Agreements must include the requirement for the Third-Party Supplier to notify MTM of any significant changes in operating environments or security risks. (MTM)","Baseline",["Cloud","Third Party","Application"],["T04","T09"]],["TS.2.06","Third-Party Agreements must include the requirement that the Third-Party ensure protective measures to prevent unauthorized access, misuse, or damage to data. Additionally, these agreements must outline the requirement for continuous monitoring, reviewing, and updating of data security measures to adapt to evolving risks. (MTM)","Baseline",["Cloud","Third Party","Application"],["T02","T04","T09","T10"]],["TS.2.07","Upon termination or expiration of the agreement, the Third-Party must take all necessary actions to protect MTM’s interests, including but not limited to (VPDSS, ISM): a)Immediately ceasing the use of any MTM-related branding, marks, or proprietary information. b)Returning or securely destroying any MTM data, materials, or assets in accordance with MTM’s data retention and disposal policies. c)Ensuring that no further use, reference, or association with MTM’s intellectual property, including trademarks and promotional materials, occurs beyond the termination date.","Baseline",["Cloud","Third Party","Application"],["T09"]],["TS.2.08","Third-Party Agreements must require immediate notification to MTM within one hour of detecting any data security breach impacting MTM. The Third-Party must also take immediate corrective action to resolve the breach and restore affected systems. (MTM)","Baseline",["Cloud","Third Party","Application"],["T01","T04","T09"]],["TS.2.09","Third-Party Agreements must stipulate the understanding with the Third-Party that MTM is responsible for a Critical Public Transport Asset, being the Melbourne metropolitan train network and agrees to comply with the Security of Critical Infrastructure (SOCI)Act in their involvement with it. This includes the need to report timely of Cyber Security Incidents, provide necessary information and follow any directions issued by MTM and the relevant authority. (MTM)","Baseline",["Cloud","Third Party","Application"],["T09"]],["TS.2.10","Third-Party should comply with all relevant MTM security requirements. MTM’s security requirements can be provided to the Third-Party for review, and they should be incorporated into the Third-Party's service delivery and operational processes.","Recommended",["Cloud","Third Party","Application"],["T09"]]],"desc":"All third-party suppliers must undergo a risk assessment before being introduced to MTM","evidence":["Contract clauses covering security obligations and incident notification","Data handling and location terms","Supplier certification (for example ISO 27001 or SOC 2)"]},{"id":"VM.1","title":"A complete and current inventory of assets shall be maintained and regularly reviewed to support vulnerability identification, assessment, and remediation.","std":"Vulnerability Management","section":"Asset Inventory","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10026","refLabel":"Section 6: The Standard -Asset Inventory","specs":[["VM.1.01","There is a current and complete vulnerability management inventory of assets. Information needed to support vulnerability management shall include (ISO): a) the person(s) within the organization responsible for the system, b) Hostname / IP Address, c) current state of deployment, d) Details of operating system and version, e) the application or software installed (recommended), f) the application or software vendor (recommended), g) the application or software version numbers (recommended), h) patch information (recommended), and i) Maintenance end date provided by support vendor(recommended)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T08","T09"]],["VM.1.02","Automated tools should be used for asset discovery. Discovered assets not found in the inventory of assets should be investigated and added to the inventory. (MTM/NIST)","Recommended",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],[]],["VM.1.03","Information of assets needs to be maintained, reviewed, and kept up to date. (MTM/ISM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],[]]],"evidence":["Asset inventory entries for all system components","Inventory review records"]},{"id":"VM.2","title":"Systems and applications shall be regularly monitored or scanned for vulnerabilities using authorized tools. Vulnerability findings shall be analysed and integrated with security monitoring processes to support timely identification and remediation of security weaknesses.","std":"Vulnerability Management","section":"Vulnerability Monitoring","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10026","refLabel":"Section 6: The Standard -Vulnerability Monitoring","specs":[["VM.2.01","Employ vulnerability monitoring tools with the following capability: a) facilitate interoperability among tools and automate vulnerability management process. (NIST) b) readily update the vulnerabilities to be scanned. (NIST) i. prior to a new scan; ii. when new vulnerabilities are identified and reported;","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T08","T10","T14"]],["VM.2.02","Authorise sufficient privileged & network access to system for vulnerability monitoring and scanning. (NIST)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T08","T10","T12"]],["VM.2.03","All vulnerabilities identified should be sent to the SIEM for monitoring and correlation. (MTM)","Recommended",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T10"]],["VM.2.04","Monitor and scan for vulnerabilities in the system and hosted applications (NIST/ISM). This is applicable to assets that have been identified for vulnerability monitoring. Frequency requirements are as follows: a) Daily WebApp Vulnerability Scanning for internet-facing digital channels (MTM) b) Daily vulnerability monitoring for all MTM public internet-facing systems (MTM) c) Weekly vulnerability monitoring for all other systems (MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.2.05","Ad-hoc scan for vulnerabilities in the system and hosted applications when new critical vulnerabilities potentially affecting MTM system are identified and reported. (NIST)","Recommended",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],[]],["VM.2.06","All vulnerability scans must follow MTM change management process, unless agent-based vulnerability monitoring is implemented. (ISO/MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T03","T08","T10","T14"]],["VM.2.07","Analyse vulnerability scan reports and results from vulnerability monitoring, using the following techniques (NIST): a) Comparing results from multiple vulnerability scan (if available), and b) Review audit logs to determine if a vulnerability identified in a system has been exploited. c) Correlate the scan output with audit logs to determine the presence of multi-vulnerability and multi-hop attack vectors. (NIST)","Recommended",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T05","T08","T10","T14"]]],"evidence":["Vulnerability scan schedule and latest scan report","Evidence scan findings feed security monitoring"]},{"id":"VM.3","title":"Public internet-facing systems shall undergo periodic penetration testing performed by an independent party to identify exploitable vulnerabilities and weaknesses in security controls. Penetration testing results shall be used to improve system security and support remediation of identified risks.","std":"Vulnerability Management","section":"Penetration Testing","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10026","refLabel":"Section 6: The Standard - Penetration Testing","specs":[["VM.3.01","Conduct penetration testing at least annually on public internet facing systems. (NIST/MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T11","T14"]],["VM.3.02","Penetration tests should be performed for the following systems when they are added into MTM environment (MTM): a) Custom Built Systems, b) Internal Developed Applications, and c) Internet facing systems.","Recommended",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T11","T14"]],["VM.3.03","Employ an independent penetration testing agent or team to perform penetration testing on the system or system components, with approval through Technology Change Board (TCB). (NIST)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.3.04","Employ a penetration testing process that includes once every 3 years unannounced attempts to bypass or circumvent controls to MTM infrastructure and systems (e.g. Red Team). (NIST)","Recommended",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T06","T07","T08","T10","T14"]],["VM.3.05","Regular scans should be carried out for rogue wireless access points. (MTM)","Recommended",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]]],"evidence":["Latest independent penetration test report","Remediation tracking for penetration test findings"]},{"id":"VM.4","title":"Identified vulnerabilities shall be assessed and classified based on their risk to systems and operations, with remediation actions prioritized and completed within defined timeframes.","std":"Vulnerability Management","section":"Vulnerability Classification & Prioritisation","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10026","refLabel":"Section 6: The Standard - Vulnerability Classification & Prioritisation","specs":[["VM.4.01","Once a potential technical vulnerability has been identified, MTM must identify the associated risks classification and the recommended actions to be taken (ISO). Vulnerability risk classification and recommended actions must be based on Vulnerability Rating (CVSS Score) by default.","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T08"]],["VM.4.02","Vulnerabilities classification can be recast based on the following consideration (MTM): a) Vulnerability Rating (CVSS score), b) The likelihood of compromise (based on current controls & mitigations), c) The impact on MTM if the vulnerability is exploited.","Recommended",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T08"]],["VM.4.03","All vulnerability recasting must be undertaken by System Owners in consultation with Business and Security Operations/Cyber Security. (MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T08"]],["VM.4.04","Prioritisation of remediation activities will be based on vulnerability classification: a) Critical Risk Vulnerability – Remediate within 30 days of discovery, or 48 hours if exploit exists without existing compensatory controls. b) High Risk Vulnerability – Remediate within 90 days of discovery, or 14 days if exploit exists without existing compensatory controls. c) Medium Risk Vulnerability – Remediate within 180 days of discovery, or 30 days if exploit exists existing compensatory controls. d) Low Risk Vulnerability – Remediate within 180 days of discovery or risk to be accepted. e) Informational – No Action is required.","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T08"]]],"evidence":["Vulnerability risk rating method","Remediation timeframes and current status of open vulnerabilities"]},{"id":"VM.5","title":"Vulnerabilities shall be remediated through timely patching or corrective actions based on trusted advisories, following controlled patch management and change management processes. Where remediation is not immediately possible, compensating controls shall be implemented and associated risks managed in accordance with MTM’s risk management framework.","std":"Vulnerability Management","section":"Patch & Remediation","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10026","refLabel":"Section 6: The Standard - Vulnerability Remediation & Patch Management","specs":[["VM.5.01","All personnel who manage and maintain OCMS assets must subscribe to and monitor relevant vendor, national Computer Emergency Response Team (CERT), industry newsletters, security sites or forums to be updated on vulnerabilities & patch published or released by vendors / industry. (MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T09","T10","T14"]],["VM.5.02","Vulnerability remediation must be based on recommendation provided by available official advisory (MTM).","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.5.03","Where remediation activities cannot be carried out (e.g. no available patch/update, no countermeasures/workarounds), risks relating to the known vulnerability must be evaluated. Appropriate compensatory controls must be considered until such time the remediation can be performed. Examples of compensatory controls are (ISO): a) turning off services or capabilities related to the vulnerability, b) adapting or adding access controls, e.g., firewalls, at network borders, c) isolation of affected systems, d) removal of the affected systems, e) virtual patching through IPS, f) increased monitoring to detect actual attacks, or g) raising awareness of the vulnerability. Cybersecurity should be consulted to determine if the compensatory controls sufficiently reduced the likelihood or consequence of a vulnerability being exploited. (MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T05","T06","T08","T10","T11"]],["VM.5.04","Remediation must be performed in accordance to change management process. (NIST/ISO/MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.5.05","Patch management must be performed as required and all software patches must be obtained from trusted and validated source. (ISM/MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.5.06","There must be a centralised and managed approach for patching that ensure the integrity of patches and provide the confirmation that the patch has been applied successfully. (ISM/MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.5.08","Where possible all patches should be verified using a checksum system such as MD5 or SHA2. (MTM)","Recommended",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.5.10","It is required to test the patch and updates before installation. (NIST/ISO)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.5.11","It is required to remove previous versions of software and firmware components after updated versions have been installed. (NIST)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.5.12","All software, application, Operating System or Network Devices, that are no longer supported by vendors must be replaced or a cyclical renewal plan must be in place. (ISM/MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.5.13","All patching processes must include a method for rollback or uninstallation (MTM).","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.5.14","Upon remediation, a scan should be carried out to verify that the vulnerability has been remediated. (MTM)","Recommended",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]],["VM.5.15","For all vulnerabilities & gaps that are not remediated within the required timeframe, any significant associated risk (based on MTM Risk Framework) must be tracked in the divisional risk register. (MTM)","Baseline",["Network","Host","Server","Cloud","Virtualisation","Desktop/End User","Database","Application"],["T02","T03","T07","T08","T10","T14"]]],"evidence":["Patch compliance report","Patch and change records","Exceptions with compensating controls for unpatched vulnerabilities"]}];
const IEC_REQ=[{"id":"SR 1.1","title":"Human user identification and authentication","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.3","sl":[1,2,3,4],"types":["Preventive"],"notes":"Every person who accesses the system must be identified and authenticated before they can use it, on every interface they use.","threats":{"T02":4,"T06":2,"T11":3,"T12":4},"specs":[["SR 1.1 (a)","Require log-on (identification and authentication) for all human access, both local and remote, including application-level and remote desktop interfaces.","SL 1–4"],["SR 1.1 (b)","Use accepted methods such as passwords, tokens, smart cards or biometrics, applied consistently across interfaces.","SL 1–4"],["SR 1.1 (c)","Where a group such as control-room operators must share an identity, document the justification and compensate with physical access control, monitoring and authenticated workstations.","SL 1–4"],["SR 1.1 (d)","Make sure emergency and essential operator actions are not blocked by log-on requirements.","SL 1–4"],["SR 1.1 (e)","Link authenticated identities to the permissions enforced under SR 2.1.","SL 1–4"]],"evidence":["User account list showing every user has a log-on","Authentication configuration for each human interface (HMI, engineering, remote)","Justification and compensating controls for any shared operator accounts"]},{"id":"SR 1.1 RE 1","title":"Unique identification and authentication","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.3.3.1","sl":[2,3,4],"types":["Preventive"],"notes":"Each person must have their own unique identity and credentials, so that actions can be traced to an individual.","threats":{"T02":4,"T06":2,"T11":3,"T12":4},"specs":[["SR 1.1 RE 1 (a)","Issue a unique account to every human user; avoid shared or generic accounts.","SL 2–4"],["SR 1.1 RE 1 (b)","Authenticate each user individually on all interfaces.","SL 2–4"],["SR 1.1 RE 1 (c)","Where a shared account is unavoidable, record the exception, its owner and compensating controls.","SL 2–4"]],"evidence":["User account list showing unique named accounts","Exception register for any shared accounts"]},{"id":"SR 1.1 RE 2","title":"Multifactor authentication for untrusted networks","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.3.3.2","sl":[3,4],"types":["Preventive"],"notes":"People connecting over an untrusted network (for example remote access, vendor access or the corporate network) must use multifactor authentication.","threats":{"T02":4,"T06":2,"T07":2,"T11":4,"T12":4},"specs":[["SR 1.1 RE 2 (a)","Enforce MFA for all human access that arrives through an untrusted network or remote-access path.","SL 3–4"],["SR 1.1 RE 2 (b)","Cover vendor, contractor and support remote sessions as well as staff.","SL 3–4"],["SR 1.1 RE 2 (c)","Log successful and failed MFA events.","SL 3–4"]],"evidence":["MFA configuration for remote and untrusted-network access","MFA enrolment report","Remote access log showing MFA events"]},{"id":"SR 1.1 RE 3","title":"Multifactor authentication for all networks","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.3.3.3","sl":[4],"types":["Preventive"],"notes":"Multifactor authentication is required for all human access, on every network, not only untrusted ones.","threats":{"T02":4,"T06":2,"T07":2,"T11":4,"T12":4},"specs":[["SR 1.1 RE 3 (a)","Enforce MFA for all interactive human log-ons, including local and trusted-network access.","SL 4"],["SR 1.1 RE 3 (b)","Plan for emergency operator access so MFA does not block essential functions (for example break-glass procedures with compensating controls).","SL 4"]],"evidence":["MFA configuration covering all human log-ons","Break-glass procedure for emergency operator access"]},{"id":"SR 1.2","title":"Software process and device identification and authentication","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.4","sl":[2,3,4],"types":["Preventive"],"notes":"Software processes and devices that connect to the system must be identified and authenticated before they can exchange data.","threats":{"T02":3,"T03":3,"T09":2,"T11":2},"specs":[["SR 1.2 (a)","Authenticate devices and software processes on all interfaces (for example with certificates, keys or tokens) before accepting data or commands.","SL 2–4"],["SR 1.2 (b)","Prevent unknown or rogue devices and processes from communicating with the system.","SL 2–4"],["SR 1.2 (c)","Where a device cannot hold multiple identities (for example vendor support tools), document compensating controls.","SL 2–4"]],"evidence":["Device and process authentication configuration (certificates, keys)","List of devices permitted to communicate with the system"]},{"id":"SR 1.2 RE 1","title":"Unique identification and authentication","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.4.3.1","sl":[3,4],"types":["Preventive"],"notes":"Each software process and device must have its own unique identity and credentials.","threats":{"T02":3,"T03":3,"T09":2,"T11":2},"specs":[["SR 1.2 RE 1 (a)","Assign unique identifiers and credentials to every device and software process.","SL 3–4"],["SR 1.2 RE 1 (b)","Avoid shared device or service credentials; record and compensate for any exceptions.","SL 3–4"]],"evidence":["Device / process identity register showing unique credentials"]},{"id":"SR 1.3","title":"Account management","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.5","sl":[1,2,3,4],"types":["Preventive"],"notes":"Authorised administrators must be able to manage the full lifecycle of all accounts.","threats":{"T02":4,"T07":2,"T11":3,"T12":4},"specs":[["SR 1.3 (a)","Provide a controlled process to add, activate, modify, disable and remove accounts, performed only by authorised users.","SL 1–4"],["SR 1.3 (b)","Group accounts by type (individual, role, device, service) with defined membership conditions and permissions.","SL 1–4"],["SR 1.3 (c)","Remove or disable unused default accounts created at installation.","SL 1–4"],["SR 1.3 (d)","Apply separate rules to service accounts used for process-to-process communication.","SL 1–4"],["SR 1.3 (e)","If shared accounts are accepted through risk analysis, document the compensating controls.","SL 1–4"]],"evidence":["Account management procedure","Current account list by type (user, role, service)","Evidence default accounts were removed or disabled"]},{"id":"SR 1.3 RE 1","title":"Unified account management","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.5.3.1","sl":[3,4],"types":["Preventive"],"notes":"Accounts must be managed centrally and consistently across all components of the system.","threats":{"T02":4,"T07":2,"T11":3,"T12":4},"specs":[["SR 1.3 RE 1 (a)","Use a unified account management solution (for example a directory service) across control system components.","SL 3–4"],["SR 1.3 RE 1 (b)","Apply the same account policies and changes consistently to every component.","SL 3–4"]],"evidence":["Central directory / account management configuration covering all components"]},{"id":"SR 1.4","title":"Identifier management","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.6","sl":[1,2,3,4],"types":["Preventive"],"notes":"Identifiers must be managed by user, group, role or system interface.","threats":{"T02":4,"T07":2,"T11":3,"T12":4},"specs":[["SR 1.4 (a)","Maintain identifiers for users, groups, roles and interfaces according to local policy.","SL 1–4"],["SR 1.4 (b)","Keep identifiers separate from the permissions assigned to them (see SR 2.1).","SL 1–4"],["SR 1.4 (c)","Apply identifier management where it is needed (for example wireless devices) and make sure it does not hamper emergency operator actions.","SL 1–4"]],"evidence":["Identifier naming and management procedure","Identifier register for users, groups, roles and interfaces"]},{"id":"SR 1.5","title":"Authenticator management","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.7","sl":[1,2,3,4],"types":["Preventive"],"notes":"Authenticators (passwords, keys, tokens, certificates and similar) must be managed securely throughout their lifecycle.","threats":{"T02":4,"T07":2,"T11":3,"T12":4},"specs":[["SR 1.5 (a)","Set initial authenticator content securely when accounts are created.","SL 1–4"],["SR 1.5 (b)","Change all default passwords and credentials when the system is installed.","SL 1–4"],["SR 1.5 (c)","Support changing and refreshing all authenticators, including periodic changes.","SL 1–4"],["SR 1.5 (d)","Protect stored and transmitted authenticators from disclosure and modification (for example hashing and encryption).","SL 1–4"],["SR 1.5 (e)","Require users to keep authenticators private and to report lost or compromised ones straight away.","SL 1–4"]],"evidence":["Evidence default passwords were changed at installation","Authenticator management procedure (issue, change, revoke)","Configuration showing credentials are stored hashed or encrypted"]},{"id":"SR 1.5 RE 1","title":"Hardware security for software process identity credentials","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.7.3.1","sl":[3,4],"types":["Preventive"],"notes":"Credentials used by software processes and devices must be protected by hardware security.","threats":{"T02":3,"T09":2,"T12":4},"specs":[["SR 1.5 RE 1 (a)","Store device and process keys or credentials in hardware-protected storage such as a TPM, HSM or secure element.","SL 3–4"]],"evidence":["Hardware security configuration (TPM, HSM, secure element) for device credentials"]},{"id":"SR 1.6","title":"Wireless access management","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.8","sl":[1,2,3,4],"types":["Preventive"],"notes":"Every user, process or device communicating over wireless must be identified and authenticated.","threats":{"T02":3,"T11":4,"T14":2},"specs":[["SR 1.6 (a)","Authenticate all participants in wireless communication (for example Wi-Fi, Bluetooth, radio, cellular and mobile hotspots).","SL 1–4"],["SR 1.6 (b)","Treat wireless links as higher risk than wired links and reflect this in the risk assessment and settings.","SL 1–4"],["SR 1.6 (c)","Block unauthenticated wireless connections to the system.","SL 1–4"]],"evidence":["Wireless authentication configuration","Wireless device and user list"]},{"id":"SR 1.6 RE 1","title":"Unique identification and authentication","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.8.3.1","sl":[2,3,4],"types":["Preventive"],"notes":"Each wireless participant must be uniquely identified and authenticated.","threats":{"T02":3,"T11":4,"T14":2},"specs":[["SR 1.6 RE 1 (a)","Assign unique identities and credentials to every wireless user, process and device; avoid shared wireless keys.","SL 2–4"]],"evidence":["Evidence of per-device / per-user wireless credentials (no shared keys)"]},{"id":"SR 1.7","title":"Strength of password-based authentication","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.9","sl":[1,2,3,4],"types":["Preventive"],"notes":"Where passwords are used, the system must enforce configurable password strength.","threats":{"T02":3,"T06":2,"T07":2,"T12":4},"specs":[["SR 1.7 (a)","Enforce a configurable minimum password length.","SL 1–4"],["SR 1.7 (b)","Require a mix of character types.","SL 1–4"],["SR 1.7 (c)","Protect stored password representations against cracking (for example salted hashing).","SL 1–4"],["SR 1.7 (d)","Consider password expiry notification and minimum lifetime to stop immediate reuse.","SL 1–4"]],"evidence":["Password policy configuration export (length, complexity)"]},{"id":"SR 1.7 RE 1","title":"Password generation and lifetime restrictions for human users","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.9.3.1","sl":[3,4],"types":["Preventive"],"notes":"Human users must not reuse recent passwords, and password lifetimes must be enforced dentification and authentication control (IAC)","clause":"5.11","sl":[2,3,4],"types":["Preventive"],"notes":"Where public key authentication is used, certificates and keys must be properly validated.","threats":{"T02":3,"T03":3,"T04":2,"T09":3,"T11":3},"specs":[["SR 1.9 (a)","Validate certificate signatures.","SL 2–4"],["SR 1.9 (b)","Validate the certification path to a trusted CA, or deploy self-signed leaf certificates to all communicating hosts.","SL 2–4"],["SR 1.9 (c)","Check certificate revocation status.","SL 2–4"],["SR 1.9 (d)","Confirm the user or device controls the matching private key.","SL 2–4"],["SR 1.9 (e)","Map the authenticated identity to a known user, process or device.","SL 2–4"]],"evidence":["Certificate validation configuration (path, revocation checking)","Test results showing invalid or revoked certificates are rejected"]},{"id":"SR 1.9 RE 1","title":"Hardware security for public key authentication","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.11.3.1","sl":[3,4],"types":["Preventive"],"notes":"Private keys used for public key authentication must be protected by hardware.","threats":{"T02":3,"T03":3,"T04":2,"T09":3,"T11":3},"specs":[["SR 1.9 RE 1 (a)","Store private keys in hardware-backed protection (HSM, TPM, smart card) in line with industry practice.","SL 3–4"]],"evidence":["Hardware key protection configuration (HSM, TPM, smart card)"]},{"id":"SR 1.10","title":"Authenticator feedback","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.12","sl":[1,2,3,4],"types":["Preventive"],"notes":"Authentication information must not be revealed on screen or in feedback during log-on.","threats":{"T06":1,"T12":2},"specs":[["SR 1.10 (a)","Mask passwords and other secrets as they are entered.","SL 1–4"],["SR 1.10 (b)","Show generic failure messages that do not reveal whether the user name or the password was wrong.","SL 1–4"]],"evidence":["Screenshot of log-on screen showing masked input and generic error messages"]},{"id":"SR 1.11","title":"Unsuccessful login attempts","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.13","sl":[1,2,3,4],"types":["Preventive","Detective"],"notes":"Repeated failed log-on attempts must be limited.","threats":{"T02":3,"T06":1,"T12":4},"specs":[["SR 1.11 (a)","Limit consecutive invalid log-on attempts within a configurable period for all users.","SL 1–4"],["SR 1.11 (b)","When the limit is exceeded, lock access for a set time or until an administrator unlocks it.","SL 1–4"],["SR 1.11 (c)","Block interactive log-on for system accounts that run critical services.","SL 1–4"],["SR 1.11 (d)","Avoid automatic lockout on operator stations where immediate emergency response is required; use compensating controls instead.","SL 1–4"]],"evidence":["Account lockout configuration","Configuration blocking interactive log-on for system accounts","Rationale for any operator stations excluded from lockout"]},{"id":"SR 1.12","title":"System use notification","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.14","sl":[1,2,3,4],"types":["Preventive"],"notes":"A configurable system use notice must be shown before log-on.","threats":{"T02":1,"T06":1},"specs":[["SR 1.12 (a)","Display a warning banner before authentication, configurable by authorised staff.","SL 1–4"],["SR 1.12 (b)","State that the system is restricted, that use may be monitored and recorded, that unauthorised use is prohibited, and that use means consent to monitoring.","SL 1–4"]],"evidence":["Screenshot of the log-on warning banner","Approved banner text"]},{"id":"SR 1.13","title":"Access via untrusted networks","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.15","sl":[1,2,3,4],"types":["Preventive"],"notes":"All access to the system from untrusted networks must be monitored and controlled.","threats":{"T02":4,"T07":2,"T11":4,"T12":3},"specs":[["SR 1.13 (a)","Identify every access path from untrusted networks (remote access, VPN, wireless, corporate network, dial-up).","SL 1–4"],["SR 1.13 (b)","Allow such access only when necessary, authenticated and protected (for example through a VPN or jump host).","SL 1–4"],["SR 1.13 (c)","Monitor and log remote connections, and consider MFA for remote users.","SL 1–4"]],"evidence":["Inventory of access paths from untrusted networks","Remote access architecture and configuration","Remote access monitoring logs"]},{"id":"SR 1.13 RE 1","title":"Explicit access request approval","fr":"FR 1 – Identification and authentication control (IAC)","clause":"5.15.3.1","sl":[2,3,4],"types":["Preventive"],"notes":"Access from untrusted networks must be explicitly approved by an assigned role before it is granted.","threats":{"T02":4,"T07":2,"T11":4,"T12":3},"specs":[["SR 1.13 RE 1 (a)","Deny remote access requests by default until an authorised role approves them (for example per-session approval for vendor access).","SL 2–4"]],"evidence":["Remote access approval workflow and sample approval records"]},{"id":"SR 2.1","title":"Authorization enforcement","fr":"FR 2 – Use control (UC)","clause":"6.3","sl":[1,2,3,4],"types":["Preventive"],"notes":"After log-on, the system must enforce the permissions assigned to each person on every interface.","threats":{"T02":4,"T03":4,"T04":3,"T12":2},"specs":[["SR 2.1 (a)","Check every requested action against the user's assigned permissions, roles or rules before allowing it.","SL 1–4"],["SR 2.1 (b)","Apply least privilege and segregation of duties.","SL 1–4"],["SR 2.1 (c)","Use access control mechanisms such as role-based access, access control lists or matrices.","SL 1–4"],["SR 2.1 (d)","Plan emergency use so essential actions remain available where needed.","SL 1–4"]],"evidence":["Role and permission matrix","Access control configuration on each interface","Segregation of duties analysis"]},{"id":"SR 2.1 RE 1","title":"Authorization enforcement for all users","fr":"FR 2 – Use control (UC)","clause":"6.3.3.1","sl":[2,3 /* ================= Control assessment by assurance questions =================
   The owner answers one question for a group of controls (control-level mapping, edited in /onetrust/tra/admin/).
