let AQ=[{"id":"Q01","topic":"Governance, ownership and risk management","question":"How is cybersecurity risk for this asset identified, assessed, owned and reviewed?","required":"In your answer, describe\n• The accountable system owner and risk owner\n• The system boundary, dependencies and the BIL used\n• The most recent risk assessment or TRA for this system and when it was approved\n• How compliance with MTM standards and external obligations (privacy, rail safety, contracts) is tracked\n• How exceptions and security debt are approved, time-limited and reviewed\n• How often the assessment is reviewed and what triggers a review\n\nTo demonstrate it\n• Show the approved TRA or risk assessment for this system and its approval date\n• Show the risk register entries for this system with owners and treatment decisions\n• Show each approved exception with its owner, expiry date and compensating controls","evidence":"• Current risk assessment or TRA for the system, with approval date\n• Risk register entries for the system with owners and treatment\n• Compliance obligations register or mapping for the system\n• Approved exceptions with expiry dates and compensating controls\n• Roles and responsibilities (RACI) naming the system and risk owners\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:RM.1","MTM:RM.2","MTM:RM.3"]},{"id":"Q02","topic":"Acceptable use, awareness and user notices","question":"How are users informed of security responsibilities and how is approved use enforced?","required":"In your answer, describe\n• How users acknowledge the acceptable use standard\n• Security awareness training completion for users of this system\n• The system-use notice or login banner shown on each interface\n• Restrictions on personal use, internet, email, social media and messaging (for OT: on control workstations)\n• How MTM's monitoring rights are communicated\n\nTo demonstrate it\n• Show acknowledgement and training records for the users of this system, not just an organisation-wide rate\n• Show the login banner on each interface, for example a screenshot per interface\n• For OT, show the configuration that blocks email, web and chat on control workstations","evidence":"• Acceptable use acknowledgement records for users of the system\n• Security awareness training completion report\n• Screenshot of the login banner or system-use notice on each interface\n• Configuration showing email, web and chat are blocked on control workstations (OT)\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:AP.1","MTM:AP.2","MTM:AP.3","MTM:AP.4","IEC:SR 1.12","IEC:SR 5.3","IEC:SR 5.3 RE 1"]},{"id":"Q03","topic":"User identity and account lifecycle","question":"How are user accounts approved, uniquely identified, reviewed and removed?","required":"In your answer, describe\n• Joiner, mover and leaver process and who approves access\n• Whether every user has a unique account, and how any shared accounts are justified and controlled\n• How often access is reviewed and by whom\n• How temporary and contractor accounts expire\n• How emergency (break-glass) accounts are protected and their use reviewed\n• Whether accounts are managed centrally (directory) or locally\n\nTo demonstrate it\n• Show the current account list, with each account linked to a named person or owner\n• Show a recent sample of access approvals and leaver removals, with dates\n• Show the latest access review was completed and signed off\n• If some accounts are local rather than in the central directory, show how those are managed","evidence":"• Current user account list with named owners\n• Sample of access requests and approvals\n• Most recent access review, signed off\n• Sample of leaver removals with dates\n• Break-glass procedure and log of its use\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:IA.1","MTM:IA.4","MTM:IA.5","MTM:IA.6","IEC:SR 1.1","IEC:SR 1.1 RE 1","IEC:SR 1.3","IEC:SR 1.3 RE 1","IEC:SR 1.4"]},{"id":"Q04","topic":"Authentication, passwords and MFA","question":"How is required authentication strength enforced across all applicable access paths?","required":"In your answer, describe\n• Password length, complexity and lifetime settings\n• Where MFA is enforced (remote, untrusted networks, privileged, all access)\n• Lockout or delay after failed login attempts\n• Masking of credentials during entry\n• How passwords and other authenticators are stored and protected\n• How default passwords are changed on installation\n\nTo demonstrate it\n• Show the actual password, lockout and MFA settings (configuration export or screenshot), not the policy alone\n• Show MFA covers every access path it should: remote, privileged and, where required, all users\n• Show default passwords were changed, for example the commissioning checklist\n• Describe how passwords are stored (hashing, vault) without including any password","evidence":"• Password and lockout policy configuration export\n• MFA enrolment and coverage report\n• Screenshot of a login screen showing masked input\n• Evidence that default credentials were changed (commissioning checklist)\n• Description of how authenticators are stored (hashing, vault)\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:IA.7","MTM:IA.8","IEC:SR 1.1 RE 2","IEC:SR 1.1 RE 3","IEC:SR 1.5","IEC:SR 1.7","IEC:SR 1.7 RE 1","IEC:SR 1.7 RE 2","IEC:SR 1.10","IEC:SR 1.11"]},{"id":"Q05","topic":"Privileged, service and device identities","question":"How are privileged accounts, service accounts and device identities controlled and protected?","required":"In your answer, describe\n• Inventory of privileged and service accounts and their owners\n• Use of privileged access management (vaulting, session recording)\n• Whether service accounts are prevented from interactive login\n• How credentials are rotated\n• How software processes and devices authenticate to each other\n• Whether credentials are protected by hardware (TPM, HSM) where required\n\nTo demonstrate it\n• Show the privileged and service account register with an owner and justification for each account\n• Show the vault or PAM settings and when credentials were last rotated\n• Show how devices and processes authenticate (certificates or keys), and hardware protection where SL-T 3 or higher requires it","evidence":"• Privileged and service account register with owners and justification\n• PAM configuration and a sample session recording\n• Credential rotation records\n• Device authentication configuration (certificates or keys)\n• Evidence of hardware-protected credentials where SL-T 3+\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:IA.2","MTM:IA.3","IEC:SR 1.2","IEC:SR 1.2 RE 1","IEC:SR 1.5 RE 1"]},{"id":"Q06","topic":"Authorisation and session protection","question":"How are permitted actions restricted and authenticated sessions protected?","required":"In your answer, describe\n• How permissions are mapped to roles and least privilege applied\n• Segregation of duties and dual approval for critical or safety-related actions\n• Supervisor override arrangements\n• Session lock and idle timeout\n• Termination of remote sessions and limits on concurrent sessions\n• Protection of session identifiers (unique, random, invalidated at logout)\n\nTo demonstrate it\n• Show the role and permission matrix and a sample of users mapped to roles\n• Show the session lock and timeout settings for each interface\n• Show a record of dual approval for a critical or safety-related change","evidence":"• Role and permission matrix\n• Sample of user-to-role assignments\n• Session lock and timeout configuration\n• Dual-approval workflow records for critical changes\n• Application session security configuration or test results\nEquivalent evidence is fine if it shows the same thing.","controls":["IEC:SR 2.1","IEC:SR 2.1 RE 1","IEC:SR 2.1 RE 2","IEC:SR 2.1 RE 3","IEC:SR 2.1 RE 4","IEC:SR 2.5","IEC:SR 2.6","IEC:SR 2.7","IEC:SR 3.8","IEC:SR 3.8 RE 1","IEC:SR 3.8 RE 2","IEC:SR 3.8 RE 3"]},{"id":"Q07","topic":"Remote and supplier access","question":"How is remote access authorised, restricted, monitored and terminated?","required":"In your answer, describe\n• Remote access methods and the controlled entry point (VPN, jump host)\n• How each remote session is requested and approved\n• MFA for remote access\n• Time limits on vendor access\n• How sessions are logged or recorded\n• Which third parties have remote access\n\nTo demonstrate it\n• Show the architecture with the single controlled entry point (VPN or jump host)\n• Show a sample of remote access requests with their approval and time limit\n• Show session logs or recordings, and the register of third parties with remote access","evidence":"• Remote access architecture diagram\n• Sample of remote access requests and approvals\n• Jump host configuration and session logs or recordings\n• Register of third parties with remote access\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:NS.5","IEC:SR 1.13","IEC:SR 1.13 RE 1"]},{"id":"Q08","topic":"Network architecture, segmentation and wireless","question":"How is the network separated and protected against unauthorised connections and traffic, including wireless where present?","required":"In your answer, describe\n• Zones and conduits, or network segments, and what sits in each\n• Firewall rules and whether they deny by default\n• Separation from corporate and other non-control networks\n• Physical separation where required\n• Behaviour when a boundary fails (fail closed, island mode)\n• How network device configuration is managed and reviewed\n• Which wireless networks are used and why, how wireless users and devices are authenticated, and how wireless is separated from control and sensitive networks\n• Detection of rogue access points and unauthorised devices\n\nTo demonstrate it\n• Show the network or zone-and-conduit diagram and the firewall rules with their last review date\n• Show segmentation test results proving traffic is blocked where it should be\n• If no wireless is used, say so. Otherwise show the wireless authentication settings and recent rogue access point scans","evidence":"• Wireless network inventory and architecture\n• Wireless authentication configuration (for example enterprise 802.1X)\n• Rogue access point scan reports\n• Network or zone-and-conduit diagram\n• Firewall rule sets with last review date\n• Segmentation test results\n• Network device configuration baseline\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:NS.1","MTM:NS.2","MTM:NS.3","MTM:NS.6","IEC:SR 1.6","IEC:SR 1.6 RE 1","IEC:SR 2.2","IEC:SR 2.2 RE 1","IEC:SR 5.1","IEC:SR 5.1 RE 1","IEC:SR 5.1 RE 2","IEC:SR 5.1 RE 3","IEC:SR 5.2","IEC:SR 5.2 RE 1","IEC:SR 5.2 RE 2","IEC:SR 5.2 RE 3"]},{"id":"Q09","topic":"Mobile devices and removable media","question":"How are portable devices and removable media approved, secured, tracked and disposed of?","required":"In your answer, describe\n• Mobile device management enrolment and security baseline\n• BYOD conditions and approvals\n• USB and removable media policy, blocking and scanning\n• Checks of device security status before connection\n• How removable media is approved, registered, transported, encrypted when it holds sensitive data, sanitised and disposed of\n\nTo demonstrate it\n• Show the MDM compliance report for devices that connect to this system\n• Show the removable media blocking configuration and the scanning station logs\n• Show the removable media register and sanitisation or disposal records","evidence":"• MDM compliance report\n• BYOD agreements\n• Removable media control configuration\n• Media scanning station logs\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:RM.1","MTM:RM.2","MTM:MB.1","MTM:MB.2","IEC:SR 2.3","IEC:SR 2.3 RE 1"]},{"id":"Q10","topic":"Encryption, keys and data protection","question":"How is information protected in transmission, storage and release of storage resources?","required":"In your answer, describe\n• Encryption of data in transit and the protocols used\n• Encryption of data at rest\n• Approved algorithms and key lengths\n• Key lifecycle: generation, storage, rotation, revocation\n• Certificate management and trust\n• Integrity protection of communications\n• Purging of data from storage and memory when released\n• Protection of data crossing zone boundaries\n\nTo demonstrate it\n• Mark the encryption used on each flow in the data flow diagram\n• Show TLS or cipher scan results and the storage encryption settings\n• Show the key and certificate inventory with owners and expiry dates, without any key material","evidence":"• Data flow diagram marking encryption on each flow\n• TLS or cipher configuration scan\n• Storage encryption configuration\n• Key management procedure and key inventory\n• Certificate inventory with expiry dates\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:ES.1","MTM:ES.2","MTM:ES.3","MTM:ES.4","IEC:SR 1.8","IEC:SR 1.9","IEC:SR 1.9 RE 1","IEC:SR 3.1","IEC:SR 3.1 RE 1","IEC:SR 4.1","IEC:SR 4.1 RE 1","IEC:SR 4.1 RE 2","IEC:SR 4.2","IEC:SR 4.2 RE 1","IEC:SR 4.3"]},{"id":"Q11","topic":"Malware, email and untrusted code","question":"How is malicious or unauthorised code prevented, detected and handled?","required":"In your answer, describe\n• Anti-malware or application allow-listing coverage\n• How often protection is updated\n• Scanning at entry and exit points (email, web, file transfer, removable media)\n• Central management and reporting\n• Email filtering\n• Controls on mobile code: scripts, macros, browser code\n\nTo demonstrate it\n• Show endpoint protection coverage for every host, with update status. Where anti-malware cannot run, show the allow-listing policy\n• Show scanning at the entry points: email, web, file transfer and removable media\n• Show the macro and script execution policy","evidence":"• Endpoint protection coverage report for all hosts\n• Update and signature status report\n• Application allow-listing policy where anti-malware cannot run\n• Email security configuration\n• Macro and script execution policy\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:AM.1","MTM:SO.4","IEC:SR 2.4","IEC:SR 2.4 RE 1","IEC:SR 3.2","IEC:SR 3.2 RE 1","IEC:SR 3.2 RE 2"]},{"id":"Q12","topic":"Secure configuration and hardening","question":"How is the asset securely configured and protected against unauthorised configuration changes?","required":"In your answer, describe\n• Hardening baselines used and compliance against them\n• Unnecessary services, ports and features disabled\n• Configuration change control\n• Restrictions on installing software\n• Cloud, virtualisation and container security settings\n• Integrity checking of software and configuration\n• Reporting of current security settings\n\nTo demonstrate it\n• Show the hardening baseline and a recent compliance scan against it\n• Compare the enabled services and ports with what the system needs\n• Show a sample of approved change records and the integrity monitoring settings\n• If cloud hosted, show the cloud security posture report","evidence":"• Hardening baseline and compliance scan results\n• Enabled services and ports compared with required functions\n• Sample of approved change records\n• Integrity monitoring configuration\n• Cloud security posture report (if cloud hosted)\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:SO.1","MTM:SO.2","MTM:SO.3","IEC:SR 3.4","IEC:SR 3.4 RE 1","IEC:SR 7.6","IEC:SR 7.6 RE 1","IEC:SR 7.7"]},{"id":"Q13","topic":"Asset inventory, vulnerabilities and remediation","question":"How are components inventoried, vulnerabilities identified and remediation tracked?","required":"In your answer, describe\n• Component inventory with versions and support status\n• Vulnerability scanning frequency and coverage\n• Risk-based prioritisation\n• Patch timeframes and performance against them\n• End-of-life components and their compensating controls\n• How vulnerabilities in unpatchable OT components are handled\n\nTo demonstrate it\n• Show the component inventory with versions and vendor support status\n• Show the latest vulnerability scan and patch compliance against MTM timeframes\n• For end-of-life or unpatchable components, show the approved exception and compensating controls","evidence":"• Component inventory with versions and vendor support status\n• Latest vulnerability scan report\n• Patch compliance report against MTM timeframes\n• End-of-life register with exceptions and compensating controls\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:VM.1","MTM:VM.2","MTM:VM.4","MTM:VM.5","IEC:SR 7.8"]},{"id":"Q14","topic":"Secure development and application security","question":"How are secure development and application security controls implemented?","required":"In your answer, describe\n• Secure development governance and standards\n• Separation of development, test and production\n• Code review and security testing\n• Input validation and error handling\n• Predictable behaviour when failures occur\n• Separation of application functions\n• Database security\n• API authentication, authorisation and rate limiting\n\nTo demonstrate it\n• For systems built or customised for MTM, show the secure development standard, separated environments and code review or static analysis results\n• For purchased applications, show the security settings MTM controls (access, API and database configuration)\n• Show API authentication, authorisation and rate-limit settings, and database hardening","evidence":"• Secure development standard used for the system\n• Evidence of separated environments\n• Code review or static analysis results\n• API security configuration\n• Database access and hardening configuration\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:AS.1","MTM:AS.2","MTM:AS.3","MTM:AS.5","MTM:AS.6","IEC:SR 3.5","IEC:SR 3.6","IEC:SR 3.7","IEC:SR 5.4"]},{"id":"Q15","topic":"Security testing and verification","question":"How are security functions and vulnerabilities tested and findings resolved?","required":"In your answer, describe\n• Penetration testing scope and frequency\n• Security testing in development and before release\n• Verification that security functions work (logging, alerting, malware protection, failover)\n• Automated verification\n• Tracking of findings to closure\n\nTo demonstrate it\n• Show the latest penetration test, its scope and date, and the tracker of findings to closure. Purchased systems are included\n• Show records of tests proving security functions work, for example logging, alerting and failover\n• Where code is developed, show application security testing results","evidence":"• Latest penetration test report and remediation tracker\n• Application security testing results (for example SAST or DAST)\n• Records of security function tests\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:AS.4","MTM:VM.3","IEC:SR 3.3","IEC:SR 3.3 RE 1","IEC:SR 3.3 RE 2"]},{"id":"Q16","topic":"Logging and audit trails","question":"How are required events recorded, retained, protected and available for investigation?","required":"In your answer, describe\n• Events logged (access, changes, errors, security events)\n• Central collection of logs\n• Storage capacity and warnings\n• What happens if logging fails\n• Time source and synchronisation\n• Protection of logs from change or deletion\n• Non-repudiation of user actions\n• Access to logs for investigation\n\nTo demonstrate it\n• Show the list of events logged and proof they reach the SIEM\n• Show the retention, time synchronisation and log access settings\n• Show the alert raised when logging fails or storage fills","evidence":"• Logging configuration and list of events logged\n• Evidence of log forwarding to the SIEM\n• Log retention settings\n• Time synchronisation configuration\n• Log access controls\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:AU.1","MTM:AU.2","IEC:SR 2.8","IEC:SR 2.8 RE 1","IEC:SR 2.9","IEC:SR 2.9 RE 1","IEC:SR 2.10","IEC:SR 2.11","IEC:SR 2.11 RE 1","IEC:SR 2.11 RE 2","IEC:SR 2.12","IEC:SR 2.12 RE 1","IEC:SR 3.9","IEC:SR 3.9 RE 1","IEC:SR 6.1","IEC:SR 6.1 RE 1"]},{"id":"Q17","topic":"Monitoring and incident response","question":"How are security events affecting this asset detected, investigated and escalated?","required":"In your answer, describe\n• Monitoring use cases that cover this system\n• Continuous monitoring arrangements\n• Alert triage and escalation\n• Incident response plan, including OT where relevant\n• Exercises and lessons learnt\n\nTo demonstrate it\n• Show the SIEM use cases that cover this system\n• Show a sample alert and the incident ticket it raised\n• Show the incident response plan or playbook and the latest exercise record","evidence":"• SIEM use cases covering the system\n• Sample alert and its incident ticket\n• Incident response plan or playbook\n• Most recent exercise record\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:AU.3","IEC:SR 6.2"]},{"id":"Q18","topic":"Backup and recovery","question":"How are backups protected, verified and used to recover this asset?","required":"In your answer, describe\n• Backup scope and frequency\n• Offline or immutable copies and how backups are protected\n• Backup verification and automation\n• Recovery procedures and the RTO and RPO\n• Restore and disaster recovery tests, with results and gaps\n\nTo demonstrate it\n• Show backup job records and the protection settings (offline or immutable copies)\n• Show the latest restore test and whether it met the RTO and RPO\n• Show the recovery plan and the latest disaster recovery exercise","evidence":"• Backup configuration and job records\n• Backup protection settings\n• Backup verification records\n• Restore test results\n• Recovery plan and latest exercise\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:SO.5","IEC:SR 7.3","IEC:SR 7.3 RE 1","IEC:SR 7.3 RE 2","IEC:SR 7.4"]},{"id":"Q19","topic":"Availability, resilience and DoS protection","question":"How are essential functions protected against failure, resource exhaustion and denial of service?","required":"In your answer, describe\n• Essential functions and their availability requirements\n• Redundancy and failover\n• Emergency power\n• How the system operates in a degraded state\n• DoS protection and load management\n• Capacity alerts and how DoS effects are contained\n\nTo demonstrate it\n• Show the availability design and the latest failover test result\n• Show UPS or generator test records where applicable\n• Show the DoS protection, rate-limit and capacity alert settings","evidence":"• Availability design\n• Redundancy and failover test results\n• UPS or generator test records\n• DoS and rate-limit configuration\n• Capacity reports\n• Safe load-test results\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:NS.4","IEC:SR 7.1","IEC:SR 7.1 RE 1","IEC:SR 7.1 RE 2","IEC:SR 7.2","IEC:SR 7.5"]},{"id":"Q20","topic":"Third-party and supply-chain assurance","question":"How are supplier obligations, assurance and ongoing security risks managed?","required":"In your answer, describe\n• Supplier security assessment and its date\n• Security clauses in contracts (breach notification, right to audit, data handling, return or destruction)\n• Contract deadlines, including breach notification timeframes such as one hour where required\n• Ongoing supplier monitoring\n• Integrity of supplied software and updates\n• Service termination, data return and destruction\n\nTo demonstrate it\n• Show the latest supplier security assessment and its date\n• Show the contract security clauses, with the exact deadlines\n• Show supplier certifications or assurance reports and confirm their scope covers this service","evidence":"• Third-party security assessment\n• Extract of contract security clauses\n• Supplier certifications or assurance reports with scope\n• Vendor access register\nEquivalent evidence is fine if it shows the same thing.","controls":["MTM:TS.1","MTM:TS.2"]}],AQ_SOURCE='built-in';
const AQ_RANK={'Not implemented':0,'Partially implemented':1,'Implemented':2,'Not applicable':3};
/* Assessments answered per control before the questions existed keep that format */
function aqOn(t){const s=t&&t.s5;if(!s||s.aq===1)return true;return !Object.keys(s.resp||{}).length&&!Object.keys(s.review||{}).length;}
function aqPlan(t){const keys=traSel(t).rows.map(r=>r.key);const qs=AQ.map(q=>({q,keys:keys.filter(k=>q.controls.includes(k))})).filter(x=>x.keys.length);const cov={};qs.forEach(x=>x.keys.forEach(k=>(cov[k]||(cov[k]=[])).push(x.q.id)));return {qs,cov,other:keys.filter(k=>!cov[k]),keys};}
function aqCtl(s5,k,qids){const ov=(s5.ov||{})[k];let r='';qids.map(id=>((s5.q||{})[id]||{}).r).filter(Boolean).forEach(x=>{if(!r||AQ_RANK[x]<AQ_RANK[r])r=x;});return {base:r,r,ov:false};} /* per-control overrides were removed: every covered control takes the weaker of its questions' answers */
function s5Sync(t){const s5=t&&t.s5;if(!s5||!aqOn(t))return;s5.aq=1;s5.q=s5.q||{};s5.qrev=s5.qrev||{};s5.ov=s5.ov||{};s5.resp=s5.resp||{};s5.review=s5.review||{};const p=aqPlan(t);
 Object.entries(p.cov).forEach(([k,qids])=>{const x=aqCtl(s5,k,qids),qa=qids.map(id=>s5.q[id]||{}),ov=s5.ov[k]||{},via=qids.join(', ');
  const uj=a=>[...new Set(a.filter(Boolean))].join(' | ');if(x.r)s5.resp[k]={r:x.r,ev:uj(qa.flatMap(a=>[...aqFiles(a).map(f=>f.name),...aqLinks(a),a.ev])),notes:x.ov&&ov.n?ov.n:uj(qa.map(a=>a.impl)),via};else delete s5.resp[k];
  const ds=qids.map(id=>s5.qrev[id]).filter(d=>d&&d.d),ret=ds.filter(d=>d.d==='Returned');
  if(ret.length)s5.review[k]={d:'Returned',c:ret.map(d=>d.c).filter(Boolean).join(' | '),by:ret[0].by,date:ret[0].date,via};
  else if(ds.length===qids.length)s5.review[k]={d:'Accepted',c:ds.map(d=>d.c).filter(Boolean).join(' | '),by:ds[0].by,date:ds[0].date,via};
  else delete s5.review[k];});}
const rPill=r=>r?pill(r==='Implemented'?'green':r==='Not applicable'?'gray':r==='Not implemented'?'red':'amber',r):pill('gray','Not answered');
/* "What is required?" and evidence text: lines starting with • become a list; short lines without end punctuation become headings */
function aqTextHtml(txt){let out='',ul=false;const close=()=>{if(ul){out+='</ul>';ul=false;}};String(txt||'').split('\n').forEach(l=>{const x=l.trim();if(!x)return close();if(/^[•·\-*]\s*/.test(x)){if(!ul){out+='<ul>';ul=true;}out+='<li>'+e(x.replace(/^[•·\-*]\s*/,''))+'</li>';return;}close();out+=x.length<70&&!/[.:;,]$/.test(x)?'<h4>'+e(x)+'</h4>':'<p>'+e(x)+'</p>';});close();return out;}
