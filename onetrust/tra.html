,"url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10979","refLabel":"Section 6. The Standard - Security Verification and testing","specs":[["AS.4.01","All new application, including any major changes made on an application, must be tested, and verified against MTM security standards and controls. (NIST/MTM)","Baseline",["Application"],["T03","T08"]],["AS.4.02","All new application, including any major changes made on an application, should be tested for vulnerabilities before being deployed.","Baseline",["Application"],["T08"]],["AS.4.03","All application security should be tested and validated by manual code review or by static application security testing (SAST). (ISO, NIST, IEC, ISM)","Recommended",["Application"],["T08"]],["AS.4.04","Peer review is performed throughout the software development life cycle. (NIST, ISM)","Recommended",["Application"],["T08"]],["AS.4.05","Application security can be tested and validated by performing threat and vulnerability analysis, sandboxing, application penetration testing and dynamic application security testing (DAST). (ISO, NIST, IEC, ISM)","Recommended",["Application"],["T08"]]],"evidence":["Pre-release security test report (penetration test, DAST or SAST)","Remediation records for findings from testing","Release approval showing security sign-off"]},{"id":"AS.5","title":"Application databases shall have assigned ownership and be protected through access controls, encryption where required, and least privilege access.","std":"Application and Development Security Standard","section":"Application Database Security","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10979","refLabel":"Section 6. The Standard - Application Database Security","specs":[["AS.5.01","All databases must have identified owners assigned to them, ensuring clear accountability for the data stored within. (ISO, NIST, MTM)","Baseline",["Application","Database"],["T02","T03","T04","T05","T08","T11"]],["AS.5.02","File-based access controls are applied to database files. (ISM, IEC)","Baseline",["Application","Database"],["T02","T03","T04","T05","T08","T11"]],["AS.5.03","MTM must implement database encryption for data classified as Confidential (official-sensitive) or restricted (protected).","Baseline",["Application","Database"],["T02","T03","T04","T05","T08","T11"]],["AS.5.04","Database servers must be placed on a different network segment to user workstations. (ISM)","Recommended",["Application","Database"],["T02","T03","T04","T05","T08","T11"]],["AS.5.05","The need-to-know principle is enforced for database contents through restricting minimum privileges, utilizing database views, and implementing database roles. (ISM, IEC)","Recommended",["Application","Database"],["T02","T03","T04","T05","T08","T11"]],["AS.5.06","Parameterised queries or stored procedures are used for database interaction instead of dynamically generated queries. (ISM, IEC)","Recommended",["Application","Database"],["T02","T03","T04","T05","T08","T11"]]],"evidence":["Database ownership record","Database access list and privileged account review","Encryption configuration for sensitive data (where required)"]},{"id":"AS.6","title":"APIs shall have assigned ownership and be securely hardened, authenticated, authorised, and protected against unauthorised access and misuse.","std":"Application and Development Security Standard","section":"API Security","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10979","refLabel":"Section 6. The Standard - API Security","specs":[["AS.6.01","All public facing Application Programming Interface (API) must implement authentication and authorization mechanism. This should comply with MTM Identity and Access Management Standard (A10102). API Key should only be used for API client authentication and authorization mechanism. Check if the logged-in user has access to perform requested actions. (OWASP)","Baseline",["Application"],["T02","T08"]],["AS.6.02","All public facing APIs must be protected from Server-Side request forgery using following methods: (OWASP) a) Use allow list for remote origins. b) URL schemes, ports, and media types. c) Disable HTTP redirections. d) Utilize a reliable URL parser to prevent parsing inconsistencies. e) Validate and sanitize all client input data and avoid sending raw responses to clients.","Baseline",["Application"],["T08"]],["AS.6.03","All API must have a designated owner, ensuring clear accountability and responsibility for the security of the API (OWASP, MTM)","Baseline",["Application"],["T08"]],["AS.6.04","All API must ensure restrictive resource consumption to avoid resource starvation. Following controls must be implemented: (OWASP) a) Limit resource utilization (e.g., memory, Number of restarts, processes, and spending) based on the requirement. b) Enforce maximum data sizes for inputs and payload. c) Implement rate limiting and frequency limits.","Recommended",["Application"],["T08"]],["AS.6.05","Restrict and limit the access to sensitive API. (OWASP)","Recommended",["Application"],["T08"]],["AS.6.06","All API must be securely hardened. (OWASP)","Recommended",["Application"],["T08"]],["AS.6.07","Always validate data received and transmitted to third party APIs before using it (OWASP)","Recommended",["Application"],["T08","T09"]]],"evidence":["API inventory with named owners","API authentication and authorisation configuration","API gateway or rate-limit configuration and recent security test results"]},{"id":"RM.1","title":"Cybersecurity risks shall be identified, assessed, and managed in accordance with the MTM Integrated Risk Management Procedure (A2023), with clear ownership assigned and periodic maturity assessments conducted to ensure risks are effectively monitored and addressed.","std":"Cybersecurity Risk & Compliance Standard","section":"Risk Management","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A13023","refLabel":"Section 6. The Standard - Risk Management","specs":[["RC.1.01","Cybersecurity risk management practices must adhere to MTM's Integrated Risk Management Procedure (A2023). This ensures a structured and consistent approach to risk management. (MTM)","Baseline",["General"],["T04"]],["RC.1.02","Cybersecurity Threat Risk Assessment (TRA) must be conducted for all new applications or systems introduced into the environment and for any changes that impact data flow, data classification or system/network architecture in existing systems. (MTM)","Baseline",["General"],["T04"]],["RC.1.03","Risk identification can occur through assessments, audits, incidents, or concerns raised internally. Each identified cybersecurity risk must be assigned to a responsible risk owner. The risk owner is accountable for managing, reviewing, and addressing the risk with appropriate oversight. (MTM)","Baseline",["General"],["T10"]],["RC.1.04","MTM must conduct a Maturity Assessment every two years to review organizational cybersecurity risks. The findings will be documented in the INX system and classified as enterprise cybersecurity risks. (MTM/FA-T)","Baseline",["General"],[]],["RM.1.01","The use of removable media on MTM-owned or operated systems is prohibited. However, in circumstances where removable media is the only viable solution for information storage and sharing, an exception to use removable media must be obtained.","Baseline",["Removable Media","Desktop/End User"],["T13"]],["RM.1.02","It is required to use MTM-approved methods and solutions (e.g., MTM Secure File Transfer, Team, OneDrive, SharePoint etc.) to store and share information between systems and users.","Baseline",["Removable Media"],["T07"]],["RM.1.03","A removable media exception can only be authorised if there is a business reason, and it is approved by the user’s manager and general manager of the business.","Baseline",["Removable Media","Desktop/End User"],["T13"]],["RM.1.04","Removable media must have an identifiable owner.","Baseline",["Removable Media"],["T13"]],["RM.1.05","Only MTM-provided removable media devices can be used. Users must not use non approved removable media devices.","Baseline",["Removable Media"],["T13"]],["RM.1.06","Removal media must be scanned for malware before use.","Baseline",["Removable Media","Desktop/End User"],["T07"]],["RM.1.07","Only authorised personnel are allowed to handle removable media and ensure accountability for transport outside of controlled areas.","Baseline",["Removable Media"],["T02","T13"]],["RM.1.08","Sensitive Data (classified as confidential/official-sensitive or restricted/protected) must not be stored in removable media. If these data are required to be stored in removable media, approval is required from the information owner.","Baseline",["Removable Media"],["T04"]],["RM.1.09","Sensitive Data (classified as confidential/official-sensitive or restricted/protected) must be encrypted.","Baseline",["Removable Media"],["T04"]],["RM.1.10","Loss of removable media with any data on it must be reported to security operations.","Baseline",["Removable Media"],["T13"]],["RM.1.11","All media that is no longer in use or functional must return to Desktop Support. Media must be sanitised and disposed securely in accordance with MTM Processes","Baseline",["Removable Media"],["T01","T04"]]],"evidence":["Entry for the system in the risk register with owner","Latest risk review minutes or report","Maturity assessment results"]},{"id":"RM.2","title":"Cybersecurity risk assessments shall follow AS/NZS ISO 31000:2018 and the OVIC Information Security Risk Management Practitioner Guide, including defining the system scope, identifying threats and vulnerabilities, assessing Business Impact Level (CIA), determining risk ratings, and implementing appropriate risk treatment action.","std":"Cybersecurity Risk & Compliance Standard","section":"Risk Assessment Methodology","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A13023","refLabel":"Section 6. The Standard - Risk Assessment Methodology","specs":[["RC.2.01","Cybersecurity risk assessments will adhere to AS/NZS ISO 31000:2018 Risk Management Standard (ISO-RM) and OVIC Practitioner Guide – Information Security Risk Management version 2.0 (ISRM).","Baseline",["General"],[]],["RC.2.02","Before conducting an assessment, the System-under-Consideration (SuC) must be defined, including boundaries and associated assets. (ISO-RM/ISRM)","Baseline",["General"],[]],["RC.2.03","Consult relevant subject matter experts (SMEs) to identify potential risks and assess their organizational impact. (ISO-RM/ISRM)","Baseline",["General"],[]],["RC.2.04","Risk identification must consider vulnerabilities and threats (hazards), their potential impact on affected assets, and the duration of these impacts. (MTM, ISO RM /ISRM) Note: Duration is important when there is a loss of availability. A longer duration can increase the severity of the impact. For example, losing a Train Control System for 10 minutes, 4 hours, or 1 day will result in increasingly severe operational disruptions.","Baseline",["General"],[]],["RC.2.05","A Business Impact Level (BIL) Assessment must be conducted to identify and assess the potential business impact of a cybersecurity breach on the affected asset. The BIL Assessment will evaluate key risk drivers, including the impact on Confidentiality, Integrity, or Availability (CIA). This assessment provides critical insight into the severity of the potential consequences of a breach and helps prioritize risk mitigation efforts. (MTM/NIST/ISO)","Baseline",["General"],["T03","T04","T05"]],["RC.2.06","The MITRE ATT&CK framework is recommended for threat identification to ensure comprehensive coverage of adversarial tactics, techniques, and procedures. (MTM)","Recommended",["General"],["T08"]],["RC.2.07","As part of completing the Business Impact Level (BIL) Assessment form (A10057), a severity impact value must be assigned to quantify the potential consequences on a system in the event of a cybersecurity incident. This impact value should reflect the potential effect on the system’s Confidentiality, Integrity, and Availability (CIA). The assigned severity value will guide risk prioritization and inform subsequent mitigation strategies. (MTM)","Baseline",["General"],["T03","T04","T05"]],["RC.2.08","The likelihood of a risk materializing must be determined by evaluating the effectiveness of existing controls in accordance with MTM Cybersecurity Standards. This assessment should consider historical occurrences of similar risks and account for future factors, such as the intent, motivation, and capability of human adversaries or other threat actors. This comprehensive evaluation will support a more accurate and dynamic risk profile. (ISRM)","Baseline",["General"],[]],["RC.2.09","Risk determination and rating must follow the MTM Integrated Risk Procedure. A risk ratings matrix (found in MTM Integrated Risk Procedure) will be used to assess risks by combining the severity impact (as determined in RC.2.7) and the likelihood of occurrence (as evaluated in RC.2.8). This matrix will provide a structured approach to categorizing risks and enable the prioritization of remediation actions based on both impact and likelihood. (MTM)","Baseline",["General"],[]],["RC.2.10","All identified risks must undergo evaluation to determine those that require immediate prioritization for mitigation. Risks with the highest ratings, based on their impact and likelihood, must be addressed first to minimize risk to the organization. (ISRM)","Baseline",["General"],[]],["RC.2.11","The outcome of the risk treatment must result in one of the following actions (MTM): a) No remediation required - The assessment determines that the system can proceed without any further remediation action. b) Remediate identified risk before system use - Any identified risks must be remediated before the system is in operation. c) Risk management if risk is not mitigated - If the risk cannot be remediated prior to system use, the following steps must be taken: i. MTM risk process must be followed to manage the risk. ii. If there are any exceptions against MTM cybersecurity standards, the exceptions must be recorded in the Cyber Exception Register.","Baseline",["General"],[]],["RM.2.01","All removable media must be tracked and registered.","Baseline",["Removable Media"],["T13"]],["RM.2.02","The usage of removable media should be monitored.","Recommended",["Removable Media"],["T13"]],["RM.2.03","The following security controls should be available for removable media: (ISM/MTM) a) Write block capability, b) Encryption capability, and c) Password Protection.","Recommended",["Removable Media"],["T04","T12","T13"]],["RM.2.04","If no longer required, the contents of any removable media should be removed and unrecoverable.","Baseline",["Removable Media"],["T13"]],["RM.2.05","Processes or Procedures must be developed and implemented for media destruction and disposal.","Baseline",["Removable Media"],["T01","T04"]],["RM.2.06","MTM data must be securely removed from associated media, prior to off-site maintenance, disposal, or re-use.","Baseline",["Removable Media"],["T04"]],["RM.2.07","Authorisation is required for media that is removed from the organisation and a record of such removals must be maintained to ensure an audit trail.","Baseline",["Removable Media"],["T02","T10"]],["RM.2.08","The destruction of media must be performed under the supervision of at least one person, ensuring and endorsing that the destruction is successfully completed.","Baseline",["Removable Media"],["T10"]],["RM.2.09","All media destruction, sanitization and disposal must be approved, tracked, and documented.","Baseline",["Removable Media"],["T10"]],["RM.2.10","Prior to media disposal, labels and markings indicating the owner, sensitivity, classification, or any other marking that can associate the media with its prior use must be removed.","Baseline",["Removable Media"],["T04"]]],"evidence":["Completed TRA / risk assessment report with scope and BIL","Risk treatment plan with owners and dates"]},{"id":"RM.3","title":"MTM shall maintain compliance with VPDSS and Franchise Agreement cybersecurity obligations, including implementing protective security measures, maintaining an approved PDSP, conducting regular maturity assessments, and promptly reporting and responding to data security breaches.","std":"Cybersecurity Risk & Compliance Standard","section":"Cyber Security Compliance","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A13023","refLabel":"Section 6. The Standard - Cyber Security Compliance","specs":[["RC.3.01","MTM must not act or engage in any practice that, contravenes the Victorian Protective Data Security Standards (VPDSS) nor omit anything that is required by the standard. (FA-T)","Baseline",["General"],["T04"]],["RC.3.02","For Cybersecurity, MTM has contractual obligations under the Franchise Agreement to comply with (FA-T): a) AS/NZS ISO 31000:2009 Risk Management Standard. b) AS/NZS ISO/IEC 27005:2012 Information technology – Security techniques - Information security risk management. c) Promptly notify DTP upon becoming aware of any non-compliance with any standard listed above (reference to (a) & (b)), together with details of the response or action which the Franchisee will take to remedy the non compliance; and d) Promptly notify DTP once a non-compliance has been remedied.","Baseline",["General"],["T04","T09"]],["RC.3.03","MTM must implement security measures to protect Personal Information and MTM important records from misuse, interference, loss, unauthorized access, modification, or disclosure, in accordance with the MTM Privacy Policy. (FA-T)","Baseline",["General"],["T02","T03","T04"]],["RC.3.04","MTM must ensure appropriate levels of security exist to ensure resistance from internal or external intrusion or attacks and ensure this level is maintained by regularly undertaking independent assessment of security risks. MTM must adopt appropriate business and operational control systems, security policies and standards consistent with the appropriate legislative requirements. (FA-O)","Baseline",["General"],["T05","T11"]],["RC.3.05","MTM must develop or update a Protective Data Security Plan (PDSP) once every 2 years. PDSP contain tactical and strategic plan that address the security risks identified in the SRPA. PDSP must be adequately address all relevant security considerations from VPDSS and ISO/IEC 27001:2013 (FA-T).","Baseline",["General"],["T04"]],["RC.3.06","PDSP must be approved by DTP and executed by MTM. It is required that MTM update the PDSP when there is any significant change in the operating environment, or security risks. (FA-T)","Baseline",["General"],[]],["RC.3.07","A maturity assessment against the VPDSS must be performed once every two years, alternating with the PDSP submission date. (FA-T)","Baseline",["General"],[]],["RC.3.08","As part of BAU, update on SRPA and PDSP will be provided in monthly DTP SMO meeting. (FA-T)","Baseline",["General"],[]],["RC.3.09","In an event of data breach, MTM must notify DTP in writing within one hour of becoming aware of the Data Security Breach. MTM must take all necessary steps to promptly remedy the Data Security Breach and reinstate any affected Data Systems or Data. MTM is required to comply with direction issued by DTP. (FA-T)","Baseline",["General"],["T04"]],["RC.3.10","OCMS works, including inspection task or routine maintenance task, must include any checks required in the Protective Data Security Plan in which case the reporting shall be against the timeframes stipulated in the Protective Data Security Plan. (FT-O)","Baseline",["General"],["T04"]]],"evidence":["VPDSS / PDSP control mapping or attestation for the system","Maturity assessment evidence","Incident or breach notification procedure"]},{"id":"ES.1","title":"MTM data classified as confidential or restricted shall be encrypted during transmission using approved encryption mechanisms and cryptographic protocols to preserve confidentiality and integrity when exchanged between systems, networks, users, and external parties.","std":"Encryption & Key Management","section":"Data Encryption in Transmission","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10492","refLabel":"Section 6. The Standard - Data Encryption in Transmission","specs":[["ES.1.01","When transmitting confidential (official-sensitive) or restricted (protected) classified data externally from MTM, it must be encrypted using approved ciphers and protocols (refer to the section on Cryptographic Algorithms and Protocols). (MTM","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T04"]],["ES.1.02","If encryption is required, the confidentiality and integrity of transmitted information must be protected throughout the entire process, using appropriate cryptographic mechanisms. (ISM/NIST)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T03","T04"]],["ES.1.03","If encryption is required, cryptographic mechanisms must be implemented to conceal or randomise communication patterns. (NIST/ISO27002)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T04"]],["ES.1.04","When transmitting confidential (official-sensitive) or restricted (protected) classified data internally within MTM, it should be encrypted using approved ciphers and protocols (refer to the section on Cryptographic Algorithms and Protocols). (MTM)","Recommended",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T04"]]],"evidence":["TLS / encryption-in-transit configuration or scan results","Certificate details for external interfaces","Data flow diagram showing encrypted channels"]},{"id":"ES.2","title":"MTM data classified as confidential or restricted shall be encrypted when stored in systems, databases, storage media, or cloud services, using approved encryption mechanisms to preserve confidentiality and integrity and reduce the risk of unauthorised access, disclosure, or modification.","std":"Encryption & Key Management","section":"Data Encryption at Rest","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10492","refLabel":"Section 6. The Standard - Data Encryption at Rest","specs":[["ES.2.01","To ensure the security of confidential (official-sensitive) or restricted (protected) classified data stored externally or in an external cloud service, it must be encrypted using approved ciphers and protocols (refer to the section on Cryptographic Algorithms and Protocols). (MTM)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.2.02","To ensure the security of confidential (official-sensitive) or restricted (protected) classified data stored within MTM Infrastructure, it should be encrypted using approved ciphers and protocols (refer to the section on Cryptographic Algorithms and Protocols). (MTM)","Recommended",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.2.03","When encrypting data at rest, MTM must use full disk encryption or partial encryption when the access control only allows writing to the encrypted partition. (ISM)","Recommended",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]]],"evidence":["Encryption-at-rest configuration for databases, storage and backups","Data classification showing which data is encrypted"]},{"id":"ES.3","title":"MTM systems shall use only approved cryptographic algorithms, protocols, and key strengths to ensure encryption mechanisms are appropriately implemented, remain effective, and align with recognised security standards and industry guidance.","std":"Encryption & Key Management","section":"Cryptographic Algorithms & Protocols","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10492","refLabel":"Section 6: The Standard - Cryptographic Algorithms & Protocols","specs":[["ES.3.01","The approved asymmetric/public key algorithms are as follows (ISM): a) Diffie-Hellman (DH) for agreeing on encryption session keys b) Digital Signature Algorithm (DSA) for digital signatures c) Elliptic Curve Diffie-Hellman (ECDH) for key exchange d) Elliptic Curve Digital Signature Algorithm (ECDSA) for digital signatures e) Rivest-Shamir-Adleman (RSA) for digital signatures and passing encryption session keys or similar keys. Note: ECDH and ECDSA should be used whenever possible","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.02","The only approved symmetric encryption algorithm is Advanced Encryption Standard (AES). When using AES for encryption, AES-128, AES-192 or AES-256 must be used, with a preference for AES-256. (ISM","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.03","The targets used to ensure the effective security strength of algorithms listed in this section must be at least 112 bits. (ISM)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.04","For Diffie–Hellman (DH), a minimum of 2048 bits is required (this provides 112 bits of effective security strength). (ISM)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.05","When using elliptic curve cryptography for session keys, a curve from FIPS 186-4 must be used. For ECDH, a base point order and key size of at least 224 bits are required, providing an effective security strength of 112 bits. Therefore, it is recommended to use NIST P-256, P-384, or P-521 curves, with a preference for the NIST P-384 curve. (ISM)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.06","When using RSA for digital signatures and passing encryption session keys or similar keys, a modulus of at least 2048 bits is used, with a preference for 3072 bits, providing an effective security strength of 112 bits. (ISM)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.07","The only approved hashing algorithm is Secure Hashing Algorithm 2 (SHA-2). When using SHA-2 for hashing, an output size of at least 224 bits is required, with a preference for SHA 384. (ISM)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.08","The approved Cryptographic Protocols are as follows: a) Transport Layer Security (TLS) 1.2 and above b) Secure Shell (SSH) version 2.0 c) Secure/Multipurpose Internet Mail Extension (S/MIME) version 2.0 d) OpenPGP Message Format e) Internet Protocol Security (IPsec) f) Wi-Fi Protected Access 2 g) Wi-Fi Protected Access 3.","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.09","Only TLS 1.2 and above must be used for TLS connections. TLS must be configured as follows: a) AES-GCM is used for encryption of TLS connections. b) Only server-initiated secure renegotiation is used for TLS connections. c) DH or ECDH is used for key establishment of TLS connections. d) When using DH or ECDH for key establishment of TLS connections, the ephemeral variant is used. e) Anonymous DH is not used for TLS connections. f) SHA-2-based certificates are used for TLS connections. g) SHA-2 is used for the Hash-based Message Authentication Code (HMAC) and pseudorandom function (PRF) for TLS connections. h) TLS compression is disabled for TLS connections. i) Perfect Forward Secrecy (PFS) is used for TLS connections.","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.10","SSH version 2 must be used. SSH must be configured as follows: a) Public key-based authentication is used for SSH connections. b) SSH private keys are protected with a passphrase or a key encryption key. c) SSH Daemon listen on the required interfaces (ListenAddress xxx.xxx.xxx.xxx) d) SSH Daemon has a suitable login banner (Banner x) e) SSH Daemon a login authentication timeout of no more than 60 seconds (LoginGraceTime 60) f) SSH Daemon disable host-based authentication (HostbasedAuthentication no) g) SSH Daemon disable rhosts-based authentication (IgnoreRhosts yes) h) SSH Daemon disable the ability to login directly as root (PermitRootLogin no) i) SSH Daemon disable empty passwords (PermitEmptyPasswords no) j) SSH Daemon disable connection forwarding (AllowTCPForwarding no) k) SSH Daemon disable gateway ports (GatewayPorts no) l) SSH Daemon disable X11 forwarding (X11Forwarding no).","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.11","IPsec can be operated in tunnel mode or transport mode. The tunnel mode of operation is preferred as it provides full encapsulation of IP packets while the transport mode of operation only encapsulates the payload of IP packets","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]],["ES.3.12","IPsec connection be secured as follows: a) Use ESP protocol is used for authentication and encryption. b) Use IKE version for key exchange. c) AES is used for encrypting IPsec connections, preferably ENCR_AES_GCM_16. d) PRF_HMAC_SHA2_256, PRF_HMAC_SHA2_384 or PRF_HMAC_SHA2_512 is used for IPsec connections, preferably PRF_HMAC_SHA2_512. e) AUTH_HMAC_SHA2_256_128, AUTH_HMAC_SHA2_384_192, AUTH_HMAC_SHA2_512_256 or NONE (only with AES-GCM) is used for authenticating IPsec connections, preferably NONE. f) DH or ECDH is used for key establishment of IPsec connections, preferably 384-bit random ECP group, 3072-bit MODP Group or 4096-bit MODP Group. g) A security association lifetime of less than four hours (14400 seconds) is used for IPsec connections. h) PFS is used for IPsec connections","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T03","T04"]]],"evidence":["Cryptographic configuration showing approved algorithms and key lengths","Scan results showing weak protocols (for example TLS 1.0/1.1) are disabled"]},{"id":"ES.4","title":"MTM cryptographic keys and certificates shall be securely managed throughout their lifecycle, including generation, storage, distribution, use, renewal, revocation, recovery, and destruction, to maintain the confidentiality and integrity of encrypted information.","std":"Encryption & Key Management","section":"Key Management","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10492","refLabel":"Section 6: The Standard - Key Management","specs":[["ES.4.01","If cryptographic keys are being used, a cryptographic key management process and procedure are required to ensure the secure generation, registration, distribution, installation, usage, protection, storage, access, recovery, and destruction of cryptographic keys. (ISM)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T04","T12"]],["ES.4.02","Cryptographic private keys must be securely stored, ensuring that only authorised personnel have access to these cryptographic keys. (MTM)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T02","T04","T12"]],["ES.4.03","For publicly accessible services, only public key certificates from approved certificate service providers can be used. These certificates must have a validity period of no more than 398 days (13 months). (NIST/ MTM","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T09","T12"]],["ES.4.04","Keys generated for internal use must be generated by MTM Certificate Authority. Certificates must have a validity period of not more than 5 years. (MTM)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T12"]],["ES.4.05","An established process must be available to guarantee the revocation of certificates and keys in instances of compromise, obsolescence, or when certificate holders depart from the organization. (MTM)","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T12"]],["ES.4.06","An established process must be available to guarantee the revocation of certificates and keys in instances of compromise, obsolescence, or when certificate holders depart from the organization. (MTM)","Recommended",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server","Database"],["T12"]]],"evidence":["Key and certificate inventory with owners and expiry dates","Key management procedure (generation, storage, rotation, revocation)","Evidence of key storage (for example HSM or key vault configuration)"]},{"id":"IA.1","title":"Systems and applications shall ensure that only authorized users are granted appropriate access to systems, applications, and data. User access shall be managed, logged, reviewed, and revoked throughout the account lifecycle to protect organizational assets from unauthorized use.","std":"Identity and Access Management","section":"User Access Management","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10102","refLabel":"Section 6: The Standard - User Access Management","specs":[["IA.1.01","A user provisioning and de-provisioning process shall be implemented to enable assignment of access rights. Access will only be granted when request has been validated and approved. (ISO, NIST, MTM, ISM)","Baseline",["General","Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail","Database"],["T02"]],["IA.1.02","Users shallonly be provided with access that they are authorized to use. No access to any resources or services will be granted without authorisation. (ISM, MTM, ISO)","Baseline",["General","Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail","Database"],["T02","T03","T04","T10","T12"]],["IA.1.03","Access controls shall be implemented based on the principles of least-privilege and need-to-know. Allowing only authorized accesses for users that are necessary to accomplish assigned organisational tasks. (VPDSS, NIST)","Baseline",["General","Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail","Database"],["T02","T03","T04","T10","T12"]],["IA.1.04","Based on the Segregation of Duties (SOD) principle, conflicting duties and areas of responsibility should be segregated to reduce opportunities for unauthorized or unintentional modification or misuse of the organisation’s assets. (ISO, MTM)","Recommended",["General","Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail","Database"],["T02","T03","T04","T10","T12"]],["IA.1.05","There is a unique identifier for each login session. Session timeout shall be configured to 4 hours (idle) or less (excluding service account). (NIST, MTM)","Baseline",["General","Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail"],["T02"]],["IA.1.06","There shall be audit logging for the administration of account (e.g. creation, modification, enabling, disabling, and removal actions). (NIST)","Baseline",["General","Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail"],["T03","T10"]],["IA.1.07","There shall be audit logging for successful and failed login attempts. (MTM)","Baseline",["General","Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail"],["T02","T10"]],["IA.1.08","All accounts to systems and applications shall be disabled within 30 days when (ISO, ISM, MTM), a) Personnel Leave MTM, b) Personnel reached contract completion, c) Account no longer associated with a user or individual, d) Account is in violation of organisational policy, or e) Account is inactive for 90 days.","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail"],["T02","T09","T10"]],["IA.1.09","Account shall be deleted when an account is no longer required after 180 days. (MTM)","Baseline",["General","Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail"],["T02"]],["IA.1.10","Asset owners shall revalidate and review users access rights at least once a year. This includes the review of privileges assigned and to validate the need for such privileges; and reassign or remove privileges, if necessary, to correctly reflect organisational mission and business needs. (ISO, MTM)","Baseline",["General","Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail"],["T02"]],["IA.1.11","All default accounts are disabled, renamed, or have their credentials changed.","Baseline",["General","Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","E-mail"],["T12"]]],"evidence":["User access request and approval records","Current user access list for the system","Most recent user access review","Joiner, mover and leaver records showing timely removal"]},{"id":"IA.2","title":"Privileged access shall be authorized, restricted to personnel with a valid operational need, and managed using dedicated privileged accounts. All privileged activities shall be authenticated, logged, reviewed and revoked when no longer required.","std":"Identity and Access Management","section":"Privileged User Account","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10102","refLabel":"Section 6: The Standard - Privileged Access Management","specs":[["IA.2.01","Request for privileged user access to systems, applications and data repositories will only be granted when request has been authorised. (ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.2.02","Restrict privileged user accounts on the system to authorised personnel in accordance with the Least Privilege principle. (ISO/NIST) a) Privileged user access shall be restricted to users who have a valid operational requirement and are unable to perform the job function with a standard user account. b) Privileged users are assigned a dedicated privileged account to be used solely for tasks requiring privileged access. c) Privileged users shall only use a standard user account, and not privilege user account, for regular day-to-day business use.","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.2.03","Privileged users should use separate privileged and unprivileged operating environments. Using different physical workstations is the most secure approach to separating privileged and unprivileged operating environments for system administrators. However, a virtualisation-based solution may be sufficient for separating privileged and unprivileged operating environments. (ISM, MTM, VPDSS)","Recommended",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.2.04","The privilege user account shall be disabled or removed when it is no longer required. (ISM, MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.2.05","MTM authorised identity and access solution (e.g. Privilege Access Management) shall be used for privileged user account management. An inventory of all privileged user accounts to production systems shall be classified, protected and hosted. The inventory shall be updated to identify new or changed accounts. (MTM)","Recommended",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.2.06","Privileged user access to MTM systems shall comply with the following: a) Shall be centrally managed through MTM authorised identity and access solution, b) Password rotated in accordance with MTM password requirement, c) Logged and record all activities performed by Administrator, and d) Logout immediately once tasks have been completed.","Recommended",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.2.07","Privilege access should be authenticated using multi-factor authentication.","Recommended",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.2.08","Usage of Privileged user accounts shall comply with the following (MTM): a) Shall never have an associated mailbox, b) Shall never have access to email, c) Shall never be used for running scheduled tasks (consider service accounts), and d) Shall never be shared.","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.2.09","Local administrator privileges shall not be granted to MTM Standard user accounts. (MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.2.10","All privileged access and activities shall be logged and periodically reviewed to detect unauthorized or inappropriate use. (MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]]],"evidence":["Privileged account list with named owners","Privileged access approval records","Privileged activity logs or PAM session records","Privileged access review results"]},{"id":"IA.3","title":"Service accounts shall be authorized, uniquely assigned to specific systems or applications, restricted to the least privileges required for their function, not used for user logins or day-to-day operations, and removed when no longer required.","std":"Identity and Access Management","section":"Service Account","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10102","refLabel":"Section 6: The Standard - Service Account Management","specs":[["IA.3.01","Request for service account can only be granted when request has been authorised. (ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02"]],["IA.3.02","Restrict service account on the system in accordance with the least privilege principle, which privileges are assigned solely for tasks requiring the access. (ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02"]],["IA.3.03","Unique service account is required for each system and/or application. (MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],[]],["IA.3.04","The service account shall be removed when it is no longer required. (ISM, MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],[]],["IA.3.05","Usage of service accounts shall never be used for user logins nor day-to-day operations. (MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02"]]],"evidence":["Service account register with owner, purpose and privileges","Configuration showing interactive log-on is blocked for service accounts","Service account review records"]},{"id":"IA.4","title":"The use of shared accounts shall be prohibited unless formally approved through an exception. Where shared accounts are permitted, they shall have a designated owner, their usage shall be traceable to individual users, and account credentials shall be managed to prevent unauthorized access.","std":"Identity and Access Management","section":"Shared User Account","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10102","refLabel":"Section 6: The Standard - Shared Account Management","specs":[["IA.4.01","The use of shared user accounts is strictly prohibited and require an exception if used.","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02"]],["IA.4.02","The usage of shared user account requires the following controls to be in place (ISM, NIST, MTM): a) All shared user accounts shall be assigned an owner. Owner is responsible for the account. Owner is responsible for the delegation and authorisation of its use. b) Shared account authenticators shall be changed when individuals or entity are removed from the group c) A tracking mechanism or a manual logbook must be used to track the usage of shared account. Log shall include the identity of the personnel or entity using the account and the date/time of usage.","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T10"]]],"evidence":["Approved exception for any shared account","Shared account register with owner","Evidence linking shared account use to individuals (checkout logs)"]},{"id":"IA.5","title":"Temporary and contractor access shall be authorized, restricted to the minimum access required to perform assigned duties, granted for a defined period with an expiry date, and automatically disabled upon expiration unless formally extended with approval.","std":"Identity and Access Management","section":"Temporary & Contractor User Account","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10102","refLabel":"Section 6: The Standard - Temporary & Contractor Access Management","specs":[["IA.5.01","When personnel are granted temporary or contractor access to a system, their access shall be restricted to only data required for them to undertake their duties. (ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T09"]],["IA.5.02","Temporary access shall be enabled with an expiry date not exceeding 30 Days. (NIST/MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],[]],["IA.5.03","Contractor access shall be enabled with an expiry date not exceeding the duration of contractor's engagement in a project. (MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T09"]],["IA.5.04","All temporary and contractor access shall be disabled upon account expiration and may only be extended with approval. (MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T09"]]],"evidence":["Contractor / temporary account list with expiry dates","Approval records for temporary access","Evidence of automatic disabling at expiry"]},{"id":"IA.6","title":"Emergency accounts shall only be used when normal or privileged authentication processes are unavailable, and their credentials shall be changed immediately after use to prevent unauthorized access.","std":"Identity and Access Management","section":"Emergency Accounts","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10102","refLabel":"Section 6: The Standard - Emergency Account Management","specs":[["IA.6.01","Emergency accounts are only used when normal or privilege user authentication processes cannot be used. (ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02"]],["IA.6.02","Emergency account authenticators shall be changed by the account owner after they are used. (ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],[]]],"evidence":["Emergency (break-glass) account procedure","Emergency account use log","Evidence credentials were changed after each use"]},{"id":"IA.7","title":"Systems and applications shall enforce strong password and credential management controls to ensure passwords are complex, unique, securely generated, protected during storage and transmission, changed when compromised or reset, and safeguarded from unauthorized disclosure.","std":"Identity and Access Management","section":"Password Management","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10102","refLabel":"Section 6: The Standard - Password and Credential Management","specs":[["IA.7.01","MTM should employ automated tools for strong password generation (NIST)","Recommended",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.7.02","Passwords are not based on words found in a dictionary, including foreign language, or exist in a language as slang, dialect, or jargon. Passwords are not a list of categorised words; do not form a real sentence in a natural language; and are not constructed from song lyrics, movies, literature or any other publicly available material. (MTM/ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.7.03","Passwords for separate systems shall be unique, unpredictable, and not reused. (MTM, ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.7.04","All MTM user account passwords a. Minimum Password Length: 12 characters (No Null Password) b. Password Complexity required and shall contain characters from three of the following four categories: Uppercase alphabetic characters (A-Z), Lowercase alphabetic characters (a-z), Numerical characters (0-9), Special characters: ~!@#$%^&*_-+=`|\\(){}[]:;\"'<>,.?/ c. Password History: 8 passwords remembered d. Minimum Password Age: 0 e. Maximum Password Age: 365 days f. Password Never Expires: Not Permitted g. Account Lockout Threshold: 3 invalid attempts h. Account Lockout Duration: 30 minutes i. Reset Account Lockout Counter After: 30 minutes Administrator and Privilege User Account Password control is the same as MTM User Account, except for the following: a. Minimum Password Length: 20 b. Maximum Password Age: 30 days (MTM, CyberArk)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.7.05","Service Account password, Emergency Account password and Key Management password shall be at least 20 characters long.","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.7.06","Credentials provided to users shall be changed on first use. (ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.7.07","Password shall be stored in a format that cannot be reversed. An example is storing the password using a salted keyed hash. (NIST, ISM, MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.7.08","Passwords shall be transmitted over encrypted channels (cryptographically protected). (NIST)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.7.09","Require immediate selection of a new password upon account recovery or reset (NIST, MTM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.7.10","Passwords are required to be changed if (MTM): a) They are directly compromised, b) They are suspected of being compromised, c) They appear in an online data breach database, d) They are discovered stored on networks in the clear, or e) They are discovered being transferred across networks in the clear. f) Using of weak password is detected. Note: User will be contacted by MTM OCMS and forced to change their password within 14 days of detection if any of the above are detected by security operations.","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.7.11","The display and printing of passwords shall be masked, suppressed, or otherwise obscured so that unauthorised parties will not be able to observe or subsequently recover them. (CyberArk)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]]],"evidence":["Password policy configuration export (length, complexity, history, lockout)","Evidence that default passwords were changed","Password storage method (hashing) confirmation"]},{"id":"IA.8","title":"Multi-factor authentication shall be implemented for access to internet-facing systems and applications that process, store, or transmit MTM data. The authentication mechanism shall be resistant to verifier impersonation, and all successful and unsuccessful authentication events shall be logged.","std":"Identity and Access Management","section":"Multi-factor Authentication","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10102","refLabel":"Section 6: The Standard - Multi-factor Authentication","specs":[["IA.8.01","Multi-factor authentication shall be resistant to verifier impersonation. (ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.8.02","If authentication is required, multi-factor authentication shall be used to authenticate to internet-facing services and application that process, store or communicate MTM data (MTM/ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.8.03","Multi-factor authentication should be used to authenticate users accessing data repositories that is classified as Protected (BIL-3) or Secret (BIL-4). (ISM)","Recommended",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]],["IA.8.04","Successful and unsuccessful multi-factor authentications are logged. (ISM)","Baseline",["Physical","Network","Host","Server","Cloud","Desktop/End User","Application","Virtualisation","Database"],["T02","T03","T04","T10","T12"]]],"evidence":["MFA configuration for internet-facing and remote access","MFA enrolment report for users","Authentication logs showing MFA success and failure events"]},{"id":"MB.1","title":"MTM-managed mobile devices must be managed, hardened, and protected through approved security controls. Controls must prevent unauthorised software installation and modification of security settings.","std":"Mobile Device and BYOD Security Standard","section":"Security for MTM-Managed Mobile Devices","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10487","refLabel":"Section 6: The Standard - Security for MTM-Managed Mobile Devices","specs":[["MB.1.01","All MTM-managed Mobile Devices, such as smartphones, tablets, and laptops, must be enrolled and centrally managed by a Mobile Device Management solution. The following minimum-security controls must be implemented for MTM-managed Mobile Devices: a) Devices must have the MTM-approved standard operational environment (SOE) installed and configured. b) MTM security controls must be in place to protect the devices from external threats and malware. c) Security updates should be regularly updated in accordance with MTM patch cadence. d) Devices must be protected with password authentication as per the MTM Standard or with multifactor authentication.","Baseline",["Mobile"],["T02","T07","T08","T12"]],["MB.1.02","MTM-managed Mobile Devices must prevent personnel from installing or uninstalling non approved applications.","Baseline",["Mobile"],["T07","T08"]],["MB.1.03","MTM-managed Mobile Devices must prevent personnel from disabling or modifying security functionality once provisioned. (ISM)","Baseline",["Mobile"],["T02","T03"]],["MB.1.04","Users and asset owners of MTM are accountable for any information that is stored or transmitted through MTM-managed Mobile Devices.","Baseline",["Mobile","General"],["T10"]],["MB.1.05","To prevent unauthorised access to MTM information, full storage encryption must be enabled on all MTM-managed Mobile Devices.","Baseline",["Mobile"],["T02","T04"]],["MB.1.06","All MTM-managed mobile devices must be locked and protected by a PIN code (minimum 6 digits), password, or Face ID. The mobile device needs to be automatically locked after a maximum of 3 minutes of inactivity.","Baseline",["Mobile"],["T12"]],["MB.1.07","All MTM-managed Mobile Devices must be asset labelled with a MTM contact details. This is to ensure that lost and found devices can be returned to MTM.","Baseline",["Mobile"],["T02"]],["MB.1.08","Deregistration of MTM-managed Mobile Devices must erase all MTM information.","Baseline",["Mobile"],["T04"]],["MB.1.09","Jailbroken/Rooted mobile devices are not permitted to connect to, or access MTM information systems/assets.","Recommended",["Mobile"],["T02","T08"]],["MB.1.10","Sideloading or transferring of files between two devices, in particular between a system and a mobile device, are not permitted in MTM.","Recommended",["Mobile"],["T07","T13"]],["MB.1.11","All MTM-managed mobile devices should be configured to remain undiscoverable to other Bluetooth devices except during Bluetooth pairing.","Recommended",["Mobile"],["T02","T14"]],["MB.1.12","Web content filtering should be applied to inbound web traffic (ISM): a) filter potentially harmful web-based content, b) block malicious, dynamic, and anonymously registered domain names, c) block files identified as malicious, or those that cannot be inspected, and d) block attempts to access websites through IP addresses instead domain names.","Recommended",["Mobile","Network"],["T06","T07"]]],"evidence":["MDM enrolment and compliance report for managed devices","MDM policy configuration (encryption, passcode, app restrictions)"]},{"id":"MB.2","title":"BYOD (Bring-You-Own-Device) access to MTM systems, services, and information must be restricted to approved MTM services and segregated from MTM internal networks. Asset owners are responsible for maintaining the functionality and security of their BYOD devices.","std":"Mobile Device and BYOD Security Standard","section":"Provision for BYOD","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10487","refLabel":"Section 6: The Standard - Provision for BYOD","specs":[["MB.2.01","Users are responsible for keeping BYOD operating system (e.g.: Apple IOS) and application up to date.","Baseline",["Mobile"],["T07","T08"]],["MB.2.02","MTM Office 365 Service will be available for BYOD. Multi-factor authentication is required to access MTM Office 365 Services.","Baseline",["Mobile","Cloud"],["T02","T12"]],["MB.2.03","Only approved Internet Accessible MTM Services are given access to BYOD. Multi-factor authentication is required to access these services.","Baseline",["Mobile","Cloud"],["T02","T12"]],["MB.2.04","All BYOD to MTM network must terminate in a guest network or inside a DMZ zone. These networks are separated from MTM internal network. BYOD device must not be given direct connectivity to MTM internal network.","Baseline",["Mobile","Network"],["T11"]],["MB.2.05","BYOD connection to MTM internal network and resource can only be accessible through MTM virtual desktop solution (e.g. Citrix). Local client-side drive and clipboard redirection must be prohibited when connecting via MTM virtual desktop solution.","Baseline",["Mobile","Application"],["T02","T04"]],["MB.2.06","All non-MTM managed device connectivity session to MTM network and application must be logged.","Baseline",["Mobile","Network"],["T10","T11"]],["MB.2.07","Asset Owner is responsible for the functionality of non-MTM managed device. MTM does not bear responsibility for the functionality and problems related to non-MTM managed device, and MTM do not provide support for these devices.","Baseline",["Mobile"],[]],["MB.2.08","Solution should be in place to enforce controls to prevent users from copying, pasting and downloading MTM data onto BYOD. (e.g. Microsoft Cloud App Security)","Recommended",["Mobile","Application","Cloud"],["T04"]]],"evidence":["BYOD access policy and user agreements","Conditional access configuration limiting BYOD to approved services","Network configuration showing BYOD is segregated"]},{"id":"NS.1","title":"MTM network infrastructure shall be securely designed, configured, and managed to ensure network security controls are consistently applied and protected from unauthorised change.","std":"Network Security Management","section":"Secure Network Configuration and Management","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10450","refLabel":"Section 6: The Standard - Secure Network Configuration and Management","specs":[["NS.1.01","For any new OCMS project, network design must be documented and that the document should include both architectural and data flow(s) details. (MTM)","Baseline",["Network","Virtualisation","Cloud"],["T02","T11"]],["NS.1.02","Responsibilities and procedures for the management of networking equipment must be established (NIST/MTM/ISM)","Baseline",["Network","Virtualisation","Cloud"],["T10"]],["NS.1.03","Security mechanisms, service levels and management requirements of all network services must be identified and included in network services agreements, whether these services are provided in-house or outsourced. (ISO27002)","Baseline",["Network","Virtualisation","Cloud"],["T09"]],["NS.1.04","Only privileged administrators are allowed to enable and disable security configurations and policy. (NIST/MTM/ISM)","Baseline",["Network","Virtualisation","Cloud"],["T02"]],["NS.1.05","Unused services and ports on network devices must be disabled. (NIST/MTM)","Baseline",["Network","Virtualisation","Cloud"],["T14"]],["NS.1.06","Network must be configured to prevent incomplete transmission, misrouting, unauthorised message alteration, unauthorised disclosure, unauthorised message duplication or replay. (ISO27002)","Baseline",["Network","Virtualisation","Cloud"],["T02"]],["NS.1.07","All Network Management traffic must be encrypted. (MTM)","Baseline",["Network","Virtualisation","Cloud"],["T04"]],["NS.1.08","Where addresses are allocated dynamically, standardize dynamic address allocation lease information and the lease duration must be assigned to devices (NIST)","Baseline",["Network","Virtualisation","Cloud"],["T14"]],["NS.1.09","Terminate the network connection at the end of communication session [NIST/MTM].","Baseline",["Network","Virtualisation","Cloud"],["T11"]],["NS.1.10","Use Simple Network Management Protocol (SNMP) version 3 on networks, ensuring that data packets are authenticated and encrypted over the network. (ISO27002/NIST/MTM/ISM)","Baseline",["Network","Virtualisation","Cloud"],["T04"]],["NS.1.11","There is a standard operating environments (SOEs) for all network assets. (VPDSS/MTM)","Baseline",["Network","Virtualisation","Cloud"],["T08"]],["NS.1.12","All security events for network devices must be logged and monitored. (MTM)","Baseline",["Network","Virtualisation","Cloud"],["T02","T10","T14"]]],"evidence":["Network device configuration baseline","Change records for network configuration changes","Configuration backup and review records"]},{"id":"NS.2","title":"Network boundaries shall be protected using approved gateway, firewall, and threat protection controls to restrict unauthorised access and regulate data flows between MTM networks and untrusted networks.","std":"Network Security Management","section":"Network Perimeter Security","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10450","refLabel":"Section 6: The Standard - Network Perimeter Security","specs":[["NS.2.01","Network access controls must prevent the connection of unauthorised network devices and limit network traffic to only those required for business purpose. (ISM/MTM/NIST)","Baseline",["Network","Virtualisation","Cloud"],["T02"]],["NS.2.02","Gateway controls must be designed to regulate data flows to (ISM/MTM): a) separate networks belonging to different security domains and untrusted network, b) only allow explicitly authorised data flows, and c) inspect and filter data flows at the transport and above network layers.","Baseline",["Network","Virtualisation","Cloud"],["T02"]],["NS.2.03","Network IDS or IPS must be used on gateways between MTM’s networks and any public or untrusted network. (ISM/MTM/NIST)","Baseline",["Network","Virtualisation","Cloud"],["T02","T11"]],["NS.2.04","Firewall must be used to ensure separation between MTM’s networks and any public or untrusted network. (ISM/MTM/NIST)","Baseline",["Network","Virtualisation","Cloud"],["T11"]],["NS.2.05","Firewall must be designed with the following filtering rules (ISM/IEC62443/MTM): a) deny network traffic by default, and b) deny access requests via untrusted networks unless explicitly approved.","Baseline",["Network","Virtualisation","Cloud"],["T11"]],["NS.2.06","Information transmitted between MTM’s networks, and any public or untrusted network must be encrypted. (MTM)","Baseline",["Network","Virtualisation","Cloud"],["T04"]],["NS.2.07","A demilitarised zone is required for any external access to MTM’s services.","Baseline",["Network","Virtualisation","Cloud"],["T11"]],["NS.2.08","Denial-of-Service & Distributed Denial-of-Service prevention must be established at network boundary (IEC62443/MTM): a) capability to restrict the ability to cause DoS/DDoS events b) be equipped to provide the capability to manage communication loads (such as using rate limiting) to mitigate the effects of information and/or message flooding types of DoS/DDoS events, and provide the capability to operate in a degraded mode during a DoS/DDoS event.","Baseline",["Network","Virtualisation","Cloud"],["T05"]],["NS.2.09","Web content filtering must be applied to outbound web traffic to (ISM): a) filter potentially harmful web-based content, b) block malicious, dynamic, and anonymously registered domain names, c) block files identified as malicious, or those that cannot be inspected, and block attempts to access websites through IP addresses instead domain names.","Baseline",["Network","Virtualisation","Cloud"],["T06","T07"]],["NS.2.10","All web access must be logged using web proxies, including that by internal servers, and must be protected from unauthorised access and modification. (ISO27002/NIST/MTM/ISM)","Recommended",["Network","Virtualisation","Cloud"],["T02","T03"]],["NS.2.11","Authenticated proxy servers are required to route all internal communications traffic to external networks. (ISM/MTM/NIST)","Recommended",["Network","Virtualisation","Cloud"],["T11"]],["NS.2.12","IPv6 tunnelling must be blocked by network security appliances at externally connected network boundaries. (ISM/MTM/NIST)","Recommended",["Network","Virtualisation","Cloud"],["T11"]]],"evidence":["Firewall rule set export for the system's boundary","Firewall rule review records","Network diagram showing boundary devices"]},{"id":"NS.3","title":"MTM networks shall be segmented and segregated based on security domain, system criticality, and data sensitivity to control information flows and reduce the risk of unauthorised access or lateral movement.","std":"Network Security Management","section":"Network Segmentation","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10450","refLabel":"Section 6: The Standard - Network Segmentation","specs":[["NS.3.01","Authorised the flow of information between subnetworks only when there is a business requirement with approval. (NIST/MTM)","Recommended",["Network","Virtualisation","Cloud"],["T02"]],["NS.3.02","Control system networks should be segmented from non-control system networks. (IEC62443)","Recommended",["Network","Virtualisation","Cloud"],["T02"]],["NS.3.04","Networks must be segmented and segregated. Networks must be segregated into network zones according to the criticality of servers, services and data. (ISM)","Recommended",["Network","Virtualisation","Cloud"],["T02","T04"]],["NS.3.05","Network devices managing VLANs belonging to different security domains do not share VLAN trunks. (ISM)","Recommended",["Network","Virtualisation","Cloud"],["T02"]],["NS.3.06","Organisation’s networks are segregated from their service providers’ networks. (ISM)","Recommended",["Network","Virtualisation","Cloud"],["T09"]],["NS.3.07","Information transmitted across each subnetwork should be encrypted. (MTM/NIST)","Recommended",["Network","Virtualisation","Cloud"],["T04"]],["NS.3.08","When transferring information between different subnetworks, integrity of information must be maintained. (NIST)","Recommended",["Network","Virtualisation","Cloud"],["T03"]],["NS.3.09","MTM information security tools, mechanisms, and support components must be on separate subnetwork from other internal system components. (NIST/MTM)","Recommended",["Network","Virtualisation","Cloud"],["T04"]]],"evidence":["Network segmentation diagram (zones and VLANs)","Firewall or ACL rules between segments","Segmentation test or review results"]},{"id":"NS.4","title":"MTM-managed network and telecommunication infrastructure shall be designed and maintained with appropriate redundancy, alternate services, and power resilience to support agreed availability and recovery requirements.","std":"Network Security Management","section":"Network Availability","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10450","refLabel":"Section 6: The Standard - Network Availability","specs":[["NS.4.01","For MTM managed network and telecommunication infrastructure, alternate telecommunications services must be designed and implemented for the resumption of MTM network. This must be in accordance with recovery time objectives that is determined by Business. (NIST/VPDSS)","Baseline",["Network","Virtualisation","Cloud"],["T01"]],["NS.4.02","For MTM managed network and telecommunication infrastructure, alternate telecommunication services must be verified at least once a year. (NIST/VPDSS)","Baseline",["Network"],["T05"]],["NS.4.03","Primary and alternate telecommunications service agreements must be developed to contain priority-of-service provisions in accordance with MTM's availability requirements including recovery time objectives. (NIST/VPDSS)","Baseline",["Network"],["T01","T05"]],["NS.4.04","The capability to prevent any communication through the control system boundary when there is an operational failure of the boundary protection mechanisms (also termed fail close) must be provided. (IEC62443/MTM)","Baseline",["Network"],["T05"]],["NS.4.05","All network LAN Switch must have duplicated (uplink) fibre interfaces to neighbouring or higher-level switches to prevent loss of communication in the event of any single uplink interface port or cable core failure. (MTM)","Baseline",["Network"],["T05"]],["NS.4.06","All routers must be fitted with redundant power supplies. (MTM)","Baseline",["Network"],["T05"]],["NS.4.07","All network equipment and infrastructure must be connected to an uninterruptible power source (UPS). The UPS battery capacity shall provide a minimum of 2 hours backup operation time for the network. (MTM)","Baseline",["Network"],["T01","T05","T07"]],["NS.4.08","Primary and alternate telecommunications service providers must be required to have contingency plans that are reviewed to ensure compliance with MTM's contingency requirements. (NIST)","Recommended",["Network"],["T09"]],["NS.4.09","Evidence of contingency testing by primary and alternate telecommunications service providers must be obtained at least once a year. (NIST)","Recommended",["Network"],["T09"]]],"evidence":["Network redundancy design (diagram)","Power resilience (UPS / generator) evidence","Failover test results"]},{"id":"NS.5","title":"Remote access to MTM networks and systems shall be authenticated, encrypted, monitored, and terminated through approved demilitarised zones or managed interfaces.","std":"Network Security Management","section":"Remote Access","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10450","refLabel":"Section 6: The Standard - Remote Access","specs":[["NS.5.01","All user remote access connections must terminate within a DMZ. Direct remote user connections to systems within MTM networks is prohibited. (MTM)","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T11"]],["NS.5.02","Remote user access connections to OCS networks or systems must terminate in the OCS DMZ. (MTM)","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T11"]],["NS.5.02a","Remote access security controls must have the capability to disconnect at the end of a session. Session timeout for remote access must not be more than 30 minutes of user inactivity. (ISM)","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T11"]],["NS.5.03","Remote Access must be configured with strong authentication and authorization mechanisms to ensure only authenticated and authorized users are granted access. (NIST/MTM/ISM)","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T02","T11"]],["NS.5.04","Multi-Factor (MFA) Authentication must be implemented for user remote access from external network. (MTM)","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T02","T11","T12"]],["NS.5.05","Remote access security controls must prevent disclosure of information about remote access. (NIST/MTM/ISM)","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T04","T11"]],["NS.5.06","Remote access must be logged & monitored to detect any unauthorised access attempts. (NIST/MTM/ISM)","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T02","T11"]],["NS.5.07","Cryptographic mechanisms must be used to ensure confidentiality and integrity of remote access sessions. (NIST/MTM/ISM)","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T03","T04","T11"]],["NS.5.08","The execution of privileged commands and access to security-relevant information via remote access is required to ensure activities are logged in a format that provides assessable evidence. (NIST)","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T11","T12"]],["NS.5.09","Prevent split tunnelling for remote devices connecting to MTM systems unless the split tunnel is securely provisioned using MTM safeguards. (NIST)","Recommended",["Virtualisation","Cloud","Network","Server","Host"],["T11"]]],"evidence":["Remote access architecture (VPN / jump host / DMZ)","Remote access configuration showing MFA and encryption","Remote access session logs"]},{"id":"NS.6","title":"Wireless access shall be securely configured, encrypted, and segregated from MTM internal networks.","std":"Network Security Management","section":"Wireless Access","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10450","refLabel":"Section 6: The Standard - Wireless Access","specs":[["NS.6.01","All data transmitted over wireless network connections must be encrypted.","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T04"]],["NS.6.02","Public wireless networks must be segregated from MTM networks. (IEC62443)","Baseline",["Virtualisation","Cloud","Network","Server","Host"],["T02","T11"]],["NS.6.03","Default accounts and credentials on wireless access points must be changed during deployment. (ISM)","Baseline",["Network"],["T12"]],["NS.6.04","Default Service Set Identifier (SSID) for wireless access points (WAP) must be changed. (ISM)","Baseline",["Network"],["T11","T14"]],["NS.6.05","Configuration settings for wireless access points must be hardened. (ISM)","Baseline",["Network"],["T02"]],["NS.6.06","Wireless devices must be configured to require identification and explicit authorisation for access. (ISM)","Baseline",["Network"],["T02"]],["NS.6.07","Administrative interfaces on wireless access points must be disabled for wireless network connection. (ISM)","Baseline",["Network"],["T02"]],["NS.6.08","Unauthorised wireless devices must be identified, reported and removed. (IEC62443)","Recommended",["Network"],["T02"]],["NS.6.09","All wireless devices used must be Wi-Fi Alliance certified. (ISM/MTM)","Recommended",["Network"],["T08"]],["NS.6.10","SSIDs of non-public wireless networks must not be readily associated with an organisation, the location of their premises or the functionality of wireless networks. (ISM)","Recommended",["Network"],["T14"]]],"evidence":["Wireless configuration (encryption, authentication)","Evidence wireless is segregated from internal networks","Wireless access point inventory"]},{"id":"AU.1","title":"Key security events shall be logged accurately and with sufficient details to identify what occurred, when it occurred, where it occurred, the source of the event, and the user, system, or entity involved.","std":"Security Event Logging and Monitoring","section":"Security Event Logging","url":"https://cmsportal.metrotrains.com.au/docnum.aspx?id=A10465","refLabel":"Section 6: The Standard - Security Event Logging","specs":[["AU.1.01","The following security events must be logged on all system or application (NIST/ISO/MTM): a) Action to Add/Delete/Modify Users Accounts b) Password changes c) Failed logons and account lockouts, d) Unauthorised or failed access, e) Successful user logons and logoffs, f) Changes to security attributes/policies and configurations, g) Administrative and privileged action or usage, and h) System crash and error messages","Baseline",["Application","Cloud","Desktop/End User","E-mail","Network","Virtualisation","Host","Server"],["T02","T03","T10","T12","T14"]],["AU.1.02","Ensure that security event records contain information that establishes the following (NIST): a) What type of event occurred; b) When the event occurred; c) Where the event occurred; d) Source of the event; e) Event Description; and f) Identity of any individuals, subjects, or objects/entities associated with the event.","Baseline",["Application","Cloud","Host","Network","Physical","Server","Virtualisation","Database"],["T02","T10"]],["AU.1.03","An accurate time source must be established and used consistently across systems to assist with identifying connections between events.","Baseline",["Application","Cloud","Host","Network","
